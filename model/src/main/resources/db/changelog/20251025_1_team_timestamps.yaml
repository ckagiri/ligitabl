databaseChangeLog:
  - changeSet:
      id: 20251025_1_team_timestamps
      author: system
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: t_team
            schemaName: public
      changes:
        - addColumn:
            tableName: t_team
            schemaName: public
            columns:
              - column:
                  name: c_create_date
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: c_update_date
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION set_update_timestamp()
              RETURNS TRIGGER AS $$
              BEGIN
                NEW.c_update_date = now();
                RETURN NEW;
              END;
              $$ LANGUAGE plpgsql;
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DO $$
              BEGIN
                IF NOT EXISTS (
                  SELECT 1 FROM pg_trigger WHERE tgname = 'trg_t_team_update_ts'
                ) THEN
                  CREATE TRIGGER trg_t_team_update_ts
                  BEFORE UPDATE ON public.t_team
                  FOR EACH ROW
                  EXECUTE FUNCTION set_update_timestamp();
                END IF;
              END $$;
