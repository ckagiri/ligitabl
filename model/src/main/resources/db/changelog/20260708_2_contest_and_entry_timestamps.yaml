databaseChangeLog:
  - changeSet:
      id: 20260708_2_contest_timestamps
      author: system
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: t_contest
            schemaName: public
      changes:
        - addColumn:
            tableName: t_contest
            schemaName: public
            columns:
              - column:
                  name: c_create_date
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: true
              - column:
                  name: c_update_date
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: true
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DO $$
              BEGIN
                IF NOT EXISTS (
                  SELECT 1 FROM pg_trigger WHERE tgname = 'trg_t_contest_update_ts'
                ) THEN
                  CREATE TRIGGER trg_t_contest_update_ts
                  BEFORE UPDATE ON public.t_contest
                  FOR EACH ROW
                  EXECUTE FUNCTION set_update_timestamp();
                END IF;
              END $$;

  - changeSet:
      id: 20260708_3_entry_action_timestamps
      author: system
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: t_entry
            schemaName: public
      changes:
        # Event timestamps tied to the join/remove actions themselves (set explicitly by
        # EntryPersistenceAdapter at the moment they happen), not generic row create/update
        # lifecycle — no default value and no update trigger, unlike c_create_date/c_update_date.
        - addColumn:
            tableName: t_entry
            schemaName: public
            columns:
              - column:
                  name: c_joined_at
                  type: timestamp with time zone
                  constraints:
                    nullable: true
              - column:
                  name: c_removed_at
                  type: timestamp with time zone
                  constraints:
                    nullable: true
