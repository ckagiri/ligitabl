databaseChangeLog:
  - changeSet:
      id: 20260320_1_password_reset_token
      author: copilot
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: t_password_reset_token
                schemaName: public
      changes:
        - createTable:
            tableName: t_password_reset_token
            schemaName: public
            columns:
              - column:
                  name: pk_token
                  type: varchar(120)
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: fk_user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: c_expires_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: c_used
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: c_used_at
                  type: timestamp with time zone
                  constraints:
                    nullable: true
              - column:
                  name: c_created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: t_password_reset_token
            baseColumnNames: fk_user_id
            baseTableSchemaName: public
            constraintName: fk_password_reset_token_user_id
            referencedTableName: t_user
            referencedColumnNames: pk_id
            referencedTableSchemaName: public

        - sql:
            sql: |
              ALTER TABLE public.t_password_reset_token
              ADD CONSTRAINT ck_password_reset_token_expiry
              CHECK (c_expires_at > c_created_at)

        - createIndex:
            tableName: t_password_reset_token
            schemaName: public
            indexName: idx_password_reset_token_user
            columns:
              - column:
                  name: fk_user_id

        - createIndex:
            tableName: t_password_reset_token
            schemaName: public
            indexName: idx_password_reset_token_expires
            columns:
              - column:
                  name: c_expires_at

        - createIndex:
            tableName: t_password_reset_token
            schemaName: public
            indexName: idx_password_reset_token_used
            columns:
              - column:
                  name: c_used
