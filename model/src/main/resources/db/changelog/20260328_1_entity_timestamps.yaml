databaseChangeLog:
  - changeSet:
      id: 20260328_1_user_timestamps
      author: system
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: t_user
            schemaName: public
      changes:
        - addColumn:
            tableName: t_user
            schemaName: public
            columns:
              - column:
                  name: c_create_date
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: true
              - column:
                  name: c_update_date
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: true
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DO $$
              BEGIN
                IF NOT EXISTS (
                  SELECT 1 FROM pg_trigger WHERE tgname = 'trg_t_user_update_ts'
                ) THEN
                  CREATE TRIGGER trg_t_user_update_ts
                  BEFORE UPDATE ON public.t_user
                  FOR EACH ROW
                  EXECUTE FUNCTION set_update_timestamp();
                END IF;
              END $$;

