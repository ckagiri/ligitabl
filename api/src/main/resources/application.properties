# Application
spring.application.name=LigiPredictor Prediction League
server.port=8080

spring.web.resources.cache.cachecontrol.no-cache=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# DevTools: disable restart entirely for multi-module project stability.
# RestartClassLoader can't resolve classes from the model module, causing ClassNotFoundException.
# Thymeleaf live-reloads templates automatically (spring.thymeleaf.cache=false),
# and static resources (JS/CSS) don't need a restart.
spring.devtools.restart.enabled=false

# Logging
logging.level.root=INFO
logging.level.com.ligitabl=DEBUG
logging.level.org.springframework.web=DEBUG
