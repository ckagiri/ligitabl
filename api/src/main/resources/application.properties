# Application
spring.application.name=LigiPredictor Prediction League

spring.web.resources.cache.cachecontrol.no-cache=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# DevTools restart is off: its RestartClassLoader can't resolve the model module's classes.
# Templates live-reload anyway (spring.thymeleaf.cache=false), and static resources need no restart.
spring.devtools.restart.enabled=false

# Logging
logging.level.root=INFO
logging.level.com.ligitabl=INFO
logging.level.org.springframework.web=INFO
