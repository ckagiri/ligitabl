<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}"
>
  <body>
    <div layout:fragment="content">
      <div
        class="bg-white rounded-lg shadow-sm"
        th:with="
          cs=${currentSprint},
          cq=${currentQuarter},
          csFrom=${currentSprintFrom != null ? currentSprintFrom : 0},
          cqFrom=${currentQuarterFrom != null ? currentQuarterFrom : 0},
          nsFrom=${nextSprintFrom != null ? nextSprintFrom : 0},
          nqFrom=${nextQuarterFrom != null ? nextQuarterFrom : 0}
        "
        th:attr="data-current-sprint=${currentSprint != null ? currentSprint : ''},data-current-quarter=${currentQuarter != null ? currentQuarter : ''},data-selected-phase=${currentPhase},data-selected-group=${currentPhaseType}"
        x-data="{
          activeGroup: ({FULL_SEASON: 'fullSeason', QUARTER: 'quarters', SPRINT: 'sprints'})[$el.dataset.selectedGroup] || 'sprints',
          selectedPhase: $el.dataset.selectedPhase,
          loading: false,
          select(phase) {
            this.selectedPhase = phase;
            this.loading = true;
            htmx.ajax('GET', '/leaderboard?phase=' + phase, {
              target: '#leaderboard-content',
              swap: 'outerHTML'
            });
            history.pushState({}, '', '/leaderboard?phase=' + phase);
          }
        }"
        @htmx:after-swap.window="if ($event.detail.target && $event.detail.target.id === 'leaderboard-content') loading = false"
        @htmx:response-error.window="if ($event.detail.target && $event.detail.target.id === 'leaderboard-content') loading = false"
      >
        <!-- Header -->
        <div class="px-4 sm:px-6 py-4 border-b border-gray-200">
          <h1 class="text-xl sm:text-2xl font-bold text-gray-900 mb-4">
            Leaderboard
          </h1>

          <div class="space-y-2">
            <!-- Top-level group tabs -->
            <div class="flex gap-1.5">
              <button
                type="button"
                @click="activeGroup = 'fullSeason'; select('FS')"
                :class="activeGroup === 'fullSeason'
                  ? 'border-indigo-400 bg-indigo-50 text-indigo-700'
                  : 'border-gray-200 bg-white text-gray-600 hover:border-gray-300 hover:text-gray-900'"
                class="px-3 py-1.5 text-sm font-medium border rounded-md transition whitespace-nowrap"
              >
                Full Season
              </button>

              <button
                type="button"
                @click="activeGroup = 'quarters'; select($el.closest('[data-current-quarter]').dataset.currentQuarter)"
                :class="activeGroup === 'quarters'
                  ? 'border-indigo-400 bg-indigo-50 text-indigo-700'
                  : 'border-gray-200 bg-white text-gray-600 hover:border-gray-300 hover:text-gray-900'"
                class="px-3 py-1.5 text-sm font-medium border rounded-md transition whitespace-nowrap"
              >
                Quarters
              </button>

              <button
                type="button"
                @click="activeGroup = 'sprints'; select($el.closest('[data-current-sprint]').dataset.currentSprint)"
                :class="activeGroup === 'sprints'
                  ? 'border-indigo-400 bg-indigo-50 text-indigo-700'
                  : 'border-gray-200 bg-white text-gray-600 hover:border-gray-300 hover:text-gray-900'"
                class="px-3 py-1.5 text-sm font-medium border rounded-md transition whitespace-nowrap"
              >
                Sprints
              </button>
            </div>

            <!-- Quarter sub-tabs -->
            <div
              x-show="activeGroup === 'quarters'"
              x-cloak
              class="overflow-x-auto pb-1"
              style="-ms-overflow-style: none; scrollbar-width: none"
            >
              <div class="flex gap-1.5 min-w-max">
                <button
                  th:each="phase : ${phases}"
                  th:if="${phase.type != null and phase.type.name() == 'QUARTER'}"
                  type="button"
                  th:attr="data-phase=${phase.code}"
                  th:attrappend="data-is-next=${phase.from == nqFrom ? true : null}"
                  th:disabled="${nqFrom > 0 and phase.from > nqFrom}"
                  @click="!$el.disabled && select($el.dataset.phase)"
                  :class="selectedPhase === $el.dataset.phase
                    ? 'border-2 border-indigo-400 bg-indigo-50 text-indigo-700'
                    : ($el.disabled
                        ? 'border border-gray-100 bg-gray-50 text-gray-300 cursor-default pointer-events-none'
                        : ($el.dataset.isNext
                            ? 'border border-dashed border-indigo-300 bg-white text-indigo-400 hover:border-indigo-400 hover:text-indigo-600'
                            : 'border border-gray-200 bg-white text-gray-600 hover:border-gray-300 hover:text-gray-900'))"
                  class="flex flex-col items-center px-3 py-1.5 text-xs font-medium rounded-md transition whitespace-nowrap"
                >
                  <span class="font-bold" th:text="${phase.code}">Q2</span>
                  <span
                    class="text-[10px] opacity-75"
                    th:text="'GW ' + ${phase.from} + '–' + ${phase.to}"
                    >GW 10–19</span
                  >
                </button>
              </div>
            </div>

            <!-- Sprint sub-tabs -->
            <div
              x-show="activeGroup === 'sprints'"
              x-init="$nextTick(() => {
                const active = $el.querySelector('[data-active-sprint]');
                if (active) active.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
              })"
              class="overflow-x-auto pb-1"
              style="-ms-overflow-style: none; scrollbar-width: none"
            >
              <div class="flex gap-1.5 min-w-max">
                <button
                  th:each="phase : ${phases}"
                  th:if="${phase.type != null and phase.type.name() == 'SPRINT'}"
                  type="button"
                  th:attr="data-phase=${phase.code}"
                  th:attrappend="data-active-sprint=${phase.code == cs ? true : null},data-is-next=${phase.from == nsFrom ? true : null}"
                  th:disabled="${nsFrom > 0 and phase.from > nsFrom}"
                  @click="!$el.disabled && select($el.dataset.phase)"
                  :class="selectedPhase === $el.dataset.phase
                    ? 'border border-indigo-500 bg-indigo-600 text-white'
                    : ($el.disabled
                        ? 'border border-gray-100 bg-gray-50 text-gray-300 cursor-default pointer-events-none'
                        : ($el.dataset.isNext
                            ? 'border border-dashed border-indigo-300 bg-white text-indigo-400 hover:border-indigo-400 hover:text-indigo-600'
                            : 'border border-gray-200 bg-white text-gray-600 hover:border-gray-300 hover:text-gray-900'))"
                  class="flex flex-col items-center px-3 py-1.5 text-xs font-medium rounded-md transition whitespace-nowrap"
                >
                  <span class="font-bold" th:text="${phase.code}">S4</span>
                  <span
                    class="text-[10px] opacity-75"
                    th:text="'GW ' + ${phase.from} + '–' + ${phase.to}"
                    >GW 15–19</span
                  >
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Loading spinner — shown while htmx.ajax is in flight -->
        <div
          x-show="loading"
          x-cloak
          class="flex items-center justify-center py-16 gap-2 text-sm text-gray-400"
        >
          <svg
            class="animate-spin h-5 w-5 text-indigo-400"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8v8H4z"
            ></path>
          </svg>
          Loading...
        </div>

        <!--
          Stable wrapper — stays in the DOM, never swapped.
          x-show toggles visibility while loading.
          #leaderboard-content inside is the HTMX swap target.
        -->
        <div x-show="!loading">
          <div
            id="leaderboard-content"
            th:fragment="leaderboardContent"
            class="px-6 py-4"
          >
            <input
              th:if="${effectiveToRound != null}"
              type="hidden"
              id="effectiveToRound"
              name="effectiveToRound"
              th:value="${effectiveToRound}"
            />
            <input
              type="hidden"
              id="currentPhaseFrom"
              name="phaseFrom"
              th:value="${currentPhaseFrom}"
            />

            <div
              th:if="${#lists.isEmpty(leaderboard)}"
              class="py-16 text-center"
            >
              <div class="text-4xl mb-3">📭</div>
              <p class="text-sm font-medium text-gray-500">
                No data for this period.
              </p>
            </div>

            <style>
              @media (max-width: 639px) {
                .lb-pos-col { min-width: 56px !important; max-width: 56px !important; }
                .lb-table-scroll::-webkit-scrollbar { height: 3px; }
                .lb-table-scroll::-webkit-scrollbar-track { background: transparent; }
                .lb-table-scroll::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }
              }
            </style>

            <div
              th:if="${!#lists.isEmpty(leaderboard)}"
              class="overflow-x-auto lb-table-scroll"
            >
              <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                  <tr>
                    <th
                      scope="col"
                      class="lb-pos-col sticky left-0 z-20 bg-gray-50 px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-8"
                    >
                      <span class="hidden sm:inline">Pos</span>
                      <span class="sm:hidden">#</span>
                    </th>
                    <th
                      scope="col"
                      class="sticky left-[56px] z-20 bg-gray-50 px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-44 lg:w-56"
                    >
                      Player
                    </th>
                    <th
                      scope="col"
                      class="px-3 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider w-24"
                    >
                      Score
                    </th>
                    <th
                      scope="col"
                      class="px-3 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider w-24"
                    >
                      GW
                    </th>
                    <th
                      scope="col"
                      class="px-3 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider w-24"
                    >
                      <span class="hidden sm:inline">Zeroes</span>
                      <span class="sm:hidden" title="Zeroes">&#x00D8;s</span>
                    </th>
                    <th
                      scope="col"
                      class="px-3 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider w-20"
                    >
                      Swaps
                    </th>
                    <th
                      scope="col"
                      class="px-3 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider w-20"
                    >
                      Best
                    </th>
                    <th
                      scope="col"
                      class="px-3 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider w-24"
                    >
                      Movement
                    </th>
                  </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                  <tr
                    th:each="entry : ${leaderboard}"
                    th:classappend="${userPosition != null && entry.publicId == userPosition.publicId ? 'bg-indigo-50 border-l-4 border-indigo-500' : ''}"
                    class="group hover:bg-gray-50 transition"
                  >
                    <td
                      class="lb-pos-col sticky left-0 z-10 px-3 py-4 whitespace-nowrap text-sm font-bold"
                      th:classappend="${userPosition != null && entry.publicId == userPosition.publicId ? 'bg-indigo-50 text-indigo-900' : 'bg-white group-hover:bg-gray-50 text-gray-900'}"
                    >
                      <span
                        th:if="${userPosition != null && entry.publicId == userPosition.publicId}"
                        class="text-indigo-600 mr-1.5 text-base"
                        >🔹</span
                      >
                      <span th:if="${entry.scored}" th:text="${entry.position}"
                        >1</span
                      >
                      <span th:if="${!entry.scored}" class="text-gray-400"
                        >—</span
                      >
                    </td>

                    <td
                      class="sticky left-[56px] z-10 px-3 py-4 whitespace-nowrap w-44 lg:w-56"
                      th:classappend="${userPosition != null && entry.publicId == userPosition.publicId ? 'bg-indigo-50' : 'bg-white group-hover:bg-gray-50'}"
                    >
                      <div class="flex flex-col">
                        <button
                          hx-post="/leaderboard/user/modal"
                          hx-target="#user-detail-modal"
                          hx-swap="innerHTML"
                          hx-include="#effectiveToRound, #currentPhaseFrom"
                          th:attr="hx-vals='js:{publicId: &quot;' + ${entry.publicId} + '&quot;, displayName: &quot;' + ${entry.displayName} + '&quot;, position: ' + ${entry.position} + ', totalScore: ' + ${entry.totalScore} + ', roundScore: ' + ${entry.roundScore} + ', maxScore: ' + ${entry.maxScore} + ', totalSwaps: ' + ${entry.totalSwaps} + ', movement: ' + ${entry.movement} + '}'"
                          hx-on:click="document.getElementById('modal-loading').classList.remove('hidden')"
                          hx-on::after-request="document.getElementById('modal-loading').classList.add('hidden')"
                          class="inline-flex items-center gap-1 max-w-[7rem] sm:max-w-full text-sm font-medium hover:text-indigo-600 transition cursor-pointer text-left"
                          th:classappend="${userPosition != null && entry.publicId == userPosition.publicId ? 'text-indigo-900' : 'text-gray-900'}"
                        >
                          <span class="min-w-0 truncate sm:whitespace-normal sm:overflow-visible sm:text-clip" th:text="${entry.displayName}">Alice Wonder</span>
                          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"
                               class="h-3 w-3 shrink-0 opacity-40 group-hover:opacity-100 transition-opacity">
                            <path fill-rule="evenodd" d="M4.25 5.5a.75.75 0 0 0-.75.75v8.5c0 .414.336.75.75.75h8.5a.75.75 0 0 0 .75-.75v-4a.75.75 0 0 1 1.5 0v4A2.25 2.25 0 0 1 12.75 17h-8.5A2.25 2.25 0 0 1 2 14.75v-8.5A2.25 2.25 0 0 1 4.25 4h5a.75.75 0 0 1 0 1.5h-5Z" clip-rule="evenodd"/>
                            <path fill-rule="evenodd" d="M6.194 12.753a.75.75 0 0 0 1.06.053L16.5 4.44v2.81a.75.75 0 0 0 1.5 0v-4.5a.75.75 0 0 0-.75-.75h-4.5a.75.75 0 0 0 0 1.5h2.553l-9.056 8.194a.75.75 0 0 0-.053 1.06Z" clip-rule="evenodd"/>
                          </svg>
                        </button>
                        <span
                          th:if="${entry.joinedAtGw != null and entry.joinedAtGw > currentPhaseFrom}"
                          class="text-xs text-gray-300 font-normal"
                          th:text="'from gw' + ${entry.joinedAtGw}"
                          >from GW3</span
                        >
                      </div>
                    </td>

                    <td
                      class="px-3 py-4 whitespace-nowrap text-right text-sm font-bold text-indigo-600"
                    >
                      <span
                        th:if="${entry.scored}"
                        th:text="${entry.totalScore}"
                        >1850</span
                      >
                      <span
                        th:if="${!entry.scored}"
                        class="text-gray-400 font-normal"
                        >—</span
                      >
                    </td>
                    <td
                      class="px-3 py-4 whitespace-nowrap text-right text-sm text-gray-600"
                    >
                      <span
                        th:if="${entry.scored}"
                        th:text="${entry.roundScore}"
                        >45</span
                      >
                      <span th:if="${!entry.scored}" class="text-gray-400"
                        >—</span
                      >
                    </td>
                    <td
                      class="px-3 py-4 whitespace-nowrap text-right text-sm font-semibold text-green-600"
                    >
                      <span
                        th:if="${entry.scored}"
                        th:text="${entry.totalZeroes}"
                        >198</span
                      >
                      <span
                        th:if="${!entry.scored}"
                        class="text-gray-400 font-normal"
                        >—</span
                      >
                    </td>
                    <td
                      class="px-3 py-4 whitespace-nowrap text-right text-sm text-gray-500"
                    >
                      <span
                        th:if="${entry.scored}"
                        th:text="${entry.totalSwaps}"
                        >23</span
                      >
                      <span th:if="${!entry.scored}" class="text-gray-400"
                        >—</span
                      >
                    </td>
                    <td
                      class="px-3 py-4 whitespace-nowrap text-right text-sm text-gray-600"
                    >
                      <span th:if="${entry.scored}" th:text="${entry.maxScore}"
                        >52</span
                      >
                      <span th:if="${!entry.scored}" class="text-gray-400"
                        >—</span
                      >
                    </td>
                    <td class="px-3 py-4 whitespace-nowrap text-center text-sm">
                      <th:block th:if="${entry.scored}">
                        <span
                          th:if="${entry.movement > 0}"
                          class="text-green-600 font-semibold"
                          >↑ <span th:text="${entry.movement}">1</span></span
                        >
                        <span
                          th:if="${entry.movement < 0}"
                          class="text-red-600 font-semibold"
                          >↓
                          <span
                            th:text="${T(java.lang.Math).abs(entry.movement)}"
                            >2</span
                          ></span
                        >
                        <span
                          th:if="${entry.movement == 0}"
                          class="text-gray-400"
                          >--</span
                        >
                      </th:block>
                      <span th:if="${!entry.scored}" class="text-gray-400"
                        >—</span
                      >
                    </td>
                  </tr>
                </tbody>

                <!-- Sticky user row when not on current page -->
                <tfoot
                  th:if="${userPosition != null && !userInCurrentPage}"
                  class="border-t-2 border-indigo-300"
                >
                  <tr class="bg-gradient-to-r from-indigo-50 to-blue-50">
                    <td colspan="8" class="px-3 py-4">
                      <div class="flex items-center space-x-6">
                        <div class="flex items-center">
                          <span class="text-indigo-600 mr-1.5 text-base"
                            >🔹</span
                          >
                          <span class="text-sm font-semibold text-indigo-900">
                            <th:block th:if="${userPosition.scored}"
                              >#<span th:text="${userPosition.position}"
                                >45</span
                              ></th:block
                            >
                            <span
                              th:if="${!userPosition.scored}"
                              class="text-gray-400"
                              >—</span
                            >
                          </span>
                        </div>
                        <div class="text-sm font-bold text-indigo-900">
                          You (<span th:text="${currentUserName}">Adam</span>)
                        </div>
                        <th:block th:if="${userPosition.scored}">
                          <div class="flex items-center">
                            <span class="text-xs text-gray-600 mr-1"
                              >Score:</span
                            ><span
                              class="text-sm font-bold text-indigo-700"
                              th:text="${userPosition.totalScore}"
                              >1702</span
                            >
                          </div>
                          <div class="flex items-center">
                            <span class="text-xs text-gray-600 mr-1">GW:</span
                            ><span
                              class="text-sm text-gray-700"
                              th:text="${userPosition.roundScore}"
                              >156</span
                            >
                          </div>
                          <div class="flex items-center">
                            <span class="text-xs text-gray-600 mr-1"
                              >Zeroes:</span
                            ><span
                              class="text-sm font-semibold text-green-600"
                              th:text="${userPosition.totalZeroes}"
                              >175</span
                            >
                          </div>
                          <div class="flex items-center">
                            <span class="text-xs text-gray-600 mr-1">Best:</span
                            ><span
                              class="text-sm text-gray-700"
                              th:text="${userPosition.maxScore}"
                              >52</span
                            >
                          </div>
                          <div class="flex items-center">
                            <span class="text-xs text-gray-600 mr-1"
                              >Swaps:</span
                            ><span
                              class="text-sm font-semibold text-indigo-600"
                              th:text="${userPosition.totalSwaps}"
                              >15</span
                            >
                          </div>
                          <div class="flex items-center">
                            <span
                              th:if="${userPosition.movement > 0}"
                              class="text-green-600 font-bold text-sm"
                              >↑
                              <span th:text="${userPosition.movement}"
                                >3</span
                              ></span
                            >
                            <span
                              th:if="${userPosition.movement < 0}"
                              class="text-red-600 font-bold text-sm"
                              >↓
                              <span
                                th:text="${T(java.lang.Math).abs(userPosition.movement)}"
                                >2</span
                              ></span
                            >
                            <span
                              th:if="${userPosition.movement == 0}"
                              class="text-indigo-500 text-sm"
                              >--</span
                            >
                          </div>
                        </th:block>
                        <th:block th:if="${!userPosition.scored}">
                          <span class="text-xs text-gray-500 italic"
                            >Awaiting first scored round</span
                          >
                        </th:block>
                      </div>
                    </td>
                  </tr>
                </tfoot>
              </table>
            </div>

            <!-- Pagination -->
            <div
              th:if="${totalEntries > 0 and !#lists.isEmpty(leaderboard)}"
              class="mt-4 flex items-center justify-between"
            >
              <div class="text-sm text-gray-500">
                Showing <span th:text="${showingFrom}">1</span>–<span
                  th:text="${showingTo}"
                  >20</span
                >
                of <span th:text="${totalEntries}">100</span> players
              </div>
              <div class="flex space-x-2">
                <button
                  th:if="${hasPreviousPage == true}"
                  th:attr="hx-get=@{/leaderboard(phase=${currentPhase}, page=${currentPage - 1})}"
                  hx-target="#leaderboard-content"
                  hx-swap="outerHTML swap:100ms settle:100ms"
                  class="px-3 py-2 text-sm border border-gray-300 rounded-md hover:bg-gray-50"
                >
                  Previous
                </button>
                <button
                  th:if="${hasPreviousPage == false || hasPreviousPage == null}"
                  disabled
                  class="px-3 py-2 text-sm border border-gray-300 rounded-md disabled:opacity-50"
                >
                  Previous
                </button>
                <button
                  th:if="${hasNextPage == true}"
                  th:attr="hx-get=@{/leaderboard(phase=${currentPhase}, page=${currentPage + 1})}"
                  hx-target="#leaderboard-content"
                  hx-swap="outerHTML swap:100ms settle:100ms"
                  class="px-3 py-2 text-sm border border-gray-300 rounded-md hover:bg-gray-50"
                >
                  Next
                </button>
                <button
                  th:if="${hasNextPage == false || hasNextPage == null}"
                  disabled
                  class="px-3 py-2 text-sm border border-gray-300 rounded-md disabled:opacity-50"
                >
                  Next
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Modal loading spinner: lives outside #user-detail-modal so it survives innerHTML wipes -->
      <div
        id="modal-loading"
        class="hidden fixed inset-0 z-40 flex items-center justify-center"
      >
        <svg
          class="animate-spin h-8 w-8 text-indigo-500"
          fill="none"
          viewBox="0 0 24 24"
        >
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"
          ></circle>
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8v8H4z"
          ></path>
        </svg>
      </div>
      <!-- Modal -->
      <div id="user-detail-modal"></div>
    </div>
  </body>
</html>
