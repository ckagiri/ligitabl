<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}"
>
  <body>
    <div layout:fragment="content">
      <div class="bg-white rounded-lg shadow-sm">
        <!-- Header -->
        <div class="px-4 sm:px-6 py-4 border-b border-gray-200">
          <h1 class="text-xl sm:text-2xl font-bold text-gray-900 mb-4">
            Leaderboard
          </h1>

          <!--
            Model attributes required:
              currentSprint  — code of live sprint,  e.g. "S4"  (nullable)
              currentQuarter — code of live quarter, e.g. "Q2"  (nullable)
              phases         — List<RoundSpan> ordered, types: FULL_SEASON | QUARTER | SPRINT

            Tab visual states:
              active sprint   → solid indigo bg, white text
              active quarter  → indigo border + text, light indigo bg
              full season     → same as active quarter (always accumulating)
              past            → gray border, white bg, hoverable
              future          → muted bg, disabled, cursor-default
          -->
          <div
            th:with="
              cs=${currentSprint},
              cq=${currentQuarter},
              csFrom=${currentSprintFrom != null ? currentSprintFrom : 0},
              cqFrom=${currentQuarterFrom != null ? currentQuarterFrom : 0}
            "
            x-data="{ activeGroup: 'sprints' }"
            class="space-y-2"
          >
            <!-- Top-level group tabs -->
            <div class="flex gap-1.5">
              <!-- Full Season — soft-active always since it is always accumulating -->
              <button
                type="button"
                @click="activeGroup = 'fullSeason'"
                hx-get="/leaderboard"
                hx-vals='{"phase": "FS"}'
                hx-target="#leaderboard-content"
                hx-swap="outerHTML swap:100ms settle:100ms"
                :class="activeGroup === 'fullSeason'
                  ? 'border-indigo-400 bg-indigo-50 text-indigo-700'
                  : 'border-gray-200 bg-white text-gray-600 hover:border-gray-300 hover:text-gray-900'"
                class="px-3 py-1.5 text-sm font-medium border rounded-md transition whitespace-nowrap"
              >
                Full Season
              </button>

              <!-- Quarters -->
              <button
                type="button"
                @click="activeGroup = 'quarters'"
                :class="activeGroup === 'quarters'
                  ? 'border-indigo-400 bg-indigo-50 text-indigo-700'
                  : 'border-gray-200 bg-white text-gray-600 hover:border-gray-300 hover:text-gray-900'"
                class="px-3 py-1.5 text-sm font-medium border rounded-md transition whitespace-nowrap"
              >
                Quarters
              </button>

              <!-- Sprints -->
              <button
                type="button"
                @click="activeGroup = 'sprints'"
                :class="activeGroup === 'sprints'
                  ? 'border-indigo-400 bg-indigo-50 text-indigo-700'
                  : 'border-gray-200 bg-white text-gray-600 hover:border-gray-300 hover:text-gray-900'"
                class="px-3 py-1.5 text-sm font-medium border rounded-md transition whitespace-nowrap"
              >
                Sprints
              </button>
            </div>

            <!-- Quarter sub-tabs — driven from phases list, no hardcoded GW ranges -->
            <div
              x-show="activeGroup === 'quarters'"
              x-cloak
              class="overflow-x-auto pb-1"
            >
              <div class="flex gap-1.5 min-w-max">
                <th:block
                  th:each="phase : ${phases}"
                  th:if="${phase.type != null and phase.type.name() == 'QUARTER'}"
                >
                  <!-- Active -->
                  <button
                    th:if="${phase.code == cq}"
                    type="button"
                    th:attr="hx-vals='|{&quot;phase&quot;:&quot;' + ${phase.code} + '&quot;}|'"
                    hx-get="/leaderboard"
                    hx-target="#leaderboard-content"
                    hx-swap="outerHTML swap:100ms settle:100ms"
                    class="flex flex-col items-center px-3 py-1.5 text-xs font-medium border-2 border-indigo-400 bg-indigo-50 text-indigo-700 rounded-md whitespace-nowrap"
                  >
                    <span class="font-bold" th:text="${phase.code}">Q2</span>
                    <span
                      class="text-[10px] opacity-75"
                      th:text="'GW ' + ${phase.from} + '–' + ${phase.to}"
                      >GW 10–19</span
                    >
                  </button>

                  <!-- Past -->
                  <button
                    th:if="${phase.code != cq and phase.from < cqFrom}"
                    type="button"
                    th:attr="hx-vals='|{&quot;phase&quot;:&quot;' + ${phase.code} + '&quot;}|'"
                    hx-get="/leaderboard"
                    hx-target="#leaderboard-content"
                    hx-swap="outerHTML swap:100ms settle:100ms"
                    class="flex flex-col items-center px-3 py-1.5 text-xs font-medium border border-gray-200 bg-white text-gray-600 hover:border-gray-300 hover:text-gray-900 rounded-md transition whitespace-nowrap"
                  >
                    <span class="font-bold" th:text="${phase.code}">Q1</span>
                    <span
                      class="text-[10px] opacity-75"
                      th:text="'GW ' + ${phase.from} + '–' + ${phase.to}"
                      >GW 1–9</span
                    >
                  </button>

                  <!-- Future -->
                  <button
                    th:if="${phase.code != cq and phase.from > cqFrom}"
                    type="button"
                    disabled
                    class="flex flex-col items-center px-3 py-1.5 text-xs font-medium border border-gray-100 bg-gray-50 text-gray-300 rounded-md cursor-default whitespace-nowrap"
                  >
                    <span class="font-bold" th:text="${phase.code}">Q3</span>
                    <span
                      class="text-[10px]"
                      th:text="'GW ' + ${phase.from} + '–' + ${phase.to}"
                      >GW 20–29</span
                    >
                  </button>
                </th:block>
              </div>
            </div>

            <!-- Sprint sub-tabs — same pattern, driven from phases list -->
            <div
              x-show="activeGroup === 'sprints'"
              class="overflow-x-auto pb-1"
            >
              <div class="flex gap-1.5 min-w-max">
                <th:block
                  th:each="phase : ${phases}"
                  th:if="${phase.type != null and phase.type.name() == 'SPRINT'}"
                >
                  <!-- Active -->
                  <button
                    th:if="${phase.code == cs}"
                    type="button"
                    th:attr="hx-vals='|{&quot;phase&quot;:&quot;' + ${phase.code} + '&quot;}|'"
                    hx-get="/leaderboard"
                    hx-target="#leaderboard-content"
                    hx-swap="outerHTML swap:100ms settle:100ms"
                    class="flex flex-col items-center px-3 py-1.5 text-xs font-medium border border-indigo-500 bg-indigo-600 text-white rounded-md transition whitespace-nowrap"
                  >
                    <span class="font-bold" th:text="${phase.code}">S4</span>
                    <span
                      class="text-[10px] opacity-80"
                      th:text="'GW ' + ${phase.from} + '–' + ${phase.to}"
                      >GW 15–19</span
                    >
                  </button>

                  <!-- Past -->
                  <button
                    th:if="${phase.code != cs and phase.from < csFrom}"
                    type="button"
                    th:attr="hx-vals='|{&quot;phase&quot;:&quot;' + ${phase.code} + '&quot;}|'"
                    hx-get="/leaderboard"
                    hx-target="#leaderboard-content"
                    hx-swap="outerHTML swap:100ms settle:100ms"
                    class="flex flex-col items-center px-3 py-1.5 text-xs font-medium border border-gray-200 bg-white text-gray-600 hover:border-gray-300 hover:text-gray-900 rounded-md transition whitespace-nowrap"
                  >
                    <span class="font-bold" th:text="${phase.code}">S1</span>
                    <span
                      class="text-[10px] opacity-75"
                      th:text="'GW ' + ${phase.from} + '–' + ${phase.to}"
                      >GW 1–4</span
                    >
                  </button>

                  <!-- Future -->
                  <button
                    th:if="${phase.code != cs and phase.from > csFrom}"
                    type="button"
                    disabled
                    class="flex flex-col items-center px-3 py-1.5 text-xs font-medium border border-gray-100 bg-gray-50 text-gray-300 rounded-md cursor-default whitespace-nowrap"
                  >
                    <span class="font-bold" th:text="${phase.code}">S5</span>
                    <span
                      class="text-[10px]"
                      th:text="'GW ' + ${phase.from} + '–' + ${phase.to}"
                      >GW 20–24</span
                    >
                  </button>
                </th:block>
              </div>
            </div>
          </div>
        </div>

        <!-- Leaderboard Table -->
        <div
          id="leaderboard-content"
          th:fragment="leaderboardContent"
          class="px-6 py-4"
        >
          <input
            th:if="${effectiveToRound != null}"
            type="hidden"
            id="effectiveToRound"
            name="effectiveToRound"
            th:value="${effectiveToRound}"
          />

          <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
              <thead class="bg-gray-50">
                <tr>
                  <th
                    scope="col"
                    class="sticky left-0 z-20 bg-gray-50 px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-16"
                  >
                    Pos
                  </th>
                  <th
                    scope="col"
                    class="sticky left-[64px] z-20 bg-gray-50 px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                  >
                    Player
                  </th>
                  <th
                    scope="col"
                    class="px-3 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider w-24"
                  >
                    Score
                  </th>
                  <th
                    scope="col"
                    class="px-3 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider w-24"
                  >
                    GW
                  </th>
                  <th
                    scope="col"
                    class="px-3 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider w-24"
                  >
                    Zeroes
                  </th>
                  <th
                    scope="col"
                    class="px-3 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider w-20"
                  >
                    Best
                  </th>
                  <th
                    scope="col"
                    class="px-3 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider w-20"
                  >
                    Swaps
                  </th>
                  <th
                    scope="col"
                    class="px-3 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider w-24"
                  >
                    Movement
                  </th>
                </tr>
              </thead>
              <tbody class="bg-white divide-y divide-gray-200">
                <tr
                  th:each="entry : ${leaderboard}"
                  th:classappend="${userPosition != null && entry.publicId == userPosition.publicId ? 'bg-indigo-50 border-l-4 border-indigo-500' : ''}"
                  class="group hover:bg-gray-50 transition"
                >
                  <td
                    class="sticky left-0 z-10 px-3 py-4 whitespace-nowrap text-sm font-bold"
                    th:classappend="${userPosition != null && entry.publicId == userPosition.publicId ? 'bg-indigo-50 text-indigo-900' : 'bg-white group-hover:bg-gray-50 text-gray-900'}"
                  >
                    <span
                      th:if="${userPosition != null && entry.publicId == userPosition.publicId}"
                      class="text-indigo-600 mr-1.5 text-base"
                      >🔹</span
                    >
                    <span th:if="${entry.scored}" th:text="${entry.position}"
                      >1</span
                    >
                    <span th:if="${!entry.scored}" class="text-gray-400"
                      >—</span
                    >
                  </td>

                  <td
                    class="sticky left-[64px] z-10 px-3 py-4 whitespace-nowrap"
                    th:classappend="${userPosition != null && entry.publicId == userPosition.publicId ? 'bg-indigo-50' : 'bg-white group-hover:bg-gray-50'}"
                  >
                    <div class="flex flex-col">
                      <button
                        hx-post="/leaderboard/user/modal"
                        hx-target="#user-detail-modal"
                        hx-swap="innerHTML"
                        hx-include="#effectiveToRound"
                        th:attr="hx-vals='js:{publicId: &quot;' + ${entry.publicId} + '&quot;, displayName: &quot;' + ${entry.displayName} + '&quot;, position: ' + ${entry.position} + ', totalScore: ' + ${entry.totalScore} + ', roundScore: ' + ${entry.roundScore} + ', maxScore: ' + ${entry.maxScore} + ', totalZeroes: ' + ${entry.totalZeroes} + ', totalSwaps: ' + ${entry.totalSwaps} + ', movement: ' + ${entry.movement} + '}'"
                        class="text-sm font-medium hover:text-indigo-600 hover:underline transition cursor-pointer text-left"
                        th:classappend="${userPosition != null && entry.publicId == userPosition.publicId ? 'text-indigo-900' : 'text-gray-900'}"
                        th:text="${entry.displayName}"
                      >
                        Alice Wonder
                      </button>
                      <!-- Mid-sprint join indicator — shown when user joined after sprint start -->
                      <span
                        th:if="${entry.joinedAtGw != null}"
                        class="text-[10px] text-gray-400 font-normal"
                        th:text="'from GW' + ${entry.joinedAtGw}"
                        >from GW3</span
                      >
                    </div>
                  </td>

                  <td
                    class="px-3 py-4 whitespace-nowrap text-right text-sm font-bold text-indigo-600"
                  >
                    <span th:if="${entry.scored}" th:text="${entry.totalScore}"
                      >1850</span
                    >
                    <span
                      th:if="${!entry.scored}"
                      class="text-gray-400 font-normal"
                      >—</span
                    >
                  </td>
                  <td
                    class="px-3 py-4 whitespace-nowrap text-right text-sm text-gray-600"
                  >
                    <span th:if="${entry.scored}" th:text="${entry.roundScore}"
                      >45</span
                    >
                    <span th:if="${!entry.scored}" class="text-gray-400"
                      >—</span
                    >
                  </td>
                  <td
                    class="px-3 py-4 whitespace-nowrap text-right text-sm font-semibold text-green-600"
                  >
                    <span th:if="${entry.scored}" th:text="${entry.totalZeroes}"
                      >198</span
                    >
                    <span
                      th:if="${!entry.scored}"
                      class="text-gray-400 font-normal"
                      >—</span
                    >
                  </td>
                  <td
                    class="px-3 py-4 whitespace-nowrap text-right text-sm text-gray-600"
                  >
                    <span th:if="${entry.scored}" th:text="${entry.maxScore}"
                      >52</span
                    >
                    <span th:if="${!entry.scored}" class="text-gray-400"
                      >—</span
                    >
                  </td>
                  <td
                    class="px-3 py-4 whitespace-nowrap text-right text-sm text-gray-500"
                  >
                    <span th:if="${entry.scored}" th:text="${entry.totalSwaps}"
                      >23</span
                    >
                    <span th:if="${!entry.scored}" class="text-gray-400"
                      >—</span
                    >
                  </td>
                  <td class="px-3 py-4 whitespace-nowrap text-center text-sm">
                    <th:block th:if="${entry.scored}">
                      <span
                        th:if="${entry.movement > 0}"
                        class="text-green-600 font-semibold"
                        >↑ <span th:text="${entry.movement}">1</span></span
                      >
                      <span
                        th:if="${entry.movement < 0}"
                        class="text-red-600 font-semibold"
                        >↓
                        <span th:text="${T(java.lang.Math).abs(entry.movement)}"
                          >2</span
                        ></span
                      >
                      <span th:if="${entry.movement == 0}" class="text-gray-400"
                        >--</span
                      >
                    </th:block>
                    <span th:if="${!entry.scored}" class="text-gray-400"
                      >—</span
                    >
                  </td>
                </tr>
              </tbody>

              <!-- Sticky user row when not on current page -->
              <tfoot
                th:if="${userPosition != null && !userInCurrentPage}"
                class="border-t-2 border-indigo-300"
              >
                <tr class="bg-gradient-to-r from-indigo-50 to-blue-50">
                  <td colspan="8" class="px-3 py-4">
                    <div class="flex items-center space-x-6">
                      <div class="flex items-center">
                        <span class="text-indigo-600 mr-1.5 text-base">🔹</span>
                        <span class="text-sm font-semibold text-indigo-900">
                          <th:block th:if="${userPosition.scored}"
                            >#<span th:text="${userPosition.position}"
                              >45</span
                            ></th:block
                          >
                          <span
                            th:if="${!userPosition.scored}"
                            class="text-gray-400"
                            >—</span
                          >
                        </span>
                      </div>
                      <div class="text-sm font-bold text-indigo-900">
                        You (<span th:text="${currentUserName}">Adam</span>)
                      </div>
                      <th:block th:if="${userPosition.scored}">
                        <div class="flex items-center">
                          <span class="text-xs text-gray-600 mr-1">Score:</span
                          ><span
                            class="text-sm font-bold text-indigo-700"
                            th:text="${userPosition.totalScore}"
                            >1702</span
                          >
                        </div>
                        <div class="flex items-center">
                          <span class="text-xs text-gray-600 mr-1">GW:</span
                          ><span
                            class="text-sm text-gray-700"
                            th:text="${userPosition.roundScore}"
                            >156</span
                          >
                        </div>
                        <div class="flex items-center">
                          <span class="text-xs text-gray-600 mr-1">Zeroes:</span
                          ><span
                            class="text-sm font-semibold text-green-600"
                            th:text="${userPosition.totalZeroes}"
                            >175</span
                          >
                        </div>
                        <div class="flex items-center">
                          <span class="text-xs text-gray-600 mr-1">Best:</span
                          ><span
                            class="text-sm text-gray-700"
                            th:text="${userPosition.maxScore}"
                            >52</span
                          >
                        </div>
                        <div class="flex items-center">
                          <span class="text-xs text-gray-600 mr-1">Swaps:</span
                          ><span
                            class="text-sm font-semibold text-indigo-600"
                            th:text="${userPosition.totalSwaps}"
                            >15</span
                          >
                        </div>
                        <div class="flex items-center">
                          <span
                            th:if="${userPosition.movement > 0}"
                            class="text-green-600 font-bold text-sm"
                            >↑
                            <span th:text="${userPosition.movement}"
                              >3</span
                            ></span
                          >
                          <span
                            th:if="${userPosition.movement < 0}"
                            class="text-red-600 font-bold text-sm"
                            >↓
                            <span
                              th:text="${T(java.lang.Math).abs(userPosition.movement)}"
                              >2</span
                            ></span
                          >
                          <span
                            th:if="${userPosition.movement == 0}"
                            class="text-indigo-500 text-sm"
                            >--</span
                          >
                        </div>
                      </th:block>
                      <th:block th:if="${!userPosition.scored}">
                        <span class="text-xs text-gray-500 italic"
                          >Awaiting first scored round</span
                        >
                      </th:block>
                    </div>
                  </td>
                </tr>
              </tfoot>
            </table>
          </div>

          <!-- Pagination -->
          <div
            th:if="${totalEntries > 0}"
            class="mt-4 flex items-center justify-between"
          >
            <div class="text-sm text-gray-500">
              Showing <span th:text="${showingFrom}">1</span>–<span
                th:text="${showingTo}"
                >20</span
              >
              of <span th:text="${totalEntries}">100</span> players
            </div>
            <div class="flex space-x-2">
              <button
                th:if="${hasPreviousPage == true}"
                th:attr="hx-get=@{/leaderboard(phase=${currentPhase}, page=${currentPage - 1})}"
                hx-target="#leaderboard-content"
                hx-swap="outerHTML swap:100ms settle:100ms"
                class="px-3 py-2 text-sm border border-gray-300 rounded-md hover:bg-gray-50"
              >
                Previous
              </button>
              <button
                th:if="${hasPreviousPage == false || hasPreviousPage == null}"
                disabled
                class="px-3 py-2 text-sm border border-gray-300 rounded-md disabled:opacity-50"
              >
                Previous
              </button>
              <button
                th:if="${hasNextPage == true}"
                th:attr="hx-get=@{/leaderboard(phase=${currentPhase}, page=${currentPage + 1})}"
                hx-target="#leaderboard-content"
                hx-swap="outerHTML swap:100ms settle:100ms"
                class="px-3 py-2 text-sm border border-gray-300 rounded-md hover:bg-gray-50"
              >
                Next
              </button>
              <button
                th:if="${hasNextPage == false || hasNextPage == null}"
                disabled
                class="px-3 py-2 text-sm border border-gray-300 rounded-md disabled:opacity-50"
              >
                Next
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Modal -->
      <div id="user-detail-modal"></div>
    </div>
  </body>
</html>
