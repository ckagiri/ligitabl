<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
  layout:decorate="~{layout/base}"
>
  <body>
    <div layout:fragment="content">
      <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-sm">
        <div id="matches-page" th:fragment="matches-content"
             th:attr="hx-get=@{/rounds/{pos}/matches(pos=${viewingRound})}"
             hx-trigger="matchSyncComplete from:body"
             hx-target="#matches-page"
             hx-swap="outerHTML">

          <!-- Header -->
          <div class="px-4 sm:px-6 py-4 border-b border-gray-200">
            <div class="flex flex-col gap-3">
              <h1 class="text-xl sm:text-2xl font-bold text-gray-900">
                Fixtures &amp; Results
              </h1>
              <div
                th:replace="~{fragments/round-navigation :: round-nav(
                  '/rounds', ${viewingRound}, ${lastRound}, ${currentRound},
                  '#matches-page', 'outerHTML swap:250ms', true, false, 'path', 'matches', null)}"
              ></div>
            </div>
          </div>

          <!-- Matches List -->
          <div class="px-4 sm:px-6 py-4">
            <div class="space-y-3">
              <div
                th:each="match : ${matches}"
                class="border border-gray-200 rounded-lg px-4 py-3 hover:shadow-md transition"
              >

                <!-- Row 1: Home | Score or VS | Away -->
                <div class="flex items-center justify-between sm:justify-center sm:gap-3 gap-2">

                  <!-- Home team -->
                  <div class="flex items-center justify-start sm:justify-end gap-2 w-[40%] sm:flex-1">
                    <span
                      class="text-sm font-medium text-gray-900 truncate text-left sm:hidden"
                      th:text="${match.homeTeam}"
                    >Chelsea</span>
                    <span
                      class="hidden sm:inline text-sm font-medium text-gray-900 truncate text-right"
                      th:text="${match.homeTeamName}"
                    >Chelsea</span>
                  </div>

                  <!-- Score (finished/live) or VS (scheduled) -->
                  <div class="flex-shrink-0 flex items-center gap-1.5 min-w-[56px] justify-center">
                    <th:block th:if="${match.status == 'FINISHED' or match.status == 'LIVE'}">
                      <span
                        class="text-lg font-bold text-gray-900"
                        th:text="${match.homeScore}"
                      >2</span>
                      <span class="text-xs text-gray-400 font-medium">–</span>
                      <span
                        class="text-lg font-bold text-gray-900"
                        th:text="${match.awayScore}"
                      >1</span>
                    </th:block>
                    <th:block th:if="${match.status == 'SCHEDULED'}">
                      <span class="text-xs font-semibold text-gray-400 tracking-widest">VS</span>
                    </th:block>
                  </div>

                  <!-- Away team -->
                  <div class="flex items-center justify-end sm:justify-start gap-2 w-[40%] sm:flex-1">
                    <span
                      class="text-sm font-medium text-gray-900 truncate text-right sm:hidden"
                      th:text="${match.awayTeam}"
                    >Arsenal</span>
                    <span
                      class="hidden sm:inline text-sm font-medium text-gray-900 truncate text-left"
                      th:text="${match.awayTeamName}"
                    >Arsenal</span>
                  </div>

                </div>

                <!-- Row 2: Status badge + kickoff + admin sync button — centered -->
                <div class="flex items-center justify-center gap-2 mt-2">

                  <span
                    th:if="${match.status == 'FINISHED'}"
                    class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-gray-100 text-gray-600"
                  >FT</span>

                  <span
                    th:if="${match.status == 'LIVE'}"
                    class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-red-50 text-red-700 border border-red-200"
                  >
                    <span class="live-indicator inline-block w-1.5 h-1.5 bg-red-500 rounded-full"></span>
                    LIVE
                  </span>

                  <span
                    th:if="${match.status == 'SCHEDULED'}"
                    class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-blue-50 text-blue-700"
                  >Upcoming</span>

                  <span
                    th:if="${match.status == 'POSTPONED'}"
                    class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-violet-50 border border-violet-400 text-violet-700"
                  >Postponed</span>

                  <span
                    th:if="${match.formattedTime != null}"
                    class="text-[11px] text-gray-400"
                    th:attr="data-timestamp=${match.formattedTime}"
                    th:text="${match.formattedTime}"
                  >2026-02-12T14:23:00Z</span>

                  <!-- Admin: sync button (hidden for FINISHED/POSTPONED) -->
                  <th:block sec:authorize="hasRole('ADMIN')">
                    <button
                      th:if="${match.status != 'FINISHED' and match.status != 'POSTPONED'}"
                      th:attr="hx-post=@{/web/matches/{clientId}/sync-from-api(clientId=${match.clientId})}"
                      hx-disabled-elt="this"
                      class="text-gray-300 hover:text-blue-500 transition-colors p-0.5 rounded htmx-indicator:animate-spin"
                      title="Sync from API"
                    >
                      <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
                      </svg>
                    </button>
                  </th:block>

                </div>

              </div>
            </div>

            <!-- Admin: Finalize Round button -->
            <th:block sec:authorize="hasRole('ADMIN')">
              <div th:if="${canFinalizeRound}" class="mt-4 flex justify-end">
                <button
                  hx-post="/web/rounds/current/finalize-and-advance"
                  hx-confirm="Finalize this round and advance to the next?"
                  hx-disabled-elt="this"
                  class="px-4 py-2 text-sm font-medium text-white bg-green-600 hover:bg-green-700 rounded-lg transition-colors"
                >
                  Finalize Round
                </button>
              </div>
            </th:block>

          </div>

        </div>
      </div>
    </div>
  </body>
</html>
