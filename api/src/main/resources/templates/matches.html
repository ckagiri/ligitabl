<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
  layout:decorate="~{layout/base}"
>
  <body>
    <div layout:fragment="content">
      <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-sm">
        <div id="matches-page" th:fragment="matches-content"
             th:attr="hx-get=@{/rounds/{pos}/matches(pos=${viewingRound})}"
             hx-trigger="matchSyncComplete from:body"
             hx-target="#matches-page"
             hx-swap="outerHTML">

          <!-- Header -->
          <div class="px-4 sm:px-6 py-4 border-b border-gray-200">
            <div class="flex flex-col gap-3">
              <h1 class="text-xl sm:text-2xl font-bold text-gray-900">
                Fixtures &amp; Results
              </h1>

              <!-- Out-of-sync banner (admin-only) -->
              <th:block sec:authorize="hasRole('ADMIN')">
                <div th:if="${isOutOfSync}" class="rounded-lg bg-red-50 border border-red-200 text-red-800 text-sm px-4 py-3">
                  Standings for this round are out of sync with round <span th:text="${currentRound}">22</span>. Refinalize to recompute.
                </div>
              </th:block>

              <div
                th:replace="~{fragments/round-navigation :: round-nav(
                  '/rounds', ${viewingRound}, ${lastRound}, ${currentRound},
                  '#matches-page', 'outerHTML swap:250ms', true, false, 'path', 'matches', null)}"
              ></div>
            </div>
          </div>

          <!-- Matches List -->
          <div class="px-4 sm:px-6 py-4">
            <div class="space-y-3">
              <div
                th:each="match : ${matches}"
                class="border border-gray-200 rounded-lg px-4 py-3 hover:shadow-md transition"
              >

                <!-- Row 1: Home | Score or VS | Away -->
                <div class="flex items-center justify-between sm:justify-center sm:gap-3 gap-2">

                  <!-- Home team -->
                  <div class="flex items-center justify-start sm:justify-end gap-2 w-[40%] sm:flex-1">
                    <span
                      class="text-sm font-medium text-gray-900 truncate text-left sm:hidden"
                      th:text="${match.homeTeam}"
                    >Chelsea</span>
                    <span
                      class="hidden sm:inline text-sm font-medium text-gray-900 truncate text-right"
                      th:text="${match.homeTeamName}"
                    >Chelsea</span>
                  </div>

                  <!-- Score (finished/live) or VS (anything else) -->
                  <div class="flex-shrink-0 flex items-center gap-1.5 min-w-[56px] justify-center">
                    <th:block th:if="${match.status == 'FINISHED' or match.status == 'LIVE'}">
                      <span
                        class="text-lg font-bold text-gray-900"
                        th:text="${match.homeScore}"
                      >2</span>
                      <span class="text-xs text-gray-400 font-medium">–</span>
                      <span
                        class="text-lg font-bold text-gray-900"
                        th:text="${match.awayScore}"
                      >1</span>
                    </th:block>
                    <th:block th:if="${match.status != 'FINISHED' and match.status != 'LIVE'}">
                      <span class="text-xs font-semibold text-gray-400 tracking-widest">VS</span>
                    </th:block>
                  </div>

                  <!-- Away team -->
                  <div class="flex items-center justify-end sm:justify-start gap-2 w-[40%] sm:flex-1">
                    <span
                      class="text-sm font-medium text-gray-900 truncate text-right sm:hidden"
                      th:text="${match.awayTeam}"
                    >Arsenal</span>
                    <span
                      class="hidden sm:inline text-sm font-medium text-gray-900 truncate text-left"
                      th:text="${match.awayTeamName}"
                    >Arsenal</span>
                  </div>

                </div>

                <!-- Row 2: Status badge + kickoff + admin sync button — centered -->
                <div class="flex items-center justify-center gap-2 mt-2">

                  <span
                    th:if="${match.status == 'FINISHED'}"
                    class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-gray-100 text-gray-600"
                  >FT</span>

                  <span
                    th:if="${match.status == 'LIVE'}"
                    class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-red-50 text-red-700 border border-red-200"
                  >
                    <span class="live-indicator inline-block w-1.5 h-1.5 bg-red-500 rounded-full"></span>
                    LIVE
                  </span>

                  <span
                    th:if="${match.status == 'SCHEDULED'}"
                    class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-blue-50 text-blue-700"
                  >Upcoming</span>

                  <span
                    th:if="${match.status == 'POSTPONED'}"
                    class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-violet-50 border border-violet-400 text-violet-700"
                  >Postponed</span>

                  <span
                    th:if="${match.status == 'SUSPENDED'}"
                    class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-orange-50 border border-orange-300 text-orange-700"
                  >Suspended</span>

                  <span
                    th:if="${match.status == 'CANCELLED'}"
                    class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-red-50 border border-red-300 text-red-600"
                  >Cancelled</span>

                  <span
                    th:if="${match.formattedTime != null}"
                    class="text-[11px] text-gray-400"
                    th:attr="data-timestamp=${match.formattedTime}"
                    th:text="${match.formattedTime}"
                  >2026-02-12T14:23:00Z</span>

                  <!-- Admin: sync button (hidden for FINISHED/POSTPONED) -->
                  <th:block sec:authorize="hasRole('ADMIN')">
                    <button
                      th:if="${match.status != 'FINISHED' and match.status != 'POSTPONED'}"
                      th:attr="hx-post=@{/matches/{clientId}/sync-from-api(clientId=${match.clientId})}"
                      hx-disabled-elt="this"
                      class="text-gray-300 hover:text-blue-500 transition-colors p-0.5 rounded htmx-indicator:animate-spin"
                      title="Sync from API"
                    >
                      <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
                      </svg>
                    </button>
                    <!-- Manage button (hidden for FINISHED unless in setup mode, which unlocks transitions/reschedule) -->
                    <button
                      th:if="${match.status != 'FINISHED' or seasonInSetupMode}"
                      th:attr="hx-get=@{/matches/{slug}/admin-modal(slug=${match.slug},round=${viewingRound},home=${match.homeTeam},away=${match.awayTeam})}"
                      hx-target="#match-admin-modal"
                      hx-swap="innerHTML"
                      class="text-gray-300 hover:text-indigo-500 transition-colors p-0.5 rounded"
                      title="Manage match"
                    >
                      <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                      </svg>
                    </button>
                  </th:block>

                </div>

              </div>
            </div>

            <!-- Admin footer: setup-mode toggle (left) opposite Refresh/Finalize/Refinalize (right) -->
            <div class="mt-4 flex items-center justify-between">
              <div>
                <th:block sec:authorize="hasRole('SUPER_ADMIN')">
                  <button
                    th:if="${!seasonInSetupMode and isViewingCurrentRound == true}"
                    th:attr="hx-post=@{/admin/seasons/{slug}/setup-mode/enter(slug=${seasonSlug})}"
                    hx-confirm="Enter setup mode? This detaches the main contest and pauses swaps/new entries for all users."
                    hx-disabled-elt="this"
                    class="px-4 py-2 text-sm font-medium text-white bg-gray-700 hover:bg-gray-800 rounded-lg transition-colors"
                  >Enter Setup Mode</button>
                  <button
                    th:if="${seasonInSetupMode}"
                    th:attr="hx-post=@{/admin/seasons/{slug}/setup-mode/leave(slug=${seasonSlug})}"
                    hx-confirm="Exit setup mode and reattach the main contest?"
                    hx-disabled-elt="this"
                    hx-on::response-error="alert(event.detail.xhr.responseText)"
                    class="px-4 py-2 text-sm font-medium text-white bg-green-700 hover:bg-green-800 rounded-lg transition-colors"
                  >Exit Setup Mode</button>
                </th:block>
              </div>

              <div class="flex gap-3">
                <th:block sec:authorize="hasRole('ADMIN')">
                  <button
                    th:if="${showRefreshButton}"
                    hx-post="/rounds/current/sync-matches-from-api"
                    hx-disabled-elt="this"
                    class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors"
                  >
                    Refresh
                  </button>
                  <button
                    th:if="${canFinalizeRound}"
                    hx-post="/rounds/current/finalize"
                    hx-confirm="Finalize this round? It will not advance automatically."
                    hx-disabled-elt="this"
                    class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors"
                  >
                    Finalize
                  </button>
                  <button
                    th:if="${canFinalizeRound}"
                    hx-post="/rounds/current/finalize-and-advance"
                    hx-confirm="Finalize this round and advance to the next?"
                    hx-disabled-elt="this"
                    class="px-4 py-2 text-sm font-medium text-white bg-green-600 hover:bg-green-700 rounded-lg transition-colors"
                  >
                    Finalize &amp; Advance
                  </button>
                  <button
                    th:if="${canCancelAutoAdvancement}"
                    hx-post="/rounds/current/cancel-advancement"
                    hx-confirm="Cancel the scheduled auto-advance? The round stays finalized until advanced manually."
                    hx-disabled-elt="this"
                    class="px-4 py-2 text-sm font-medium text-white bg-gray-600 hover:bg-gray-700 rounded-lg transition-colors"
                  >
                    Cancel Auto-Advancement
                  </button>
                  <button
                    th:if="${canAdvanceRound}"
                    hx-post="/rounds/current/advance"
                    hx-confirm="Advance to the next round now?"
                    hx-disabled-elt="this"
                    class="px-4 py-2 text-sm font-medium text-white bg-green-600 hover:bg-green-700 rounded-lg transition-colors"
                  >
                    Advance
                  </button>
                  <button
                    th:if="${canCompleteSeason}"
                    hx-post="/seasons/current/complete"
                    hx-confirm="Mark this season as completed? This cannot be easily undone."
                    hx-disabled-elt="this"
                    class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors"
                  >
                    Complete Season
                  </button>
                </th:block>
                <th:block sec:authorize="hasRole('SUPER_ADMIN')">
                  <button
                    th:if="${canRefinalizeRound}"
                    th:attr="hx-post=@{/rounds/{pos}/refinalize(pos=${viewingRound})}"
                    hx-confirm="Refinalize this round? Later rounds (including the current one) will be marked out of sync until refinalized in turn."
                    hx-disabled-elt="this"
                    class="px-4 py-2 text-sm font-medium text-white bg-amber-600 hover:bg-amber-700 rounded-lg transition-colors"
                  >
                    Refinalize
                  </button>
                </th:block>
              </div>
            </div>

          </div>

        </div>
      </div>

      <!-- Match admin modal container -->
      <div id="match-admin-modal"></div>
    </div>
  </body>
</html>
