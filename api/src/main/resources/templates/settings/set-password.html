<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}"
>
  <body>
    <div layout:fragment="content">
      <section class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Page Header -->
        <div class="mb-6 sm:mb-8">
          <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">
            Set a Password
          </h1>
          <p class="mt-2 text-sm sm:text-base text-gray-600">
            Add a password to your account so you can also sign in with email
            and password.
          </p>
        </div>

        <!-- Settings Tabs -->
        <div class="mb-6 border-b border-gray-200 overflow-x-auto">
          <nav
            class="-mb-px flex space-x-6 sm:space-x-8 min-w-max"
            aria-label="Settings sections"
          >
            <a
              th:href="@{/settings/profile}"
              class="border-indigo-500 text-indigo-600 whitespace-nowrap py-3 sm:py-4 px-1 border-b-2 font-medium text-sm"
            >
              Profile
            </a>
            <a
              th:href="@{/settings/connected-accounts}"
              class="border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-3 sm:py-4 px-1 border-b-2 font-medium text-sm"
            >
              Connected Accounts
            </a>
          </nav>
        </div>

        <!-- Flash messages -->
        <div
          th:if="${message}"
          th:with="isError=${messageType == 'error'}, isSuccess=${messageType == 'success'}"
          th:classappend="${isError ? 'bg-red-50 border-red-200 text-red-800' : isSuccess ? 'bg-green-50 border-green-200 text-green-800' : 'bg-blue-50 border-blue-200 text-blue-800'}"
          class="mb-4 rounded-lg border p-3 sm:p-4 text-sm"
          th:text="${message}"
        ></div>

        <!-- Set Password Form -->
        <div class="bg-white shadow rounded-lg">
          <form
            th:action="@{/settings/set-password}"
            th:object="${setPasswordForm}"
            method="post"
            class="p-4 sm:p-6 space-y-6"
          >
            <input
              type="hidden"
              th:name="${_csrf.parameterName}"
              th:value="${_csrf.token}"
            />

            <!-- Why set a password info box -->
            <div class="bg-blue-50 border border-blue-200 rounded-lg p-3 sm:p-4">
              <div class="flex gap-3">
                <svg
                  class="h-5 w-5 text-blue-400 flex-shrink-0 mt-0.5"
                  fill="currentColor"
                  viewBox="0 0 20 20"
                >
                  <path
                    fill-rule="evenodd"
                    d="M18 10A8 8 0 112 10a8 8 0 0116 0zm-8-3a1 1 0 100-2 1 1 0 000 2zm1 8a1 1 0 10-2 0 1 1 0 002 0zm-1-6a1 1 0 00-1 1v3a1 1 0 102 0v-3a1 1 0 00-1-1z"
                    clip-rule="evenodd"
                  />
                </svg>
                <p class="text-sm text-blue-800">
                  Once you set a password you can sign in with your email
                  address as well as Google, and you'll also be able to unlink
                  Google if you later decide to.
                </p>
              </div>
            </div>

            <!-- New Password -->
            <div>
              <label
                for="newPassword"
                class="block text-sm font-medium text-gray-700 mb-2"
              >
                New Password
              </label>
              <input
                type="password"
                id="newPassword"
                th:field="*{newPassword}"
                autocomplete="new-password"
                class="w-full px-3 sm:px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-base"
                placeholder="At least 8 characters"
              />
              <p
                th:if="${#fields.hasErrors('newPassword')}"
                th:errors="*{newPassword}"
                class="mt-2 text-sm text-red-600"
              ></p>
            </div>

            <!-- Confirm Password -->
            <div>
              <label
                for="confirmPassword"
                class="block text-sm font-medium text-gray-700 mb-2"
              >
                Confirm Password
              </label>
              <input
                type="password"
                id="confirmPassword"
                th:field="*{confirmPassword}"
                autocomplete="new-password"
                class="w-full px-3 sm:px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-base"
                placeholder="Repeat the password"
              />
              <p
                th:if="${#fields.hasErrors('confirmPassword')}"
                th:errors="*{confirmPassword}"
                class="mt-2 text-sm text-red-600"
              ></p>
            </div>

            <!-- Divider -->
            <div class="border-t border-gray-200"></div>

            <!-- Actions -->
            <div
              class="flex flex-col-reverse sm:flex-row sm:items-center sm:justify-between gap-3"
            >
              <a
                th:href="@{/settings/connected-accounts}"
                class="inline-flex items-center justify-center px-5 py-2 rounded-lg border border-gray-300 text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 hover:border-gray-400 transition"
              >
                Cancel
              </a>
              <button
                type="submit"
                class="inline-flex items-center justify-center px-6 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium transition"
              >
                Set Password
              </button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </body>
</html>
