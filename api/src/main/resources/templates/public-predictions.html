<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}"
>
  <body>
    <div layout:fragment="content">
      <div
        id="public-prediction-page"
        th:fragment="publicPredictionPage"
        class="max-w-4xl mx-auto"
      >
        <!-- Back link: only when we arrived from a leaderboard/contest player modal -->
        <div th:if="${backHref != null}" class="mb-4">
          <a
            th:href="${backHref}"
            onclick="window.flashNavLoadingBar && window.flashNavLoadingBar()"
            class="inline-flex items-center gap-1.5 text-sm text-gray-500 hover:text-gray-700 transition"
          >
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
            Back
          </a>
        </div>

        <!-- Page Header -->
        <div class="bg-white rounded-lg shadow-sm mb-6">
          <div class="px-6 py-4 border-b border-gray-200">
            <div class="flex flex-col sm:flex-row sm:items-baseline sm:gap-2 mb-4 sm:mb-6">
              <h1 class="text-xl sm:text-2xl text-gray-900">
                <span
                  th:if="${possessiveDisplayName != null}"
                  class="font-bold"
                  th:text="${possessiveDisplayName}"
                  >Jane Doe's</span
                >
                <span class="text-gray-500" th:text="${competitionName}">Premier League</span>
              </h1>
              <span class="text-sm sm:text-base text-gray-600">
                Gameweek <span th:text="${viewingRound}">13</span>
              </span>
            </div>

            <!-- User Not Found Banner -->
            <div
              th:if="${!userFound}"
              class="rounded-lg bg-gray-50 border border-gray-200 text-gray-700 text-sm px-4 py-3 mb-4"
            >
              This link doesn't match a LigiPredictor user — here's the current standings instead.
            </div>

            <!-- Round Navigation -->
            <div class="mt-4">
              <div
                th:replace="~{fragments/round-navigation :: round-nav(
                  ${navBaseUrl}, ${viewingRound}, ${currentRound}, ${currentRound},
                  '#public-prediction-page', 'outerHTML swap:100ms settle:100ms show:window:top',
                  ${viewingRound != currentRound}, false, 'path', null, ${minRound}, 'gw', ${navQueryString})}"
              ></div>
            </div>
          </div>
        </div>

        <!-- Historical/scored round: plain static table, only the standings-compare toggle -->
        <div th:if="${hasRoundResult}" class="bg-white rounded-lg shadow-sm mb-6" x-data="{ compareStandings: true }">
          <div class="px-6 pt-4 flex items-center justify-end">
            <label class="inline-flex items-center gap-2 text-sm text-gray-600 cursor-not-allowed select-none">
              <input
                type="checkbox"
                x-model="compareStandings"
                disabled
                class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500 cursor-not-allowed opacity-60"
              />
              Compare with gameweek standings
            </label>
          </div>
          <div
            th:replace="~{fragments/prediction-public-view :: public-view(
              ${rows}, ${hasRoundResult}, ${totalScore}, ${totalHits}, ${zeroesCount})}"
          ></div>
          <!-- Collapsed: on someone else's table the swaps are context, not the point. -->
          <div th:replace="~{fragments/swap-history :: history(false)}"></div>
        </div>

        <!-- Current/live round: comparison-options (standings/points/GD/fixtures/form) + rich table -->
        <div
          th:unless="${hasRoundResult}"
          class="bg-white rounded-lg shadow-sm mb-6"
          x-data="Ligitabl.publicPredictionPage($el)"
          th:attr="data-predictions=${predictionsJson},
                  data-current-standings=${currentStandingsJson},
                  data-fixtures=${fixturesJson},
                  data-current-points=${currentPointsJson},
                  data-current-goal-difference=${currentGoalDifferenceJson},
                  data-form=${formJson},
                  data-round-id=${roundId}"
        >
          <div th:replace="~{fragments/prediction-table :: comparison-options(${hasFormData}, false)}"></div>
          <div th:replace="~{fragments/prediction-public-view :: public-rich-table}"></div>
          <div th:replace="~{fragments/swap-history :: history(false)}"></div>
        </div>
      </div>
    </div>
  </body>
</html>
