<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}"
>
  <body>
    <div layout:fragment="content" class="mx-auto max-w-2xl px-4 py-16 text-center">
      <h1 class="text-2xl font-semibold text-gray-900 dark:text-gray-100">
        Final Table Predictor
      </h1>
      <p
        class="mt-4 text-gray-600 dark:text-gray-400"
        th:text="${message}"
      >
        Not available right now.
      </p>
      <a
        th:href="@{/}"
        class="mt-8 inline-block rounded-lg bg-emerald-600 px-5 py-2.5 font-medium text-white hover:bg-emerald-700"
        >Back to home</a
      >
    </div>
  </body>
</html>
