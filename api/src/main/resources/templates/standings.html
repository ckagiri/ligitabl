<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}"
>
  <body>
    <div layout:fragment="content">
      <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-sm">
        <!-- Header -->
        <div id="standings-page" th:fragment="standings-content">
          <div class="px-4 sm:px-6 py-4 border-b border-gray-200">
            <div class="flex flex-col gap-3">
              <h1 class="text-xl sm:text-2xl font-bold text-gray-900">
                League Standings
              </h1>
              <div
                th:replace="~{fragments/round-navigation :: round-nav(
                  '/rounds', ${viewingRound}, ${currentRound}, ${currentRound},
                  '#standings-page', 'outerHTML swap:250ms', true, false, 'path', 'standings', null, null, null)}"
              ></div>
            </div>
          </div>

          <!-- Standings Table -->
          <style>
            .standings-scroll::-webkit-scrollbar { width: 6px; }
            .standings-scroll::-webkit-scrollbar-track { background: transparent; }
            .standings-scroll::-webkit-scrollbar-thumb { background-color: #d1d5db; border-radius: 9999px; }
            .standings-scroll::-webkit-scrollbar-thumb:hover { background-color: #9ca3af; }
          </style>
          <div>
            <div class="px-6 py-4">
              <div class="standings-scroll overflow-y-scroll max-h-[calc(100vh-220px)]">
                <table class="min-w-full divide-y divide-gray-200">
                  <thead class="bg-gray-50">
                    <tr>
                      <th
                        scope="col"
                        class="sticky top-0 left-0 z-40 bg-gray-50 px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-12"
                      >
                        Pos
                      </th>
                      <th
                        scope="col"
                        class="sticky top-0 left-[48px] z-40 bg-gray-50 px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                      >
                        Team
                      </th>
                      <th
                        scope="col"
                        class="sticky top-0 z-30 bg-gray-50 px-3 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider w-16"
                      >
                        P
                      </th>
                      <th
                        scope="col"
                        class="sticky top-0 z-30 bg-gray-50 px-3 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider w-16"
                      >
                        W
                      </th>
                      <th
                        scope="col"
                        class="sticky top-0 z-30 bg-gray-50 px-3 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider w-16"
                      >
                        D
                      </th>
                      <th
                        scope="col"
                        class="sticky top-0 z-30 bg-gray-50 px-3 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider w-16"
                      >
                        L
                      </th>
                      <th
                        scope="col"
                        class="sticky top-0 z-30 bg-gray-50 px-3 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider w-20"
                      >
                        GF
                      </th>
                      <th
                        scope="col"
                        class="sticky top-0 z-30 bg-gray-50 px-3 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider w-20"
                      >
                        GA
                      </th>
                      <th
                        scope="col"
                        class="sticky top-0 z-30 bg-gray-50 px-3 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider w-20"
                      >
                        GD
                      </th>
                      <th
                        scope="col"
                        class="sticky top-0 z-30 bg-gray-50 px-3 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider w-20"
                      >
                        Pts
                      </th>
                      <th
                        scope="col"
                        class="sticky top-0 z-30 bg-gray-50 px-3 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider"
                      >
                        Form
                      </th>
                      <th
                        th:if="${isCurrentStandings}"
                        scope="col"
                        class="sticky top-0 z-30 bg-gray-50 px-3 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider w-24"
                      >
                        <span th:text="${allFixturesUpcoming == true ? 'Next' : 'Round'}">Next</span>
                      </th>
                    </tr>
                  </thead>
                  <tbody class="bg-white divide-y divide-gray-200">
                    <tr
                      th:each="standing : ${standings}"
                      class="group/row hover:bg-gray-50 transition"
                    >
                      <td
                        class="sticky left-0 z-10 bg-white group-hover/row:bg-gray-50 px-3 py-4 whitespace-nowrap text-sm font-bold text-gray-900"
                        th:text="${standing.position}"
                      >
                        1
                      </td>
                      <td
                        class="sticky left-[48px] z-10 bg-white group-hover/row:bg-gray-50 px-3 py-4 whitespace-nowrap"
                      >
                        <div class="flex items-center">
                          <div
                            class="text-sm font-medium text-gray-900"
                            th:text="${standing.teamShortName}"
                          >
                            Chelsea
                          </div>
                        </div>
                      </td>
                      <td
                        class="px-3 py-4 whitespace-nowrap text-center text-sm text-gray-500"
                        th:text="${standing.played}"
                      >
                        19
                      </td>
                      <td
                        class="px-3 py-4 whitespace-nowrap text-center text-sm text-gray-500"
                        th:text="${standing.won}"
                      >
                        14
                      </td>
                      <td
                        class="px-3 py-4 whitespace-nowrap text-center text-sm text-gray-500"
                        th:text="${standing.drawn}"
                      >
                        3
                      </td>
                      <td
                        class="px-3 py-4 whitespace-nowrap text-center text-sm text-gray-500"
                        th:text="${standing.lost}"
                      >
                        2
                      </td>
                      <td
                        class="px-3 py-4 whitespace-nowrap text-center text-sm text-gray-500"
                        th:text="${standing.goalsFor}"
                      >
                        42
                      </td>
                      <td
                        class="px-3 py-4 whitespace-nowrap text-center text-sm text-gray-500"
                        th:text="${standing.goalsAgainst}"
                      >
                        15
                      </td>
                      <td
                        class="px-3 py-4 whitespace-nowrap text-center text-sm font-medium"
                        th:classappend="${standing.goalDifference > 0 ? 'text-green-600' : (standing.goalDifference < 0 ? 'text-red-600' : 'text-gray-900')}"
                        th:text="${standing.goalDifference > 0 ? '+' + standing.goalDifference : standing.goalDifference}"
                      >
                        +27
                      </td>
                      <td
                        class="px-3 py-4 whitespace-nowrap text-center text-sm font-bold text-indigo-600"
                        th:text="${standing.points}"
                      >
                        45
                      </td>
                      <!-- Form column -->
                      <td class="px-3 py-4 whitespace-nowrap">
                        <th:block th:if="${standing.form != null and !standing.form.isEmpty()}">
                          <div class="flex items-center justify-center gap-0.5">
                            <span th:each="entry : ${standing.form}"
                                  class="relative flex-shrink-0 group/badge">
                              <!-- Circle for home, square for away -->
                              <span th:class="${'flex items-center justify-center w-3 h-3 cursor-default ' +
                                      (entry.result == 'W' ? 'bg-green-500' :
                                       entry.result == 'D' ? 'bg-amber-400' :
                                                             'bg-red-500') + ' ' +
                                      (entry.wasHome ? 'rounded-full' : 'rounded-sm')}"></span>
                              <!-- Hover tooltip -->
                              <span class="absolute bottom-full left-1/2 -translate-x-1/2 mb-1.5 z-50
                                           invisible group-hover/badge:visible opacity-0 group-hover/badge:opacity-100
                                           transition-opacity duration-150
                                           bg-white border border-gray-200 shadow-md rounded px-2 py-1
                                           text-xs font-medium text-gray-700 whitespace-nowrap pointer-events-none">
                                <th:block th:if="${entry.wasHome == true}">
                                  <span class="font-bold" th:text="${standing.teamTla}">CHE</span>
                                  <span class="mx-1 text-gray-500" th:text="${entry.goalsFor + ' - ' + entry.goalsAgainst}">3 - 1</span>
                                  <span th:text="${entry.opponentCode}">ARS</span>
                                </th:block>
                                <th:block th:if="${entry.wasHome == false}">
                                  <span th:text="${entry.opponentCode}">ARS</span>
                                  <span class="mx-1 text-gray-500" th:text="${entry.goalsAgainst + ' - ' + entry.goalsFor}">1 - 3</span>
                                  <span class="font-bold" th:text="${standing.teamTla}">CHE</span>
                                </th:block>
                                <!-- Caret -->
                                <span class="absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-gray-200"></span>
                              </span>
                            </span>
                          </div>
                        </th:block>
                        <span th:unless="${standing.form != null and !standing.form.isEmpty()}"
                              class="text-gray-300 text-[11px] block text-center">—</span>
                      </td>

                      <td th:if="${isCurrentStandings}"
                          class="px-3 py-4 whitespace-nowrap text-center">
                        <th:block th:with="fixes=${nextFixtures != null ? nextFixtures[standing.teamTla] : null}">
                          <th:block th:if="${fixes != null and !fixes.isEmpty()}">
                            <span th:each="fix : ${fixes}"
                                  class="inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded text-xs font-medium border mr-0.5"
                                  th:class="${'inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded text-[11px] font-medium border mr-0.5 ' +
                                    (fix.result == 'WIN' ? 'bg-green-50 border-green-400 text-green-700' :
                                    fix.result == 'LOSS' ? 'bg-red-50 border-red-400 text-red-700' :
                                    fix.result == 'DRAW' ? 'bg-amber-100 border-amber-500 text-amber-700' :
                                    fix.status == 'LIVE' ? 'bg-blue-50 border-blue-400 text-blue-700' :
                                    fix.status == 'POSTPONED' ? 'bg-violet-50 border-violet-400 text-violet-700' :
                                    'bg-gray-100 border-gray-200 text-gray-600')}">
                              <span th:if="${fix.status == 'LIVE'}"
                                    class="inline-block w-1.5 h-1.5 bg-red-500 rounded-full animate-pulse"></span>
                              <span th:if="${fix.status == 'POSTPONED'}" class="font-bold">P</span>
                              <span th:unless="${fix.home}">@</span><span th:text="${fix.opponent}">MUN</span>
                              <!--
                                Score, own goals first, so "2-0" agrees with the chip colour instead
                                of leaving the colour as the only thing saying who won. Matches the
                                orientation of the Form tooltip above.
                              -->
                              <span th:if="${fix.hasScore()}"
                                    class="font-semibold"
                                    th:text="${fix.goalsFor + '-' + fix.goalsAgainst}">2-0</span>
                            </span>
                          </th:block>
                          <span th:unless="${fixes != null and !fixes.isEmpty()}"
                                class="text-gray-300 text-[11px]">—</span>
                        </th:block>
                      </td>

                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
