<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}"
>
  <head>
    <!-- Unfurl tags: the payoff of this game is showing people what you called in August. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" th:content="${ogTitle}" />
    <meta property="og:description" th:content="${ogDescription}" />
    <meta property="og:url" th:content="${shareUrl}" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" th:content="${ogTitle}" />
    <meta name="twitter:description" th:content="${ogDescription}" />
  </head>
  <body>
    <div layout:fragment="content" class="mx-auto max-w-3xl px-4 py-8">
      <header class="mb-6">
        <h1 class="text-2xl font-semibold text-gray-900 dark:text-gray-100">
          <span th:text="${ownerName}">Player</span>'s Final Table
        </h1>
        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400" th:text="${seasonName}">
          Season
        </p>
      </header>

      <th:block th:if="${revealed == true}">
        <div class="mb-6 grid grid-cols-2 gap-3 sm:grid-cols-4">
          <div
            class="rounded-lg border border-gray-200 bg-white p-3 dark:border-gray-700 dark:bg-gray-900"
          >
            <div class="text-xs uppercase text-gray-500 dark:text-gray-400">Total</div>
            <div
              class="text-xl font-semibold text-gray-900 dark:text-gray-100"
              th:text="${totalScore}"
            >
              0
            </div>
          </div>
          <div
            class="rounded-lg border border-gray-200 bg-white p-3 dark:border-gray-700 dark:bg-gray-900"
          >
            <div class="text-xs uppercase text-gray-500 dark:text-gray-400">Base</div>
            <div
              class="text-xl font-semibold text-gray-900 dark:text-gray-100"
              th:text="${baseScore}"
            >
              0
            </div>
          </div>
          <div
            class="rounded-lg border border-gray-200 bg-white p-3 dark:border-gray-700 dark:bg-gray-900"
          >
            <div class="text-xs uppercase text-gray-500 dark:text-gray-400">Exact</div>
            <div
              class="text-xl font-semibold text-gray-900 dark:text-gray-100"
              th:text="${zeroesCount}"
            >
              0
            </div>
          </div>
          <div
            class="rounded-lg border border-gray-200 bg-white p-3 dark:border-gray-700 dark:bg-gray-900"
          >
            <div class="text-xs uppercase text-gray-500 dark:text-gray-400">Bonus</div>
            <div
              class="text-xl font-semibold text-gray-900 dark:text-gray-100"
              th:text="${bonusPoints}"
            >
              0
            </div>
          </div>
        </div>
      </th:block>

      <th:block th:if="${revealed == false}">
        <div
          class="mb-6 rounded-lg border border-gray-200 bg-gray-50 p-4 dark:border-gray-700 dark:bg-gray-800"
        >
          <p class="text-sm text-gray-700 dark:text-gray-300">
            Locked in before a ball was kicked. Revealed at the end of the season.
          </p>
        </div>
      </th:block>

      <!--
        The same component, mounted read-only: entryOpen is false here so canEdit() never allows a
        tap. Reusing it keeps one renderer for the table rather than a near-duplicate fragment.
      -->
      <div
        x-data="Ligitabl.finalTablePage($el)"
        th:attr="data-rows=${rowsJson},data-entry-open=false,data-has-entry=true"
        class="overflow-x-auto rounded-lg border border-gray-200 dark:border-gray-700"
      >
        <th:block th:if="${revealed == true}">
          <div th:replace="~{fragments/final-table-rows :: result}"></div>
        </th:block>
        <th:block th:if="${revealed == false}">
          <div th:replace="~{fragments/final-table-rows :: table}"></div>
        </th:block>
      </div>

      <div th:replace="~{fragments/final-table-share :: card}"></div>

      <div class="mt-8">
        <a
          th:href="@{/final-table}"
          class="rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-medium text-white hover:bg-indigo-700"
          >Make your own prediction</a
        >
      </div>
    </div>
  </body>
</html>
