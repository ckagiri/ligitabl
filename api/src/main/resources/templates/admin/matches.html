<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}"
>
  <body>
    <div layout:fragment="content">
      <section class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8">
          <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">Fixtures &amp; Results</h1>
          <p class="mt-2 text-sm text-gray-600">
            <span th:text="${competitionName}">Premier League</span>
            · <span th:text="${seasonName}">2025/26</span>
            · Current round: <span class="font-semibold text-gray-900" th:text="'GW ' + ${currentRound}">GW 22</span>
          </p>
        </div>

        <div x-data="adminMatchesPage" class="bg-white shadow rounded-lg">

          <!-- Filter bar -->
          <div class="px-4 sm:px-6 py-4 border-b border-gray-200 flex flex-wrap items-end gap-3">
            <label class="flex flex-col gap-1 text-xs text-gray-500">
              Ground
              <select x-model="filters.ground" @change="page = 1"
                      class="border border-gray-300 rounded-md text-sm px-2 py-1 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="HA">H/A</option>
                <option value="HOME">Home</option>
                <option value="AWAY">Away</option>
              </select>
            </label>

            <label class="flex flex-col gap-1 text-xs text-gray-500">
              Team
              <select x-model="filters.teamId" @change="page = 1"
                      class="border border-gray-300 rounded-md text-sm px-2 py-1 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="">All</option>
                <template x-for="t in teamsList" :key="t.id">
                  <option :value="t.id" x-text="t.shorterName"></option>
                </template>
              </select>
            </label>

            <label class="flex flex-col gap-1 text-xs text-gray-500">
              Status
              <select x-model="filters.status" @change="page = 1"
                      class="border border-gray-300 rounded-md text-sm px-2 py-1 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="">All</option>
                <option value="SCHEDULED">Scheduled</option>
                <option value="LIVE">Live</option>
                <option value="SUSPENDED">Suspended</option>
                <option value="FINISHED">Finished</option>
                <option value="POSTPONED">Postponed</option>
                <option value="CANCELLED">Cancelled</option>
              </select>
            </label>

            <label class="flex flex-col gap-1 text-xs text-gray-500">
              Month
              <select x-model="filters.month" @change="page = 1"
                      class="border border-gray-300 rounded-md text-sm px-2 py-1 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="">All</option>
                <template x-for="mo in months" :key="mo">
                  <option :value="mo" x-text="monthLabel(mo)"></option>
                </template>
              </select>
            </label>

            <label class="flex flex-col gap-1 text-xs text-gray-500">
              Matchday
              <select :value="filters.matchday" @change="setMatchday($event.target.value)"
                      class="border border-gray-300 rounded-md text-sm px-2 py-1 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="">--</option>
                <template x-for="n in roundNumbers" :key="'md' + n">
                  <option :value="n" x-text="n"></option>
                </template>
              </select>
            </label>

            <label class="flex flex-col gap-1 text-xs text-gray-500">
              Round
              <select :value="filters.round" @change="setRound($event.target.value)"
                      class="border border-gray-300 rounded-md text-sm px-2 py-1 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="">--</option>
                <template x-for="n in roundNumbers" :key="'gw' + n">
                  <!-- :selected (not just the select's value) because these options render after
                       the select's value binding is applied, which would leave "--" displayed -->
                  <option :value="n" :selected="String(n) === filters.round" x-text="'GW ' + n"></option>
                </template>
              </select>
            </label>

            <button @click="resetFilters()"
                    class="ml-auto text-sm text-indigo-600 hover:text-indigo-800 pb-1.5">
              Reset filters
            </button>
          </div>

          <!-- Transient notice (e.g. a mutated row dropped out of the active filters) -->
          <div x-show="notice" x-cloak x-transition
               class="px-4 sm:px-6 py-2 bg-blue-50 border-b border-blue-200 text-sm text-blue-800 flex items-center justify-between gap-3">
            <span x-text="notice"></span>
            <button @click="notice = ''" class="text-blue-400 hover:text-blue-600" title="Dismiss">✕</button>
          </div>

          <!-- Pagination bar -->
          <div class="px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3 border-b border-gray-200 text-sm text-gray-500">
            <span>
              Showing <span x-text="showingFrom">0</span>–<span x-text="showingTo">0</span>
              of <span x-text="filtered.length">0</span> fixtures
            </span>
            <div class="flex items-center gap-3">
              <label class="flex items-center gap-1">
                <span>Per page</span>
                <select :value="pageSize" @change="setPageSize($event.target.value)"
                        class="border border-gray-300 rounded-md text-sm px-2 py-1 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                  <template x-for="opt in pageSizeOptions" :key="opt">
                    <option :value="opt" x-text="opt" :selected="opt === pageSize"></option>
                  </template>
                </select>
              </label>
              <div class="flex items-center gap-1">
                <button @click="page = 1" :disabled="page <= 1"
                        class="px-2 py-1 border border-gray-300 rounded-md disabled:opacity-40 disabled:cursor-default hover:bg-gray-50">«</button>
                <button @click="if (page > 1) page--" :disabled="page <= 1"
                        class="px-2 py-1 border border-gray-300 rounded-md disabled:opacity-40 disabled:cursor-default hover:bg-gray-50">‹</button>
                <span class="px-2 whitespace-nowrap">Page <span x-text="page">1</span> of <span x-text="totalPages">1</span></span>
                <button @click="if (page < totalPages) page++" :disabled="page >= totalPages"
                        class="px-2 py-1 border border-gray-300 rounded-md disabled:opacity-40 disabled:cursor-default hover:bg-gray-50">›</button>
                <button @click="page = totalPages" :disabled="page >= totalPages"
                        class="px-2 py-1 border border-gray-300 rounded-md disabled:opacity-40 disabled:cursor-default hover:bg-gray-50">»</button>
              </div>
            </div>
          </div>

          <!-- Table -->
          <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
              <thead class="bg-gray-50">
                <tr>
                  <th class="px-3 py-3 text-right">
                    <span class="text-xs font-medium text-gray-500 uppercase tracking-wider">#</span>
                  </th>
                  <th class="px-4 py-3 text-right">
                    <button @click="setSort('home')" class="text-xs font-medium text-gray-500 uppercase tracking-wider hover:text-gray-700">
                      Home <span x-text="sortIndicator('home')"></span>
                    </button>
                  </th>
                  <th class="px-2 py-3 text-center">
                    <button @click="setSort('score')" class="text-xs font-medium text-gray-500 uppercase tracking-wider hover:text-gray-700"
                            :title="'Sorts by ' + (filters.ground === 'HOME' ? 'home goals' : filters.ground === 'AWAY' ? 'away goals' : 'total goals')">
                      Score <span x-text="sortIndicator('score')"></span>
                    </button>
                  </th>
                  <th class="px-4 py-3 text-left">
                    <button @click="setSort('away')" class="text-xs font-medium text-gray-500 uppercase tracking-wider hover:text-gray-700">
                      Away <span x-text="sortIndicator('away')"></span>
                    </button>
                  </th>
                  <th class="px-2 py-3 text-center">
                    <button @click="setSort('md')" class="text-xs font-medium text-gray-500 uppercase tracking-wider hover:text-gray-700"
                            title="Original matchday">
                      MD <span x-text="sortIndicator('md')"></span>
                    </button>
                  </th>
                  <th class="px-2 py-3 text-center">
                    <button @click="setSort('gw')" class="text-xs font-medium text-gray-500 uppercase tracking-wider hover:text-gray-700"
                            title="Current round (gameweek)">
                      GW <span x-text="sortIndicator('gw')"></span>
                    </button>
                  </th>
                  <th class="px-4 py-3 text-left">
                    <button @click="setSort('kickoff')" class="text-xs font-medium text-gray-500 uppercase tracking-wider hover:text-gray-700">
                      Kickoff <span x-text="sortIndicator('kickoff')"></span>
                    </button>
                  </th>
                  <th class="px-4 py-3 text-left">
                    <button @click="setSort('status')" class="text-xs font-medium text-gray-500 uppercase tracking-wider hover:text-gray-700">
                      Status <span x-text="sortIndicator('status')"></span>
                    </button>
                  </th>
                  <th class="px-2 py-3"></th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-100">
                <tr x-show="loading">
                  <td colspan="9" class="px-4 py-8 text-center text-sm text-gray-400">Loading fixtures…</td>
                </tr>
                <tr x-show="!loading && loadError">
                  <td colspan="9" class="px-4 py-8 text-center text-sm text-red-600">
                    Could not load fixtures.
                    <button @click="reload()" class="underline hover:text-red-800">Retry</button>
                  </td>
                </tr>
                <tr x-show="!loading && !loadError && filtered.length === 0">
                  <td colspan="9" class="px-4 py-8 text-center text-sm text-gray-500">
                    No fixtures match the current filters — try widening Round or Matchday, or
                    <button @click="resetFilters()" class="text-indigo-600 underline hover:text-indigo-800">reset filters</button>.
                  </td>
                </tr>
                <template x-for="(m, idx) in pageRows" :key="m.id">
                  <tr class="hover:bg-gray-50 transition">
                    <td class="px-3 py-3 text-right text-sm text-gray-400 tabular-nums"
                        x-text="(page - 1) * pageSize + idx + 1"></td>
                    <td class="px-4 py-3 text-right">
                      <span class="inline-flex items-center gap-2 justify-end">
                        <span class="text-sm font-medium text-gray-900" x-text="teamName(m.homeTeamId)"></span>
                        <span :class="tlaClass(m, 'home')" x-text="teamCode(m.homeTeamId)"></span>
                      </span>
                    </td>
                    <td class="px-2 py-3 text-center whitespace-nowrap">
                      <span class="font-mono tabular-nums font-bold text-sm text-gray-900"
                            x-text="m.score ? m.score.homeGoals + ' – ' + m.score.awayGoals : '–'"></span>
                    </td>
                    <td class="px-4 py-3 text-left">
                      <span class="inline-flex items-center gap-2">
                        <span :class="tlaClass(m, 'away')" x-text="teamCode(m.awayTeamId)"></span>
                        <span class="text-sm font-medium text-gray-900" x-text="teamName(m.awayTeamId)"></span>
                      </span>
                    </td>
                    <td class="px-2 py-3 text-center text-sm text-gray-600" x-text="m.matchday"></td>
                    <td class="px-2 py-3 text-center text-sm">
                      <span :class="m.roundPosition !== m.matchday
                                      ? 'text-amber-700 bg-amber-50 rounded px-1.5 py-0.5 font-semibold'
                                      : 'text-gray-600'"
                            :title="m.roundPosition !== m.matchday ? 'Moved — originally matchday ' + m.matchday : null"
                            x-text="m.roundPosition"></span>
                    </td>
                    <td class="px-4 py-3 text-sm text-gray-600 whitespace-nowrap" x-text="formatKickoff(m.kickOff)"></td>
                    <td class="px-4 py-3">
                      <!-- Pill classes mirror templates/matches.html (status badges); keep in sync -->
                      <span :class="statusPill[m.status]?.cls">
                        <span x-show="m.status === 'LIVE'"
                              class="live-indicator inline-block w-1.5 h-1.5 bg-red-500 rounded-full"></span>
                        <span x-text="statusPill[m.status]?.label ?? m.status"></span>
                      </span>
                    </td>
                    <td class="px-2 py-3 text-center">
                      <button x-show="m.status !== 'FINISHED' || seasonInSetupMode"
                              @click="openManage(m)"
                              class="text-gray-300 hover:text-indigo-500 transition-colors p-0.5 rounded"
                              title="Manage match">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                          <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                        </svg>
                      </button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- Required by fragments/match-admin-modal: forms and close handlers target this id -->
      <div id="match-admin-modal"></div>

      <script th:inline="javascript">
        window.__adminMatchesBoot = {
          currentRound: /*[[${currentRound}]]*/ 1,
          maxRounds: /*[[${maxRounds}]]*/ 38,
          seasonInSetupMode: /*[[${seasonInSetupMode}]]*/ false,
          dataUrl: /*[[@{/admin/matches/data}]]*/ '/admin/matches/data',
          modalUrlTemplate: /*[[@{/matches}]]*/ '/matches'
        };
      </script>
      <script th:inline="none">
        document.addEventListener('alpine:init', () => {
          Alpine.data('adminMatchesPage', () => ({
            loading: true,
            loadError: false,
            teamsById: {},
            teamsList: [],
            roundPosById: {},
            matches: [],
            currentRound: window.__adminMatchesBoot.currentRound,
            maxRounds: window.__adminMatchesBoot.maxRounds,
            seasonInSetupMode: window.__adminMatchesBoot.seasonInSetupMode,

            filters: { ground: 'HA', teamId: '', status: '', month: '', matchday: '', round: '' },
            // column: null = neutral (original load order: kickoff ASC, nulls last)
            sort: { column: null, dir: null },
            page: 1,
            pageSize: 10,
            pageSizeOptions: [10, 25, 50],

            naturalDir: { home: 'asc', score: 'desc', away: 'asc', md: 'asc', gw: 'asc', kickoff: 'asc', status: 'asc' },
            statusRank: { LIVE: 0, SUSPENDED: 1, SCHEDULED: 2, POSTPONED: 3, FINISHED: 4, CANCELLED: 5 },
            statusPill: {
              FINISHED:  { label: 'FT',        cls: 'inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-gray-100 text-gray-600' },
              LIVE:      { label: 'LIVE',      cls: 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-red-50 text-red-700 border border-red-200' },
              SCHEDULED: { label: 'Upcoming',  cls: 'inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-blue-50 text-blue-700' },
              POSTPONED: { label: 'Postponed', cls: 'inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-violet-50 border border-violet-400 text-violet-700' },
              SUSPENDED: { label: 'Suspended', cls: 'inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-orange-50 border border-orange-300 text-orange-700' },
              CANCELLED: { label: 'Cancelled', cls: 'inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-red-50 border border-red-300 text-red-600' },
            },

            init() {
              this.filters.round = String(this.currentRound);
              document.body.addEventListener('matchUpdated', (e) => {
                if (e.detail && e.detail.match) {
                  this.patchMatch(e.detail.match);
                } else {
                  this.reload();
                }
              });
              this.reload();
            },

            async reload() {
              this.loading = this.matches.length === 0;
              try {
                const res = await fetch(window.__adminMatchesBoot.dataUrl, { headers: { Accept: 'application/json' } });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                this.currentRound = data.currentRound;
                this.teamsById = Object.fromEntries(data.teams.map((t) => [t.id, t]));
                this.teamsList = [...data.teams].sort((a, b) => a.shorterName.localeCompare(b.shorterName));
                this.roundPosById = Object.fromEntries(data.rounds.map((r) => [r.id, r.position]));
                this.matches = data.matches.map((m) => ({ ...m, roundPosition: this.roundPosById[m.roundId] ?? 0 }));
                this.page = Math.min(this.page, this.totalPages);
                this.loadError = false;
              } catch (err) {
                this.loadError = true;
              } finally {
                this.loading = false;
              }
            },

            patchMatch(entry) {
              this.matches = this.matches.map((m) =>
                m.id === entry.id ? { ...entry, roundPosition: this.roundPosById[entry.roundId] ?? 0 } : m
              );
              // A mutation can push the row out of the active filters (e.g. rescheduled away
              // from the filtered round) — surface that so it doesn't read as data loss.
              if (!this.filtered.some((m) => m.id === entry.id)) {
                this.showNotice('Match updated — it no longer matches the current filters.');
              }
              this.page = Math.min(this.page, this.totalPages);
            },

            notice: '',
            _noticeTimer: null,
            showNotice(msg) {
              this.notice = msg;
              clearTimeout(this._noticeTimer);
              this._noticeTimer = setTimeout(() => { this.notice = ''; }, 6000);
            },

            get roundNumbers() {
              return Array.from({ length: this.maxRounds }, (_, i) => i + 1);
            },
            get months() {
              // kickOff is UTC "…Z", so slice(0,7) is the UTC YYYY-MM (doc §5: derived, chronological)
              return [...new Set(this.matches.filter((m) => m.kickOff).map((m) => m.kickOff.slice(0, 7)))].sort();
            },
            get filtered() {
              return this.matches.filter((m) => {
                if (this.filters.teamId) {
                  const t = this.filters.teamId;
                  if (this.filters.ground === 'HOME' && m.homeTeamId !== t) return false;
                  if (this.filters.ground === 'AWAY' && m.awayTeamId !== t) return false;
                  if (this.filters.ground === 'HA' && m.homeTeamId !== t && m.awayTeamId !== t) return false;
                }
                if (this.filters.status && m.status !== this.filters.status) return false;
                if (this.filters.month && (!m.kickOff || m.kickOff.slice(0, 7) !== this.filters.month)) return false;
                if (this.filters.matchday && m.matchday !== Number(this.filters.matchday)) return false;
                if (this.filters.round && m.roundPosition !== Number(this.filters.round)) return false;
                return true;
              });
            },
            get sorted() {
              if (!this.sort.column) return this.filtered;
              return [...this.filtered].sort(this.comparator());
            },
            get totalPages() {
              return Math.max(1, Math.ceil(this.filtered.length / this.pageSize));
            },
            get pageRows() {
              return this.sorted.slice((this.page - 1) * this.pageSize, this.page * this.pageSize);
            },
            get showingFrom() {
              return this.filtered.length ? (this.page - 1) * this.pageSize + 1 : 0;
            },
            get showingTo() {
              return Math.min(this.page * this.pageSize, this.filtered.length);
            },

            setSort(col) {
              // Cycle: natural direction -> flipped -> neutral (original order)
              if (this.sort.column !== col) {
                this.sort = { column: col, dir: this.naturalDir[col] };
              } else if (this.sort.dir === this.naturalDir[col]) {
                this.sort.dir = this.sort.dir === 'asc' ? 'desc' : 'asc';
              } else {
                this.sort = { column: null, dir: null };
              }
              this.page = 1;
            },
            sortIndicator(col) {
              return this.sort.column === col ? (this.sort.dir === 'asc' ? '▲' : '▼') : '⇅';
            },
            teamName(id) {
              return this.teamsById[id]?.shorterName ?? '';
            },
            teamCode(id) {
              return this.teamsById[id]?.code ?? '';
            },
            tlaClass(m, side) {
              // Result colors mirror fragments/prediction-table.html (my-table fixtures); keep in sync
              const base = 'inline-flex items-center justify-center w-8 text-[10px] font-semibold rounded px-1 py-0.5 ';
              if (m.status === 'LIVE') return base + 'bg-blue-50 text-blue-700';
              if (m.status === 'FINISHED' && m.score) {
                const mine = side === 'home' ? m.score.homeGoals : m.score.awayGoals;
                const theirs = side === 'home' ? m.score.awayGoals : m.score.homeGoals;
                if (mine > theirs) return base + 'bg-green-50 text-green-700';
                if (mine < theirs) return base + 'bg-red-50 text-red-700';
                return base + 'bg-amber-100 text-amber-700';
              }
              return base + 'bg-gray-100 text-gray-600';
            },
            scoreKey(m) {
              // Ground-aware: the Score column sorts by the goals of the selected ground
              if (!m.score) return null;
              if (this.filters.ground === 'HOME') return m.score.homeGoals;
              if (this.filters.ground === 'AWAY') return m.score.awayGoals;
              return m.score.homeGoals + m.score.awayGoals;
            },
            comparator() {
              const dir = this.sort.dir === 'asc' ? 1 : -1;
              const kick = (a, b) =>
                (a.kickOff || '9999').localeCompare(b.kickOff || '9999') || a.id.localeCompare(b.id);
              switch (this.sort.column) {
                case 'home':
                  return (a, b) => dir * this.teamName(a.homeTeamId).localeCompare(this.teamName(b.homeTeamId)) || kick(a, b);
                case 'away':
                  return (a, b) => dir * this.teamName(a.awayTeamId).localeCompare(this.teamName(b.awayTeamId)) || kick(a, b);
                case 'md':
                  return (a, b) => dir * (a.matchday - b.matchday) || kick(a, b);
                case 'gw':
                  return (a, b) => dir * (a.roundPosition - b.roundPosition) || kick(a, b);
                case 'status':
                  return (a, b) => dir * (this.statusRank[a.status] - this.statusRank[b.status]) || kick(a, b);
                case 'score':
                  return (a, b) => {
                    const ka = this.scoreKey(a);
                    const kb = this.scoreKey(b);
                    if (ka === null && kb === null) return kick(a, b);
                    if (ka === null) return 1; // unplayed last, regardless of direction
                    if (kb === null) return -1;
                    return dir * (ka - kb) || kick(a, b);
                  };
                default:
                  return (a, b) => dir * kick(a, b);
              }
            },

            setMatchday(v) {
              this.filters.matchday = v;
              if (v) this.filters.round = '';
              this.page = 1;
            },
            setRound(v) {
              this.filters.round = v;
              if (v) this.filters.matchday = '';
              this.page = 1;
            },
            setPageSize(v) {
              this.pageSize = Number(v);
              this.page = 1;
            },
            resetFilters() {
              this.filters = { ground: 'HA', teamId: '', status: '', month: '', matchday: '', round: String(this.currentRound) };
              this.sort = { column: null, dir: null };
              this.pageSize = 10;
              this.page = 1;
            },

            monthLabel(yyyyMm) {
              const d = new Date(yyyyMm + '-01T00:00:00Z');
              return d.toLocaleDateString(undefined, { month: 'short', year: 'numeric', timeZone: 'UTC' });
            },
            formatKickoff(iso) {
              if (!iso) return '—';
              const d = new Date(iso);
              return isNaN(d) ? iso : d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
            },

            openManage(m) {
              // htmx.ajax rather than hx-* attributes: htmx never processes attributes on
              // nodes Alpine creates after settle, so declarative hx-get would be inert here.
              const qs = new URLSearchParams({
                round: m.roundPosition,
                home: this.teamName(m.homeTeamId),
                away: this.teamName(m.awayTeamId),
              });
              htmx.ajax('GET', window.__adminMatchesBoot.modalUrlTemplate + '/' + m.slug + '/admin-modal?' + qs, {
                target: '#match-admin-modal',
                swap: 'innerHTML',
              });
            },
          }));
        });
      </script>
