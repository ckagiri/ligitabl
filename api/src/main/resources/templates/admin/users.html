<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}"
>
  <body>
    <div layout:fragment="content">
      <!-- min-w-0: outermost link in the chain the table was widening (see .au-card below). -->
      <section class="max-w-6xl min-w-0 mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8">
          <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">Users</h1>
          <p class="mt-2 text-sm text-gray-600">All registered users, most recent login first.</p>
        </div>

        <div id="admin-users-content" th:fragment="usersContent" class="au-card bg-white shadow rounded-lg">
          <!-- Batch-delete form: empty shell, referenced remotely by each eligible row's checkbox via form="batch-delete-form" -->
          <form id="batch-delete-form" method="post" th:action="@{/admin/users/batch-delete}"
                onsubmit="return confirmBatchDelete()">
            <input type="hidden" name="page" th:value="${currentPage}" />
            <input type="hidden" name="size" th:value="${pageSize}" />
          </form>
          <script th:inline="none">
            function confirmBatchDelete() {
              var selected = document.querySelectorAll('.row-checkbox:checked').length;
              if (selected === 0) return false;
              return confirm('Delete ' + selected + ' selected account(s)? This cannot be undone.');
            }

            // Client-side only: reorders the current page's rows by suspicion score. Scoring is
            // computed on read (not persisted, not indexed), so a true cross-page sort would mean
            // scoring every user in the table on every request — this sorts what's already on screen.
            var suspicionSortAsc = false;
            function sortBySuspicionScore() {
              var tbody = document.querySelector('#admin-users-content tbody');
              var rows = Array.prototype.slice.call(tbody.querySelectorAll('tr[data-score]'));
              suspicionSortAsc = !suspicionSortAsc;
              rows.sort(function (a, b) {
                var diff = Number(a.dataset.score) - Number(b.dataset.score);
                return suspicionSortAsc ? diff : -diff;
              });
              rows.forEach(function (row) { tbody.appendChild(row); });
            }
          </script>

          <div class="px-3 sm:px-6 py-3 flex items-center justify-between gap-3 border-b border-gray-200" th:if="${!#lists.isEmpty(users)}">
            <span class="text-xs text-gray-500">Check eligible (🚩) rows to batch-delete.</span>
            <button type="submit" form="batch-delete-form" title="Delete selected"
                    class="p-1.5 text-red-700 bg-red-50 border border-red-200 rounded-md hover:bg-red-100">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
              <span class="sr-only">Delete selected</span>
            </button>
          </div>

          <!--
            No pinned columns: the table simply scrolls sideways, and alternating row bands are
            what keep your eye on the right row once the email has scrolled out of view.

            Scoped CSS rather than Tailwind utilities because dist/css/main.css is a BUILT
            artifact — Tailwind only emits a class that already appears in a scanned template, so
            a newly introduced utility is silently inert until someone runs `npm run build`.
            `overscroll-x-contain` is absent from the current build; leaderboard.html ships its
            table CSS the same way.
          -->
          <style>
            /* A checkbox needs no more, and a narrow first column shortens the scroll. */
            .au-check-col { min-width: 56px !important; max-width: 56px !important; }
            /*
              min-width, not a w-* utility. In an auto-layout table a width is only a hint the
              browser may ignore, and it did: the email column collapsed to ~55px and broke
              addresses over five lines.

              And NOT word-break: break-all, which is what caused that. break-all sets the
              column's min-content width to a single character, so the other columns were free to
              squeeze this one to nothing. overflow-wrap only breaks a word that cannot fit on its
              own line, so a long address still wraps but never invites the collapse.
            */
            .au-email-col { min-width: 12rem; overflow-wrap: anywhere; }
            /* A swipe that overruns the table would otherwise trigger the browser back gesture. */
            .au-table-scroll { overscroll-behavior-x: contain; }
            /*
              min-width: 0 stops the table's min-content width propagating up and stretching the
              card; position: relative anchors the .sr-only rule below.
            */
            .au-card, .au-table-scroll { min-width: 0; max-width: 100%; position: relative; }
            /*
              Tailwind's .sr-only is position:absolute with no inset, so the row buttons' labels
              sat at their cell's natural x (~810px). overflow-x clips their painting but they
              still count toward scrollable width, so <html> scrolled to 813px while <body> was a
              correct 375. Pinning them here is invisible to sighted users and keeps the a11y tree.
            */
            .au-table-scroll .sr-only { left: 0; top: 0; }
            @media (max-width: 639px) {
              .au-table-scroll::-webkit-scrollbar { height: 3px; }
              .au-table-scroll::-webkit-scrollbar-track { background: transparent; }
              .au-table-scroll::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }
            }
          </style>

          <div class="overflow-x-auto au-table-scroll">
            <table class="min-w-full divide-y divide-gray-200">
              <!--
                All nine columns stay at every width; the table scrolls horizontally on narrow
                screens. Padding is tight below sm so the scroll distance is as short as it can be
                without dropping anything.
              -->
              <thead>
                <tr class="bg-gray-50">
                  <th class="au-check-col px-2 sm:px-4 py-3 text-left">
                    <input type="checkbox" onchange="document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = this.checked)" />
                  </th>
                  <th class="au-email-col px-2 sm:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                  <th class="px-2 sm:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider whitespace-nowrap">Display Name</th>
                  <th class="px-2 sm:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Auth</th>
                  <th class="px-2 sm:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Created</th>
                  <th class="px-2 sm:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider whitespace-nowrap">Last Login</th>
                  <th class="px-2 sm:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                      title="total-predictions:total-swaps current-season-prediction(1/0):current-season-swaps">Preds</th>
                  <th class="px-2 sm:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    <button type="button" onclick="sortBySuspicionScore()" class="uppercase tracking-wider hover:text-gray-700 whitespace-nowrap"
                            title="Sort this page by suspicion score (client-side; score isn't persisted or indexed)">
                      Susp ↕
                    </button>
                  </th>
                  <th class="px-2 sm:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    Action
                  </th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-100" th:with="failed=${failedDeleteIds != null ? failedDeleteIds : {}}">
                <tr th:each="u, stat : ${users}" th:with="eng=${engagement.get(u.id)},susp=${suspicion.get(u.id)}"
                    th:attr="data-score=${susp.score()}"
                    th:class="${stat.even} ? 'bg-gray-100 hover:bg-indigo-50' : 'bg-white hover:bg-indigo-50'">
                  <td class="au-check-col px-2 sm:px-4 py-3">
                    <input th:if="${eng.eligibleForDelete()}" type="checkbox" name="ids" th:value="${u.id}"
                           form="batch-delete-form" class="row-checkbox" />
                  </td>
                  <!-- au-email-col holds the column open (see the min-width note above). -->
                  <td class="au-email-col px-2 sm:px-6 py-3 text-sm text-gray-900" th:text="${u.email.value()}"></td>
                  <td class="px-2 sm:px-6 py-3 text-sm text-gray-700" x-data="{ editing: false }">
                    <div x-show="!editing">
                      <span th:if="${u.displayName != null}" th:text="${u.displayName}"></span>
                      <span th:if="${u.displayName == null}" class="text-gray-400">—</span>
                      <div class="flex items-center gap-1">
                        <span th:if="${u.username != null}" class="text-xs text-gray-400" th:text="'@' + ${u.username}"></span>
                        <button type="button" @click="editing = true" title="Edit username"
                                class="p-0.5 text-gray-300 hover:text-indigo-600">
                          <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                          </svg>
                          <span class="sr-only">Edit username</span>
                        </button>
                      </div>
                    </div>
                    <form x-cloak x-show="editing" method="post"
                          th:action="@{/admin/users/{id}/username(id=${u.id})}"
                          class="flex items-center gap-1">
                      <input type="hidden" name="page" th:value="${currentPage}" />
                      <input type="hidden" name="size" th:value="${pageSize}" />
                      <input type="text" name="username" th:value="${u.username}"
                             pattern="[a-z0-9_]{3,30}" maxlength="30" placeholder="username"
                             title="a-z, 0-9, _ (3-30 chars) — leave empty to clear"
                             class="w-28 border border-gray-300 rounded px-1.5 py-0.5 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500" />
                      <button type="submit" title="Save"
                              class="p-1 text-green-700 hover:bg-green-50 rounded">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                        <span class="sr-only">Save</span>
                      </button>
                      <button type="button" @click="editing = false" title="Cancel"
                              class="p-1 text-gray-500 hover:bg-gray-100 rounded">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                        <span class="sr-only">Cancel</span>
                      </button>
                    </form>
                  </td>
                  <td class="px-2 sm:px-6 py-3 text-sm">
                    <svg th:if="${u.googleId != null}" class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true">
                      <title>Google</title>
                      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                    </svg>
                    <svg th:if="${u.googleId == null}" class="h-5 w-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                      <title>Password</title>
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                  </td>
                  <td class="px-2 sm:px-6 py-3 text-sm text-gray-600 whitespace-nowrap">
                    <span th:if="${u.createDate != null}" th:text="${#temporals.format(u.createDate, 'yyyy-MM-dd')}"></span>
                    <span th:if="${u.createDate == null}" class="text-gray-400">—</span>
                  </td>
                  <td class="px-2 sm:px-6 py-3 text-sm text-gray-600 whitespace-nowrap"
                      th:text="${lastLoginDisplay.get(u.id)}"></td>
                  <td class="px-2 sm:px-6 py-3 text-sm">
                    <div class="flex flex-col leading-tight">
                      <span class="text-gray-700" th:text="${eng.totalPredictions()} + ':' + ${eng.totalSwaps()}"></span>
                      <span class="text-indigo-600" th:text="${eng.hasCurrentSeasonPrediction() ? 1 : 0} + ':' + ${eng.currentSeasonSwaps()}"></span>
                    </div>
                  </td>
                  <td class="px-2 sm:px-6 py-3 text-sm text-gray-600 whitespace-nowrap" th:title="${susp.reasonsTooltip()}">
                    <span th:text="${susp.score()}"></span>
                    <span th:if="${!#strings.isEmpty(susp.icon())}" th:text="${susp.icon()}" class="ml-1"></span>
                    <span th:if="${!#strings.isEmpty(eng.indicator()) and eng.indicator() != susp.icon()}"
                          th:text="${eng.indicator()}" class="ml-1"></span>
                  </td>
                  <td class="px-2 sm:px-6 py-3 text-sm">
                    <form th:if="${eng.eligibleForDelete()}" method="post"
                          th:action="@{/admin/users/{id}/delete(id=${u.id})}"
                          th:attr="data-swaps=${eng.currentSeasonSwaps()}"
                          onsubmit="return confirm(this.dataset.swaps > 0
                            ? ('This user has ' + this.dataset.swaps + ' swap(s) in the current season but no history from prior seasons — delete?')
                            : 'Delete this user? This cannot be undone.')">
                      <input type="hidden" name="page" th:value="${currentPage}" />
                      <input type="hidden" name="size" th:value="${pageSize}" />
                      <button type="submit" title="Delete"
                              class="p-1.5 text-red-700 bg-red-50 border border-red-200 rounded hover:bg-red-100">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                        <span class="sr-only">Delete</span>
                      </button>
                    </form>
                    <span th:if="${failed.contains(u.id)}"
                          class="ml-1 inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-red-100 text-red-800"
                          title="Delete failed — see server logs">
                      ⚠️ Delete failed
                    </span>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}">
                  <!-- Spans the widest configuration; a colspan larger than the rendered column
                       count is harmless, and hard-coding 4 would break the row at lg. -->
                  <td colspan="9" class="px-6 py-8 text-center text-sm text-gray-500">No users found.</td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Pagination -->
          <div class="px-3 sm:px-6 py-4 flex flex-wrap items-center justify-between gap-3 border-t border-gray-200">
            <div class="flex flex-wrap items-center gap-3 text-sm text-gray-500">
              <span>
                Showing <span th:text="${showingFrom}">1</span>–<span th:text="${showingTo}">10</span>
                of <span th:text="${totalEntries}">0</span> users
              </span>
              <label class="flex items-center gap-1">
                <span class="text-gray-500 whitespace-nowrap">Per page</span>
                <select
                  name="size"
                  class="border border-gray-300 rounded-md text-sm px-2 py-1 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  hx-get="/admin/users"
                  hx-vals='{"page": "1"}'
                  hx-target="#admin-users-content"
                  hx-swap="outerHTML show:window:top"
                >
                  <option th:each="opt : ${pageSizeOptions}" th:value="${opt}" th:text="${opt}" th:selected="${opt == pageSize}"></option>
                </select>
              </label>
            </div>
            <div class="flex space-x-2">
              <button
                th:if="${hasPreviousPage == true}"
                th:attr="hx-get=@{/admin/users(page=${currentPage - 1}, size=${pageSize})}"
                hx-target="#admin-users-content"
                hx-swap="outerHTML show:window:top"
                class="px-3 py-2 text-sm border border-gray-300 rounded-md hover:bg-gray-50"
              >
                Previous
              </button>
              <button
                th:if="${hasPreviousPage == false}"
                disabled
                class="px-3 py-2 text-sm border border-gray-300 rounded-md disabled:opacity-50"
              >
                Previous
              </button>
              <button
                th:if="${hasNextPage == true}"
                th:attr="hx-get=@{/admin/users(page=${currentPage + 1}, size=${pageSize})}"
                hx-target="#admin-users-content"
                hx-swap="outerHTML show:window:top"
                class="px-3 py-2 text-sm border border-gray-300 rounded-md hover:bg-gray-50"
              >
                Next
              </button>
              <button
                th:if="${hasNextPage == false}"
                disabled
                class="px-3 py-2 text-sm border border-gray-300 rounded-md disabled:opacity-50"
              >
                Next
              </button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
