<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}"
>
  <body>
    <div layout:fragment="content">
      <div class="max-w-2xl mx-auto px-4 py-6" x-data="{ deleteConfirmName: '' }">

        <!-- ── Back link ── -->
        <a th:href="@{/contests/{id}(id=${contest.id})}"
           class="inline-flex items-center gap-1.5 text-sm text-gray-500 hover:text-gray-700 mb-6 transition">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
          Back
        </a>

        <h1 class="text-xl font-bold text-gray-900 mb-6">
          <span th:text="${contest.name}">Contest</span> — Settings
        </h1>

        <!-- ── Allow new members ── -->
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm divide-y divide-gray-100 mb-4">
          <div class="px-5 py-4">
            <div class="flex items-center justify-between gap-4">
              <div>
                <p class="text-sm font-medium text-gray-800">Allow new members to join</p>
                <p class="text-xs text-gray-500 mt-0.5">Toggle whether the contest is open to new joiners.</p>
              </div>
              <form method="post" th:action="@{/contests/{id}/toggle-joining(id=${contest.id})}">
                <button
                  type="submit"
                  th:class="${contest.isOpen}
                    ? 'bg-green-500 hover:bg-green-600 text-white'
                    : 'bg-gray-200 hover:bg-gray-300 text-gray-700'"
                  class="px-3 py-1.5 text-sm font-medium rounded-lg transition"
                  th:text="${contest.isOpen} ? 'Open → Close' : 'Closed → Open'"
                >Toggle</button>
              </form>
            </div>
          </div>

          <!-- ── Regenerate invite code ── -->
          <div class="px-5 py-4">
            <div class="flex items-center justify-between gap-4">
              <div>
                <p class="text-sm font-medium text-gray-800">Regenerate invite code</p>
                <p class="text-xs text-gray-500 mt-0.5">Current members remain; old code stops working immediately.</p>
              </div>
              <form method="post" th:action="@{/contests/{id}/regenerate-code(id=${contest.id})}"
                    onsubmit="return confirm('Generate a new invite code? The current code will stop working.')">
                <button type="submit"
                        class="px-3 py-1.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition">
                  Regenerate
                </button>
              </form>
            </div>
          </div>
        </div>

        <!-- ── Danger zone ── -->
        <div class="bg-white rounded-xl border border-red-100 shadow-sm px-5 py-4">
          <p class="text-sm font-semibold text-red-700 mb-1">Danger zone</p>
          <p class="text-xs text-gray-500 mb-4">
            Deleting is blocked once 2+ members have scored rounds. All data is permanently removed.
          </p>
          <div class="flex items-center gap-2">
            <input
              type="text"
              x-model="deleteConfirmName"
              placeholder="Type contest name to confirm"
              class="flex-1 px-3 py-1.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-red-400"
            />
            <form method="post" th:action="@{/contests/{id}/delete(id=${contest.id})}">
              <button
                type="submit"
                :disabled="deleteConfirmName !== [[${contest.name}]]"
                class="px-3 py-1.5 text-sm font-medium text-white bg-red-600 hover:bg-red-700 disabled:opacity-40 disabled:cursor-not-allowed rounded-lg transition"
              >
                Delete
              </button>
            </form>
          </div>
        </div>

      </div>
    </div>
  </body>
</html>
