<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}"
>
  <body>
    <div layout:fragment="content">
      <div class="max-w-lg mx-auto px-4 py-12">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
          <h1 class="text-2xl font-bold text-gray-900 mb-2">Join a Private Contest</h1>
          <p class="text-gray-500 mb-6">Enter the invite code shared with you. You'll be asked to sign in if you haven't already.</p>

          <!-- Form GETs /join?code=XYZ → controller redirects to /i/{code} → auth → preview -->
          <form method="get" action="/join">
            <label for="code" class="block text-sm font-medium text-gray-700 mb-1">
              Invite code
            </label>
            <input
              id="code"
              name="code"
              type="text"
              placeholder="e.g. AB3K7PQ"
              autocomplete="off"
              autocapitalize="characters"
              maxlength="7"
              class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent mb-4"
            />
            <button
              type="submit"
              class="w-full px-4 py-2.5 bg-green-500 hover:bg-green-600 text-white text-sm font-medium rounded-lg transition"
            >
              Continue
            </button>
          </form>

          <p class="mt-6 text-center text-sm text-gray-500">
            Don't have an account?
            <a href="/auth/register" class="text-indigo-600 hover:text-indigo-800 font-medium">Sign up</a>
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
