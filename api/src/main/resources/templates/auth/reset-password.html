<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}"
>
  <body>
    <div layout:fragment="content">
      <div
        class="flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8"
      >
        <div class="max-w-md w-full space-y-8">
          <div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
              Set new password
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
              Enter a new password for your account.
            </p>
          </div>

          <form
            class="mt-8 space-y-6"
            th:action="@{/auth/reset-password}"
            method="post"
            th:object="${resetPasswordForm}"
            x-data="{
              password: '',
              confirmPassword: '',
              passwordLengthOk() {
                return this.password.length >= 8;
              },
              passwordTooShort() {
                return this.password.length > 0 && this.password.length < 8;
              },
              passwordsMatch() {
                return this.password === this.confirmPassword && this.password.length > 0;
              },
              passwordsDontMatch() {
                return this.password !== this.confirmPassword && this.confirmPassword.length > 0;
              },
              formValid() {
                return this.passwordLengthOk() && this.passwordsMatch();
              }
            }"
          >
            <input type="hidden" th:field="*{token}" />

            <div
              th:if="${error}"
              class="rounded-md bg-red-50 border border-red-200 p-3 text-sm text-red-700"
              role="alert"
              th:text="${error}"
            ></div>

            <div class="space-y-4">
              <!-- New Password -->
              <div>
                <label
                  for="newPassword"
                  class="block text-sm font-medium text-gray-700 mb-1"
                >
                  New Password
                </label>
                <div class="relative" x-data="{ show: false }">
                  <input
                    id="newPassword"
                    name="newPassword"
                    :type="show ? 'text' : 'password'"
                    th:field="*{newPassword}"
                    x-model="password"
                    required
                    th:classappend="${#fields.hasErrors('newPassword')} ? 'border-red-300' : 'border-gray-300'"
                    class="appearance-none relative block w-full px-3 py-2 pr-10 border placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                    placeholder="••••••••"
                  />
                  <button
                    type="button"
                    @mousedown="show = true"
                    @mouseup="show = false"
                    @mouseleave="show = false"
                    @touchstart.prevent="show = true"
                    @touchend="show = false"
                    class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600 focus:outline-none"
                    aria-label="Peek password"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      class="h-5 w-5"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                      />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                      />
                    </svg>
                  </button>
                </div>
                <p
                  th:if="${#fields.hasErrors('newPassword')}"
                  th:errors="*{newPassword}"
                  class="mt-1 text-sm text-red-600"
                ></p>
                <p x-show="password.length === 0" class="mt-1 text-xs text-gray-500">
                  Must be at least 8 characters
                </p>
                <div x-show="passwordLengthOk()" class="mt-1 flex items-center text-sm text-green-600">
                  <svg class="h-4 w-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                  </svg>
                  Good length
                </div>
                <div x-show="passwordTooShort()" class="mt-1 flex items-center text-sm text-red-600">
                  <svg class="h-4 w-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                  </svg>
                  Min 8 characters
                </div>
              </div>

              <!-- Confirm Password -->
              <div>
                <label
                  for="confirmPassword"
                  class="block text-sm font-medium text-gray-700 mb-1"
                >
                  Confirm Password
                </label>
                <div class="relative" x-data="{ show: false }">
                  <input
                    id="confirmPassword"
                    name="confirmPassword"
                    :type="show ? 'text' : 'password'"
                    th:field="*{confirmPassword}"
                    x-model="confirmPassword"
                    required
                    th:classappend="${#fields.hasErrors('confirmPassword')} ? 'border-red-300' : 'border-gray-300'"
                    class="appearance-none relative block w-full px-3 py-2 pr-10 border placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                    placeholder="••••••••"
                  />
                  <button
                    type="button"
                    @mousedown="show = true"
                    @mouseup="show = false"
                    @mouseleave="show = false"
                    @touchstart.prevent="show = true"
                    @touchend="show = false"
                    class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600 focus:outline-none"
                    aria-label="Peek password"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      class="h-5 w-5"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                      />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                      />
                    </svg>
                  </button>
                </div>
                <p
                  th:if="${#fields.hasErrors('confirmPassword')}"
                  th:errors="*{confirmPassword}"
                  class="mt-1 text-sm text-red-600"
                ></p>

                <!-- Password match indicator -->
                <div x-show="passwordsMatch()" class="mt-1 flex items-center text-sm text-green-600">
                  <svg class="h-4 w-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
                    <path
                      fill-rule="evenodd"
                      d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                      clip-rule="evenodd"
                    />
                  </svg>
                  Passwords match
                </div>
                <div x-show="passwordsDontMatch()" class="mt-1 flex items-center text-sm text-red-600">
                  <svg class="h-4 w-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
                    <path
                      fill-rule="evenodd"
                      d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                      clip-rule="evenodd"
                    />
                  </svg>
                  Passwords don't match
                </div>
              </div>
            </div>

            <div>
              <button
                type="submit"
                class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition disabled:opacity-50 disabled:cursor-not-allowed"
                :disabled="!formValid()"
              >
                <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                  <svg
                    class="h-5 w-5 text-indigo-500 group-hover:text-indigo-400"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 20 20"
                    fill="currentColor"
                  >
                    <path
                      fill-rule="evenodd"
                      d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
                      clip-rule="evenodd"
                    />
                  </svg>
                </span>
                Reset password
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
