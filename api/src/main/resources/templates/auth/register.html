<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}"
>
  <body>
    <div layout:fragment="content">
      <div
        class="flex items-center justify-center bg-gray-50 px-4 sm:px-6 lg:px-8"
      >
        <div class="max-w-md w-full space-y-8">
          <div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
              Create your account
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
              Or
              <a
                th:href="@{/auth/login}"
                class="font-medium text-indigo-600 hover:text-indigo-500"
              >
                sign in to your account
              </a>
            </p>
          </div>

          <div class="space-y-4">
            <a
              th:href="@{/oauth2/authorization/google}"
              class="w-full inline-flex items-center justify-center gap-3 rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 transition"
            >
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="h-5 w-5" aria-hidden="true">
                <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303C33.65 32.657 29.219 36 24 36c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.276 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.656 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.276 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
                <path fill="#4CAF50" d="M24 44c5.183 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.145 35.091 26.715 36 24 36c-5.199 0-9.617-3.325-11.283-7.946l-6.522 5.025C9.505 39.556 16.727 44 24 44z"/>
                <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-.794 2.237-2.231 4.166-4.084 5.57l.003-.002 6.19 5.238C36.971 39.207 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
              </svg>
              Sign up with Google
            </a>

            <div class="relative">
              <div class="absolute inset-0 flex items-center" aria-hidden="true">
                <div class="w-full border-t border-gray-200"></div>
              </div>
              <div class="relative flex justify-center text-xs uppercase">
                <span class="bg-gray-50 px-2 text-gray-500">Or sign up with email</span>
              </div>
            </div>
          </div>

          <form
            class="mt-8 space-y-6"
            th:action="@{/auth/register}"
            method="post"
            th:object="${registerForm}"
            x-data="{
              password: '',
              confirmPassword: '',
              passwordsMatch() {
                return this.password === this.confirmPassword && this.password.length > 0;
              },
              passwordsDontMatch() {
                return this.password !== this.confirmPassword && this.confirmPassword.length > 0;
              }
            }"
          >
            <div
              th:if="${error}"
              class="rounded-md bg-red-50 border border-red-200 p-3 text-sm text-red-700"
              role="alert"
              th:text="${error}"
            ></div>
            <div class="rounded-md shadow-sm space-y-4">
              <!-- Email -->
              <div>
                <label
                  for="email"
                  class="block text-sm font-medium text-gray-700 mb-1"
                  >Email address</label
                >
                <input
                  id="email"
                  name="email"
                  type="email"
                  th:field="*{email}"
                  required
                  th:classappend="${#fields.hasErrors('email')} ? 'border-red-300' : 'border-gray-300'"
                  class="appearance-none relative block w-full px-3 py-2 border placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm"
                  placeholder="you@example.com"
                />
                <p
                  th:if="${#fields.hasErrors('email')}"
                  th:errors="*{email}"
                  class="mt-1 text-sm text-red-600"
                ></p>
              </div>

              <!-- Display Name -->
              <div>
                <label
                  for="displayName"
                  class="block text-sm font-medium text-gray-700 mb-1"
                  >Display Name</label
                >
                <input
                  id="displayName"
                  name="displayName"
                  type="text"
                  th:field="*{displayName}"
                  required
                  th:classappend="${#fields.hasErrors('displayName')} ? 'border-red-300' : 'border-gray-300'"
                  class="appearance-none relative block w-full px-3 py-2 border placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm"
                  placeholder="Your Name"
                />
                <p
                  th:if="${#fields.hasErrors('displayName')}"
                  th:errors="*{displayName}"
                  class="mt-1 text-sm text-red-600"
                ></p>
              </div>

              <!-- Password -->
              <div>
                <label
                  for="password"
                  class="block text-sm font-medium text-gray-700 mb-1"
                  >Password</label
                >
                <div class="relative" x-data="{ show: false }">
                  <input
                    id="password"
                    name="password"
                    :type="show ? 'text' : 'password'"
                    th:field="*{password}"
                    x-model="password"
                    required
                    th:classappend="${#fields.hasErrors('password')} ? 'border-red-300' : 'border-gray-300'"
                    class="appearance-none relative block w-full px-3 py-2 pr-10 border placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                    placeholder="••••••••"
                  />
                  <button
                    type="button"
                    @mousedown="show = true"
                    @mouseup="show = false"
                    @mouseleave="show = false"
                    @touchstart.prevent="show = true"
                    @touchend="show = false"
                    class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600 focus:outline-none z-10"
                    aria-label="Peek password"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      class="h-5 w-5"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                      />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                      />
                    </svg>
                  </button>
                </div>
                <p
                  th:if="${#fields.hasErrors('password')}"
                  th:errors="*{password}"
                  class="mt-1 text-sm text-red-600"
                ></p>
                <p class="mt-1 text-xs text-gray-500">
                  Must be at least 8 characters
                </p>
              </div>

              <!-- Confirm Password -->
              <div>
                <label
                  for="confirmPassword"
                  class="block text-sm font-medium text-gray-700 mb-1"
                  >Confirm Password</label
                >
                <div class="relative" x-data="{ show: false }">
                  <input
                    id="confirmPassword"
                    name="confirmPassword"
                    :type="show ? 'text' : 'password'"
                    th:field="*{confirmPassword}"
                    x-model="confirmPassword"
                    required
                    th:classappend="${#fields.hasErrors('confirmPassword')} ? 'border-red-300' : 'border-gray-300'"
                    class="appearance-none relative block w-full px-3 py-2 pr-10 border placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                    placeholder="••••••••"
                  />
                  <button
                    type="button"
                    @mousedown="show = true"
                    @mouseup="show = false"
                    @mouseleave="show = false"
                    @touchstart.prevent="show = true"
                    @touchend="show = false"
                    class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600 focus:outline-none z-10"
                    aria-label="Peek password"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      class="h-5 w-5"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                      />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                      />
                    </svg>
                  </button>
                </div>
                <p
                  th:if="${#fields.hasErrors('confirmPassword')}"
                  th:errors="*{confirmPassword}"
                  class="mt-1 text-sm text-red-600"
                ></p>

                <div x-show="passwordsMatch()" class="mt-1 flex items-center text-sm text-green-600">
                  <svg class="h-4 w-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
                    <path
                      fill-rule="evenodd"
                      d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                      clip-rule="evenodd"
                    />
                  </svg>
                  Passwords match
                </div>
                <div x-show="passwordsDontMatch()" class="mt-1 flex items-center text-sm text-red-600">
                  <svg class="h-4 w-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
                    <path
                      fill-rule="evenodd"
                      d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                      clip-rule="evenodd"
                    />
                  </svg>
                  Passwords don't match
                </div>
              </div>
            </div>

            <div>
              <button
                type="submit"
                class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition disabled:opacity-50 disabled:cursor-not-allowed"
                :disabled="!passwordsMatch()"
              >
                <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                  <svg
                    class="h-5 w-5 text-indigo-500 group-hover:text-indigo-400"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 20 20"
                    fill="currentColor"
                  >
                    <path
                      fill-rule="evenodd"
                      d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
                      clip-rule="evenodd"
                    />
                  </svg>
                </span>
                Sign up
              </button>
            </div>

            <div class="text-center">
              <p class="text-xs text-gray-500">
                By signing up, you agree to our terms and conditions.
              </p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
