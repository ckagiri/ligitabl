<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}"
>
  <body>
    <div layout:fragment="content">
      <section class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Page Header -->
        <div class="mb-6 sm:mb-8">
          <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">My Contests</h1>
          <p class="mt-2 text-sm sm:text-base text-gray-600">Your contest history across all seasons.</p>
        </div>

        <!-- Profile Tabs -->
        <div class="mb-6 border-b border-gray-200 overflow-x-auto overflow-y-hidden">
          <nav class="-mb-px flex space-x-6 sm:space-x-8 min-w-max" aria-label="Profile sections">
            <a th:href="@{/profile/settings}"
               class="border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-3 sm:py-4 px-1 border-b-2 font-medium text-sm">Profile</a>
            <a th:href="@{/profile/connected-accounts}"
               class="border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-3 sm:py-4 px-1 border-b-2 font-medium text-sm">Connected Accounts</a>
            <a th:href="@{/profile/my-contests}"
               class="border-indigo-500 text-indigo-600 whitespace-nowrap py-3 sm:py-4 px-1 border-b-2 font-medium text-sm">My Contests</a>
          </nav>
        </div>

        <!-- Contest tabs: Active / Past -->
        <div x-data="{ tab: 'active' }" class="bg-white shadow rounded-lg">
          <div class="border-b border-gray-200 px-4 sm:px-6">
            <nav class="-mb-px flex gap-5" aria-label="Contest tabs">
              <button
                @click="tab = 'active'"
                :class="tab === 'active' ? 'text-indigo-600 font-semibold border-b-2 border-indigo-500' : 'text-gray-400 font-medium hover:text-indigo-500'"
                class="whitespace-nowrap py-3 text-sm transition-colors">Active</button>
              <button
                @click="tab = 'past'"
                :class="tab === 'past' ? 'text-indigo-600 font-semibold border-b-2 border-indigo-500' : 'text-gray-400 font-medium hover:text-indigo-500'"
                class="whitespace-nowrap py-3 text-sm transition-colors">Past</button>
            </nav>
          </div>

          <!-- Active tab -->
          <div x-show="tab === 'active'" class="p-4 sm:p-6">
            <th:block th:if="${activeTotal > 0}">
              <table class="min-w-full divide-y divide-gray-200">
                <thead>
                  <tr>
                    <th class="py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Contest</th>
                    <th class="py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Rank</th>
                    <th class="py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Members</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                  <tr th:each="c : ${activeContests}" class="hover:bg-gray-50 transition">
                    <td class="py-3 pr-4">
                      <a th:href="${c.link()}" onclick="window.flashNavLoadingBar()" class="text-sm font-medium text-indigo-600 hover:text-indigo-800" th:text="${c.contestName()}"></a>
                      <div class="flex flex-wrap items-center gap-1 mt-1">
                        <span
                          th:if="${c.isOwner()}"
                          class="inline-flex items-center px-1 py-0 rounded text-[10px] leading-4 font-medium bg-indigo-50 text-indigo-700"
                        >Owner</span>
                        <span
                          th:if="${c.status() == 'LIVE'}"
                          class="inline-flex items-center px-1 py-0 rounded text-[10px] leading-4 font-medium bg-green-100 text-green-700"
                        >Live</span>
                        <span
                          th:if="${c.status() == 'NEXT'}"
                          class="inline-flex items-center px-1 py-0 rounded text-[10px] leading-4 font-medium bg-blue-100 text-blue-700"
                        >Next</span>
                        <span
                          th:if="${c.status() == 'FUTURE'}"
                          class="inline-flex items-center px-1 py-0 rounded text-[10px] leading-4 font-medium bg-gray-100 text-gray-500"
                        >Future</span>
                        <span
                          th:if="${c.status() == 'FINISHED'}"
                          class="inline-flex items-center px-1 py-0 rounded text-[10px] leading-4 font-medium bg-gray-100 text-gray-600"
                        >Finished</span>
                      </div>
                      <div class="text-xs text-gray-500 mt-1"
                           th:text="${c.periodLabel() != null ? c.seasonName() + ' • ' + c.periodLabel() : c.seasonName()}"></div>
                    </td>
                    <td class="py-3 pr-4 text-sm text-gray-700">
                      <span th:if="${c.rank() != null}" th:text="${'#' + c.rank()}"></span>
                      <span th:if="${c.rank() == null}" class="text-gray-400">—</span>
                    </td>
                    <td class="py-3 text-sm text-gray-700">
                      <span th:text="${c.memberCount()}"></span>
                      <span
                        th:if="${c.isJoiningOpen()}"
                        title="Open for new members to join"
                        class="ml-1 inline-flex items-center px-1 py-0 rounded text-[10px] leading-4 font-medium bg-green-100 text-green-700"
                      >Open</span>
                    </td>
                  </tr>
                </tbody>
              </table>
              <th:block th:if="${activePages > 1}">
                <div class="mt-4 flex items-center justify-between text-sm text-gray-600">
                  <span th:text="${activeFrom + '–' + activeTo + ' of ' + activeTotal}"></span>
                  <div class="flex items-center gap-2">
                    <a th:if="${activePage > 1}"
                       th:href="@{/profile/my-contests(activePage=${activePage - 1}, pastPage=${pastPage})}"
                       class="px-3 py-1 border border-gray-300 rounded text-sm hover:bg-gray-50 transition">Prev</a>
                    <span th:if="${activePage <= 1}" class="px-3 py-1 border border-gray-200 rounded text-sm text-gray-300 cursor-not-allowed">Prev</span>
                    <a th:if="${activePage < activePages}"
                       th:href="@{/profile/my-contests(activePage=${activePage + 1}, pastPage=${pastPage})}"
                       class="px-3 py-1 border border-gray-300 rounded text-sm hover:bg-gray-50 transition">Next</a>
                    <span th:if="${activePage >= activePages}" class="px-3 py-1 border border-gray-200 rounded text-sm text-gray-300 cursor-not-allowed">Next</span>
                  </div>
                </div>
              </th:block>
            </th:block>
            <th:block th:if="${activeTotal == 0}">
              <p class="text-sm text-gray-500">No active contests.</p>
            </th:block>
          </div>

          <!-- Past tab -->
          <div x-show="tab === 'past'" style="display:none" class="p-4 sm:p-6">
            <th:block th:if="${pastTotal > 0}">
              <table class="min-w-full divide-y divide-gray-200">
                <thead>
                  <tr>
                    <th class="py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Contest</th>
                    <th class="py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Rank</th>
                    <th class="py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Members</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                  <tr th:each="c : ${pastContests}" class="hover:bg-gray-50 transition">
                    <td class="py-3 pr-4">
                      <a th:href="${c.link()}" onclick="window.flashNavLoadingBar()" class="text-sm font-medium text-indigo-600 hover:text-indigo-800" th:text="${c.contestName()}"></a>
                      <div class="flex flex-wrap items-center gap-1 mt-1">
                        <span
                          th:if="${c.isOwner()}"
                          class="inline-flex items-center px-1 py-0 rounded text-[10px] leading-4 font-medium bg-indigo-50 text-indigo-700"
                        >Owner</span>
                        <span class="inline-flex items-center px-1 py-0 rounded text-[10px] leading-4 font-medium bg-red-100 text-red-700">Over</span>
                      </div>
                      <div class="text-xs text-gray-500 mt-1"
                           th:text="${c.periodLabel() != null ? c.seasonName() + ' • ' + c.periodLabel() : c.seasonName()}"></div>
                    </td>
                    <td class="py-3 pr-4 text-sm text-gray-700">
                      <span th:if="${c.rank() != null}" th:text="${'#' + c.rank()}"></span>
                      <span th:if="${c.rank() == null}" class="text-gray-400">—</span>
                    </td>
                    <td class="py-3 text-sm text-gray-700" th:text="${c.memberCount()}"></td>
                  </tr>
                </tbody>
              </table>
              <th:block th:if="${pastPages > 1}">
                <div class="mt-4 flex items-center justify-between text-sm text-gray-600">
                  <span th:text="${pastFrom + '–' + pastTo + ' of ' + pastTotal}"></span>
                  <div class="flex items-center gap-2">
                    <a th:if="${pastPage > 1}"
                       th:href="@{/profile/my-contests(activePage=${activePage}, pastPage=${pastPage - 1})}"
                       class="px-3 py-1 border border-gray-300 rounded text-sm hover:bg-gray-50 transition">Prev</a>
                    <span th:if="${pastPage <= 1}" class="px-3 py-1 border border-gray-200 rounded text-sm text-gray-300 cursor-not-allowed">Prev</span>
                    <a th:if="${pastPage < pastPages}"
                       th:href="@{/profile/my-contests(activePage=${activePage}, pastPage=${pastPage + 1})}"
                       class="px-3 py-1 border border-gray-300 rounded text-sm hover:bg-gray-50 transition">Next</a>
                    <span th:if="${pastPage >= pastPages}" class="px-3 py-1 border border-gray-200 rounded text-sm text-gray-300 cursor-not-allowed">Next</span>
                  </div>
                </div>
              </th:block>
            </th:block>
            <th:block th:if="${pastTotal == 0}">
              <p class="text-sm text-gray-500">No past contests.</p>
            </th:block>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
