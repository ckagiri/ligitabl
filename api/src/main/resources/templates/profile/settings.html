<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}"
>
  <body>
    <div layout:fragment="content">
      <section class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Page Header -->
        <div class="mb-6 sm:mb-8">
          <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">
            Profile Settings
          </h1>
          <p class="mt-2 text-sm sm:text-base text-gray-600">
            Manage your personal information.
          </p>
        </div>

        <!-- Profile Tabs -->
        <div class="mb-6 border-b border-gray-200 overflow-x-auto">
          <nav class="-mb-px flex space-x-6 sm:space-x-8 min-w-max" aria-label="Profile sections">
            <a th:href="@{/profile/settings}"
               class="border-indigo-500 text-indigo-600 whitespace-nowrap py-3 sm:py-4 px-1 border-b-2 font-medium text-sm">Profile</a>
            <a th:href="@{/profile/connected-accounts}"
               class="border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-3 sm:py-4 px-1 border-b-2 font-medium text-sm">Connected Accounts</a>
            <a th:href="@{/profile/my-contests}"
               class="border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-3 sm:py-4 px-1 border-b-2 font-medium text-sm">My Contests</a>
          </nav>
        </div>

        <!-- Profile Form -->
        <div class="bg-white shadow rounded-lg">
          <form
            th:action="@{/profile/settings}"
            th:object="${profileForm}"
            method="post"
            class="p-4 sm:p-6 space-y-6"
          >
            <input
              type="hidden"
              th:name="${_csrf.parameterName}"
              th:value="${_csrf.token}"
            />

            <!-- Display Name -->
            <div>
              <label
                for="displayName"
                class="block text-sm font-medium text-gray-700 mb-2"
              >
                Display Name
              </label>
              <input
                type="text"
                id="displayName"
                th:field="*{displayName}"
                class="w-full px-3 sm:px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-base"
                placeholder="Your display name"
              />
              <p
                th:if="${#fields.hasErrors('displayName')}"
                th:errors="*{displayName}"
                class="mt-2 text-sm text-red-600"
              ></p>
              <p class="mt-2 text-xs sm:text-sm text-gray-500">
                This name appears on leaderboards and standings.
              </p>
            </div>

            <!-- Email Address -->
            <div>
              <label
                for="email"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Email Address</label
              >
              <input
                type="email"
                id="email"
                th:value="${profileForm.email}"
                disabled
                class="w-full px-3 sm:px-4 py-2 border border-gray-200 rounded-lg bg-gray-50 text-gray-400 cursor-not-allowed select-none text-base"
              />
              <p class="mt-2 text-xs sm:text-sm text-gray-500">
                Email cannot be changed from profile settings.
              </p>
            </div>

            <!-- Divider -->
            <div class="border-t border-gray-200"></div>

            <!-- Account Information -->
            <div class="pt-4 sm:pt-6">
              <h2 class="text-sm font-medium text-gray-700 mb-3">
                Account Information
              </h2>
              <dl class="space-y-3">
                <div>
                  <dt class="text-sm font-medium text-gray-500 mb-1.5">
                    Sign-in methods
                  </dt>
                  <dd>
                    <!-- Google + Password -->
                    <div
                      th:if="${user.googleId != null and user.password != null}"
                      class="flex flex-wrap gap-2"
                    >
                      <span
                        class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-50 text-blue-700 border border-blue-100"
                      >
                        <svg class="h-3.5 w-3.5 mr-1" viewBox="0 0 24 24">
                          <path
                            fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                          />
                          <path
                            fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                          />
                          <path
                            fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                          />
                          <path
                            fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                          />
                        </svg>
                        Google
                      </span>
                      <span
                        class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-700 border border-gray-200"
                      >
                        <svg
                          class="h-3.5 w-3.5 mr-1 text-gray-500"
                          fill="none"
                          stroke="currentColor"
                          viewBox="0 0 24 24"
                        >
                          <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"
                          />
                        </svg>
                        Password
                      </span>
                    </div>

                    <!-- Google only -->
                    <span
                      th:if="${user.googleId != null and user.password == null}"
                      class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-50 text-blue-700 border border-blue-100"
                    >
                      <svg class="h-3.5 w-3.5 mr-1" viewBox="0 0 24 24">
                        <path
                          fill="#4285F4"
                          d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                        />
                        <path
                          fill="#34A853"
                          d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                        />
                        <path
                          fill="#FBBC05"
                          d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                        />
                        <path
                          fill="#EA4335"
                          d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                        />
                      </svg>
                      Google only
                    </span>

                    <!-- Password only -->
                    <span
                      th:if="${user.googleId == null}"
                      class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-700 border border-gray-200"
                    >
                      <svg
                        class="h-3.5 w-3.5 mr-1 text-gray-500"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                      >
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                        />
                      </svg>
                      Email & Password
                    </span>
                  </dd>
                </div>
              </dl>
            </div>

            <!-- Roles -->
            <th:block th:if="${showRoles == true}">
              <div class="border-t border-gray-200"></div>
              <div class="pt-4 sm:pt-6">
                <h2 class="text-sm font-medium text-gray-700 mb-3">Roles</h2>
                <div class="flex flex-wrap gap-2">
                  <span
                    th:each="role : ${user.roles}"
                    th:text="${role.value}"
                    class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-indigo-50 text-indigo-700 border border-indigo-100"
                  ></span>
                </div>
              </div>
            </th:block>

            <!-- Divider -->
            <div class="border-t border-gray-200"></div>

            <!-- Action Buttons -->
            <div
              class="flex flex-col-reverse sm:flex-row sm:items-center sm:justify-between gap-3 pt-4 sm:pt-6"
            >
              <a
                th:href="@{/my-table}"
                class="inline-flex items-center justify-center px-5 py-2 rounded-lg border border-gray-300 text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 hover:border-gray-400 transition"
              >
                Cancel
              </a>
              <button
                type="submit"
                class="inline-flex items-center justify-center px-6 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium transition"
              >
                Save Changes
              </button>
            </div>
          </form>
        </div>
      </section>

    </div>
  </body>
</html>
