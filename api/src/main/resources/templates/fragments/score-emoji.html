<!-- Score Emoji Fragment -->
<!-- Usage: <span th:replace="~{fragments/score-emoji :: emoji(${score})}"></span> -->
<span
  th:fragment="emoji(score)"
  th:if="${score > 0}"
  th:text="${score >= 200 ? '🤯' :
            score >= 195 ? '🤩' :
            score >= 190 ? '🥳' :
            score >= 185 ? '😎' :
            score >= 180 ? '😁' :
            score >= 175 ? '😃' :
            score >= 170 ? '😊' :
            score >= 160 ? '🙂' :
            score >= 145 ? '😌' :
            score >= 130 ? '😬' : '😩'}"
>
</span>
