<!-- Score Emoji Fragment -->
<!-- Usage: <span th:replace="~{fragments/score-emoji :: emoji(${score})}"></span> -->
<span
  th:fragment="emoji(score)"
  th:if="${score > 0}"
  th:with="tier=${T(com.ligitabl.model.domain.ScoreTier).forScore(score)}"
  class="inline-flex items-center gap-0.5"
>
  <span th:text="${tier.emoji}"></span>
  <span
    th:if="${tier.group.name() == 'OUTSTANDING'}"
    class="text-xs font-bold text-purple-500"
    th:text="${tier.letter}"
  ></span>
  <span
    th:if="${tier.group.name() == 'STRONG'}"
    class="text-xs font-bold text-green-600"
    th:text="${tier.letter}"
  ></span>
  <span
    th:if="${tier.group.name() == 'FAIR'}"
    class="text-xs font-bold text-orange-500"
    th:text="${tier.letter}"
  ></span>
</span>
