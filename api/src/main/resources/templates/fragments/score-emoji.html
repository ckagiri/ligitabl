<!-- Score Emoji Fragment -->
<!-- Usage: <span th:replace="~{fragments/score-emoji :: emoji(${score})}"></span> -->
<span
  th:fragment="emoji(score)"
  th:if="${score > 0}"
  class="inline-flex items-center gap-0.5"
>
  <span
    th:text="${score >= 200 ? '🤯' :
            score >= 195 ? '🤩' :
            score >= 190 ? '🥳' :
            score >= 185 ? '😎' :
            score >= 180 ? '😁' :
            score >= 175 ? '😃' :
            score >= 170 ? '😊' :
            score >= 160 ? '🙂' :
            score >= 145 ? '😌' :
            score >= 130 ? '😬' : '😩'}"
  ></span>
  <span
    class="text-xs font-bold"
    th:class="${score >= 185 ? 'text-xs font-bold text-indigo-500' :
               score >= 160 ? 'text-xs font-bold text-green-600' :
                              'text-xs font-bold text-orange-500'}"
    th:text="${score >= 200 ? 'S' :
              score >= 195 ? 'A+' :
              score >= 190 ? 'A' :
              score >= 185 ? 'A-' :
              score >= 180 ? 'B+' :
              score >= 175 ? 'B' :
              score >= 170 ? 'B-' :
              score >= 160 ? 'C+' :
              score >= 145 ? 'C' :
              score >= 130 ? 'C-' : 'D'}"
  ></span>
</span>
