<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <!--
      One button, two shapes — inline (rounded-lg) and the floating pill (rounded-full shadow-lg),
      mirroring fragments/prediction-actions.html :: submit-button, down to the indigo palette and
      the spinner. Both render inside the finalTablePage scope, so they share
      saveEnabled()/inFlight and cannot disagree.

      The label is static: enablement carries the whole rule. The first save may be empty (that is
      how a player accepts the baseline); afterwards a clean table means there is nothing to save,
      so the button goes flat rather than earning a NothingToSave 400.
    -->
    <button
      th:fragment="save-button(shapeClasses)"
      type="button"
      @click="save()"
      :disabled="!saveEnabled()"
      :class="saveEnabled() ? 'bg-indigo-600 hover:bg-indigo-700 cursor-pointer' : 'bg-gray-300 cursor-not-allowed'"
      th:class="${'inline-flex items-center px-6 py-3 border border-transparent text-base font-medium text-white focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors ' + shapeClasses}"
    >
      <svg
        x-show="inFlight"
        x-cloak
        class="-ml-1 mr-2 h-5 w-5 animate-spin text-white"
        fill="none"
        viewBox="0 0 24 24"
      >
        <circle
          class="opacity-25"
          cx="12"
          cy="12"
          r="10"
          stroke="currentColor"
          stroke-width="4"
        ></circle>
        <path
          class="opacity-75"
          fill="currentColor"
          d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
        ></path>
      </svg>
      <span x-text="inFlight ? 'Saving…' : 'Save changes'">Save changes</span>
    </button>
  </body>
</html>
