<div
  th:fragment="card(cardClass, open)"
  th:if="${showShareSection == true}"
  th:class="${cardClass}"
  th:attr="data-open=${open}, data-share-text=${shareText}, data-share-url=${shareUrl}"
  x-data="{ open: $el.dataset.open === 'true', copiedText: false, copiedLink: false, shareText: '', shareUrl: '' }"
  x-init="shareText = $el.dataset.shareText; shareUrl = $el.dataset.shareUrl"
>
  <button
    type="button"
    @click="open = !open"
    class="w-full flex items-center justify-between px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-50 transition"
  >
    <span class="flex items-center gap-2">
      <svg class="h-4 w-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
      </svg>
      Share your prediction
    </span>
    <svg :class="open ? 'rotate-180' : ''" class="h-4 w-4 text-gray-400 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  <div x-show="open" x-cloak class="border-t border-gray-100 px-4 py-4 space-y-3 text-xs">
    <div>
      <p class="text-xs font-medium text-gray-500 mb-1.5">Share text</p>
      <div class="flex items-start gap-2 bg-gray-50 border border-gray-200 rounded-lg p-3">
        <pre
          class="font-mono text-gray-700 leading-snug flex-1 min-w-0 whitespace-pre-wrap break-words"
          x-text="shareText"
        ></pre>
        <button
          type="button"
          title="Copy share text"
          @click="navigator.clipboard.writeText(shareText); copiedText = true; setTimeout(() => copiedText = false, 2000)"
          class="shrink-0 p-1 rounded hover:bg-gray-200 transition text-gray-400 hover:text-gray-600"
        >
          <svg x-show="!copiedText" class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
          <svg x-show="copiedText" x-cloak class="h-3.5 w-3.5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
          </svg>
        </button>
      </div>
    </div>
    <div>
      <p class="text-xs font-medium text-gray-500 mb-1.5">Share link</p>
      <div class="flex items-center gap-2 bg-gray-50 border border-gray-200 rounded-lg px-3 py-2">
        <span
          class="font-mono text-gray-700 flex-1 min-w-0 truncate"
          x-text="shareUrl.replace(/^https?:\/\//, '')"
        ></span>
        <button
          type="button"
          title="Copy link"
          @click="navigator.clipboard.writeText(shareUrl); copiedLink = true; setTimeout(() => copiedLink = false, 2000)"
          class="shrink-0 p-1 rounded hover:bg-gray-200 transition text-gray-400 hover:text-gray-600"
        >
          <svg x-show="!copiedLink" class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
          </svg>
          <svg x-show="copiedLink" x-cloak class="h-3.5 w-3.5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
