<!-- In-App Browser Warning Banner Fragment -->
<!-- Parameters:
     inAppBrowser: Boolean - request User-Agent matches a known in-app/embedded browser
                   (Google blocks OAuth sign-in inside these with disallowed_useragent)
-->
<div
  xmlns:th="http://www.thymeleaf.org"
  th:fragment="banner(inAppBrowser)"
  th:if="${inAppBrowser}"
  class="bg-yellow-50 border border-yellow-200 rounded-lg p-4"
>
  <div class="flex items-start">
    <svg class="h-5 w-5 text-yellow-600 mt-0.5 mr-3 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
      <path fill-rule="evenodd"
        d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l6.28 11.18c.75 1.334-.213 2.987-1.742 2.987H3.72c-1.53 0-2.493-1.653-1.743-2.987l6.28-11.18zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z"
        clip-rule="evenodd" />
    </svg>
    <div>
      <p class="text-sm font-medium text-yellow-800">Google sign-in won't work here</p>
      <p class="text-sm text-yellow-700 mt-1">
        You're viewing this page inside another app's browser. Tap the
        <strong>&bull;&bull;&bull;</strong> or share menu and choose "Open in Safari" (or your
        default browser) to sign in with Google.
      </p>
    </div>
  </div>
</div>
