<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>

    <!--
      Renewal confirmation modal body. Caller supplies contestId/contestName and wraps this in
      its own `x-data="contestRenewal(...)"` scope (detail.html: single contest, opened via a
      window event; contest/index.html: one scope per list row, opened locally) — this fragment
      only needs `open`/`selectedTo`/etc. to already be in scope from that wrapper.
    -->
    <div
      th:fragment="modal(contestId, contestName)"
      x-show="open"
      x-cloak
      @click.stop="open = false"
      class="fixed inset-0 z-50 flex items-end sm:items-center sm:justify-center bg-black bg-opacity-40 px-2 pb-2 sm:p-4"
    >
      <div @click.stop class="w-full sm:max-w-md bg-white rounded-2xl shadow-xl max-h-[85vh] overflow-y-auto">
        <div class="sticky top-0 bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between z-10">
          <h2 class="text-base font-semibold text-gray-900">
            Renew — <span th:text="${contestName}">Contest</span>
          </h2>
          <button type="button" @click="open = false" class="p-1 hover:bg-gray-100 rounded">
            <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>

        <form method="post" th:action="@{/contests/{id}/renew(id=${contestId})}" class="p-4 space-y-4">
          <div>
            <p class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-2">Window</p>
            <div class="space-y-2">
              <div class="flex items-center justify-between bg-gray-50 border border-gray-200 rounded-lg px-3 py-2">
                <span class="text-sm text-gray-700">
                  From:
                  <span class="sm:hidden font-medium" x-text="fromSprint ? sprintAbbrev(fromSprint.name) + ' • ' + fromSprint.startDate : ''"></span>
                  <span class="hidden sm:inline font-medium" x-text="fromSprint ? fromSprint.name + ' • ' + fromSprint.startDate : ''"></span>
                </span>
                <span class="text-xs text-gray-400">🔒 fixed</span>
              </div>
              <div class="flex items-center justify-between gap-2 bg-white border border-gray-200 rounded-lg px-3 py-2">
                <span class="text-sm text-gray-700 shrink-0">To:</span>
                <select
                  name="toSprintCode"
                  x-model="selectedTo"
                  autocomplete="off"
                  class="text-sm font-medium border-0 focus:ring-0 focus:outline-none bg-indigo-50/50 rounded"
                >
                  <template x-for="option in toOptions" :key="option.code">
                    <option :value="option.code" :selected="option.code === selectedTo" x-text="toOptionLabel(option)"></option>
                  </template>
                </select>
              </div>
            </div>
          </div>

          <div class="bg-gray-50 rounded-lg border border-gray-200">
            <button
              type="button"
              @click="structureOpen = !structureOpen"
              class="w-full flex items-center justify-between px-4 py-2.5 text-xs font-medium text-gray-500 uppercase tracking-wide"
            >
              Competition structure
              <svg :class="structureOpen ? 'rotate-180' : ''" class="h-4 w-4 text-gray-400 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </button>
            <div x-show="structureOpen" x-cloak class="px-4 pb-4">
              <pre class="sm:hidden text-xs font-mono text-gray-700 whitespace-pre-wrap leading-relaxed" x-text="renderHierarchy(true)"></pre>
              <pre class="hidden sm:block text-xs font-mono text-gray-700 whitespace-pre-wrap leading-relaxed" x-text="renderHierarchy(false)"></pre>
            </div>
          </div>

          <p class="text-sm text-gray-600">
            Members carrying over: <span class="font-medium text-gray-900" x-text="activeMemberCount"></span>
          </p>
          <p class="text-sm text-gray-600" x-text="scoresResetLabel"></p>

          <div class="flex gap-3 pt-2">
            <button
              type="submit"
              :disabled="!selectedTo"
              class="flex-1 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-medium py-2.5 px-4 rounded-lg transition text-sm"
            >
              Confirm
            </button>
            <button type="button" @click="open = false"
                    class="px-4 py-2.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition">
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>

  </body>
</html>
