<!-- Minimal User Detail Modal -->
<div
  th:fragment="user-details"
  class="fixed inset-0 bg-gray-600 bg-opacity-50 z-50 flex items-start justify-center px-3 pt-16 pb-6 overflow-y-auto"
  @click.self="document.getElementById('user-detail-modal').innerHTML = ''"
>
  <div
    class="relative w-full max-w-2xl p-6 border shadow-lg rounded-xl bg-white"
  >
    <!-- Header: static across round navigation -->
    <div
      class="flex items-center justify-between pb-4 border-b border-gray-200"
    >
      <div>
        <h3
          class="text-xl font-bold text-gray-900"
          th:text="${user.displayName}"
        >
          Deejay Wagz
        </h3>
        <p class="text-sm text-gray-600 mt-1">
          Position
          <span class="font-semibold text-indigo-600"
            >#<span th:text="${user.position}">1</span></span
          >
          • Total:
          <span class="font-semibold" th:text="${user.totalScore}">1850</span>
          pts
        </p>
      </div>
      <button
        onclick="document.getElementById('user-detail-modal').innerHTML = ''"
        class="text-gray-400 hover:text-gray-600 text-xl font-bold transition"
      >
        ✕
      </button>
    </div>

    <!-- Prediction section: swapped on round navigation -->
    <div id="modal-prediction-content" class="relative mt-4" th:with="totalTeams=${#lists.size(user.currentPrediction)}, midpoint=${totalTeams / 2}, hasData=${totalTeams > 0}">

      <!-- Loading overlay: shown via hx-on::before-request, replaced by swap on completion -->
      <div id="round-nav-loading" class="hidden absolute inset-0 bg-white/80 items-center justify-center z-10 rounded">
        <span class="text-sm font-medium text-indigo-600">Loading...</span>
      </div>

      <!-- Hidden inputs carried through navigation -->
      <input type="hidden" class="modal-param" name="publicId" th:value="${user.publicId}">
      <input type="hidden" class="modal-param" name="displayName" th:value="${user.displayName}">
      <input type="hidden" class="modal-param" name="position" th:value="${user.position}">
      <input type="hidden" class="modal-param" name="totalScore" th:value="${user.totalScore}">
      <input type="hidden" class="modal-param" name="roundScore" th:value="${user.roundScore}">
      <input type="hidden" class="modal-param" name="phaseFrom" th:value="${minRound}">
      <input type="hidden" class="modal-param" name="maxRound" th:value="${maxRound}">
      <input type="hidden" class="modal-param" name="scored" th:value="${scored != null ? scored : true}">

      <!-- Round nav bar -->
      <div class="flex items-center justify-between mb-3">
        <div>
          <span class="text-base font-semibold text-gray-700">GW <span th:text="${round}">18</span></span>
          <!-- Mobile: compact -->
          <span th:if="${scored != false}" class="sm:hidden text-sm text-gray-500 ml-2">
            <span th:text="${user.roundScore}">42</span> pts
            <span th:replace="~{fragments/score-emoji :: emoji(${user.roundScore})}"></span>
            · <span th:text="${user.roundZeroes}">2</span> <span th:text="${user.roundZeroes == 1 ? 'Ø' : 'Øs'}">Øs</span>
          </span>
          <!-- Desktop: full -->
          <span th:if="${scored != false}" class="hidden sm:inline text-sm text-gray-500 ml-2">
            <span th:text="${user.roundScore}">42</span> pts
            <span th:replace="~{fragments/score-emoji :: emoji(${user.roundScore})}"></span>
            · <span th:text="${user.roundZeroes}">2</span>
            <span th:text="${user.roundZeroes == 1 ? 'zero' : 'zeroes'}">zeroes</span>
          </span>
        </div>
        <div class="flex items-center gap-2">
          <button
            hx-post="/leaderboard/user/modal"
            hx-target="#modal-prediction-content"
            hx-swap="outerHTML"
            hx-select="#modal-prediction-content"
            hx-include=".modal-param"
            hx-on:click="document.getElementById('round-nav-loading').classList.replace('hidden','flex')"
            th:attr="hx-vals='js:{effectiveToRound: ' + (${round} - 1) + '}'"
            th:disabled="${round <= minRound}"
            th:class="${round <= minRound} ? 'inline-flex items-center gap-1 px-1.5 py-0.5 rounded border border-gray-300 text-sm text-gray-300 cursor-not-allowed' : 'inline-flex items-center gap-1 px-1.5 py-0.5 rounded border border-indigo-600 text-sm text-indigo-600 hover:bg-indigo-50 transition'"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
            </svg>
            <span class="hidden sm:inline">Prev</span>
          </button>
          <button
            hx-post="/leaderboard/user/modal"
            hx-target="#modal-prediction-content"
            hx-swap="outerHTML"
            hx-select="#modal-prediction-content"
            hx-include=".modal-param"
            hx-on:click="document.getElementById('round-nav-loading').classList.replace('hidden','flex')"
            th:attr="hx-vals='js:{effectiveToRound: ' + (${round} + 1) + '}'"
            th:disabled="${round >= maxRound}"
            th:class="${round >= maxRound} ? 'inline-flex items-center gap-1 px-1.5 py-0.5 rounded border border-gray-300 text-sm text-gray-300 cursor-not-allowed' : 'inline-flex items-center gap-1 px-1.5 py-0.5 rounded border border-indigo-600 text-sm text-indigo-600 hover:bg-indigo-50 transition'"
          >
            <span class="hidden sm:inline">Next</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
            </svg>
          </button>
        </div>
      </div>

      <p th:if="${scored == false or !hasData}" class="text-sm text-gray-400 text-center py-4">No predictions for this round</p>
      <div th:if="${scored != false and hasData}" class="grid grid-cols-2 gap-x-4">
        <!-- First column: first half -->
        <div class="space-y-2">
          <div class="flex items-center" th:each="pred, iter : ${user.currentPrediction}" th:if="${iter.index < midpoint}">
            <span
              class="text-sm text-gray-500 font-medium shrink-0"
              th:text="${iter.index + 1} + '.'"
              >1.</span
            >
            <span class="text-sm text-gray-900 ml-2 min-w-0 truncate" th:text="${pred.teamName}">Chelsea</span>
            <span
              th:if="${pred.hit != null}"
              class="text-sm ml-1 shrink-0"
              th:classappend="${pred.hit == 0} ? 'text-green-600 font-bold' : (${pred.hit <= 2} ? 'text-yellow-600' : 'text-red-600')"
              ><span th:text="${-pred.hit}">-3</span></span
            >
          </div>
        </div>
        <!-- Second column: second half -->
        <div class="space-y-2">
          <div class="flex items-center" th:each="pred, iter : ${user.currentPrediction}" th:if="${iter.index >= midpoint}">
            <span
              class="text-sm text-gray-500 font-medium shrink-0"
              th:text="${iter.index + 1} + '.'"
              >11.</span
            >
            <span class="text-sm text-gray-900 ml-2 min-w-0 truncate" th:text="${pred.teamName}">Arsenal</span>
            <span
              th:if="${pred.hit != null}"
              class="text-sm ml-1 shrink-0"
              th:classappend="${pred.hit == 0} ? 'text-green-600 font-bold' : (${pred.hit <= 2} ? 'text-yellow-600' : 'text-red-600')"
              ><span th:text="${-pred.hit}">-3</span></span
            >
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
