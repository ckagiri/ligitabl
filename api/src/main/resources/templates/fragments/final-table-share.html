<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <!--
      Share controls, mounted separately from finalTablePage so the read-only public view can carry
      them without the editing component.

      Same shape as fragments/share-prediction.html on the main prediction page: the share text is
      visible and copyable rather than hidden behind a native share sheet that not every browser
      offers. Copy icons over labelled buttons, for the same reason — it is the pattern the app
      already uses.

      Two deliberate departures from that fragment, both because the card is this game's point
      rather than an afterthought: it opens expanded, and the image leads. Text and link follow as
      the fallbacks for the places an image won't go.
    -->
    <div
      th:fragment="card"
      th:if="${shareUrl != null}"
      x-data="Ligitabl.finalTableShareCard($el)"
      @final-table-saved.window="open = true"
      th:attr="data-rows=${shareRowsJson},data-zones=${zonesJson},data-share-url=${shareUrl},data-share-text=${shareText},data-title=${shareCardTitle},data-subtitle=${shareCardSubtitle},data-kicker=${shareCardKicker},data-competition-name=${competitionName},data-settled-at=${settledAt}"
      class="mb-6 overflow-hidden rounded-lg bg-white shadow-sm"
    >
      <button
        type="button"
        @click="open = !open"
        class="flex w-full items-center justify-between px-4 py-3 text-sm font-medium text-gray-700 transition hover:bg-gray-50"
      >
        <span class="flex items-center gap-2">
          <svg class="h-4 w-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
          </svg>
          <!--
            "Share your table" on the owner's page; the public view passes its own wording, since a
            visitor is looking at someone else's table and the possessive would be wrong.
          -->
          <span th:text="${shareCardHeading != null ? shareCardHeading : 'Share your table'}"
            >Share your table</span
          >
        </span>
        <svg :class="open ? 'rotate-180' : ''" class="h-4 w-4 text-gray-400 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <div x-show="open" x-cloak class="space-y-3 border-t border-gray-100 px-4 py-4 text-xs">
        <div
          th:if="${shareCardHeading == null}"
          x-show="getDirtyCount() > 0"
          x-cloak
          class="flex items-start gap-2 rounded-lg border border-amber-200 bg-amber-50 p-3 text-amber-900"
        >
          <svg class="mt-0.5 h-3.5 w-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 9v2m0 4h.01M5.07 19h13.86a2 2 0 001.71-3.03L13.71 4.03a2 2 0 00-3.42 0L3.36 15.97A2 2 0 005.07 19z" />
          </svg>
          <span>
            Showing your last saved table. Save to share the
            <span x-text="getDirtyCount()">2</span>
            <span x-text="getDirtyCount() === 1 ? 'move' : 'moves'">moves</span>
            you just made.
          </span>
        </div>

        <!-- Image first: the card is the thing people actually share, and the text and link below
             are the fallbacks for where an image won't go. -->
        <div>
          <p class="mb-1.5 text-xs font-medium text-gray-500">Image</p>
          <div class="flex flex-wrap gap-2">
            <button
              type="button"
              @click="downloadCard()"
              :disabled="rendering"
              class="inline-flex items-center gap-1.5 rounded-lg border border-gray-300 bg-white px-3 py-2 text-xs font-medium text-gray-700 transition hover:bg-gray-50 disabled:opacity-50"
            >
              <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" />
              </svg>
              <span x-text="rendering ? 'Rendering…' : 'Download image'">Download image</span>
            </button>
            <!-- Native share sheet, only where the browser actually supports sharing files. -->
            <button
              type="button"
              x-show="canShareFiles"
              x-cloak
              @click="shareCard()"
              class="inline-flex items-center gap-1.5 rounded-lg border border-gray-300 bg-white px-3 py-2 text-xs font-medium text-gray-700 transition hover:bg-gray-50"
            >
              <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.7 10.7a4 4 0 100 2.6m0-2.6l6.6-3.4m-6.6 6l6.6 3.4M18 8a2.5 2.5 0 100-5 2.5 2.5 0 000 5zm0 13a2.5 2.5 0 100-5 2.5 2.5 0 000 5z" />
              </svg>
              Share image
            </button>
          </div>
        </div>

        <div th:if="${shareText != null}">
          <p class="mb-1.5 text-xs font-medium text-gray-500">Share text</p>
          <div class="flex items-start gap-2 rounded-lg border border-gray-200 bg-gray-50 p-3">
            <pre
              class="min-w-0 flex-1 whitespace-pre-wrap break-words font-mono leading-snug text-gray-700"
              x-text="shareText()"
            ></pre>
            <button
              type="button"
              title="Copy share text"
              @click="copyText()"
              class="shrink-0 rounded p-1 text-gray-400 transition hover:bg-gray-200 hover:text-gray-600"
            >
              <svg x-show="!copiedText" class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
              </svg>
              <svg x-show="copiedText" x-cloak class="h-3.5 w-3.5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
              </svg>
            </button>
          </div>
        </div>

        <div>
          <p class="mb-1.5 text-xs font-medium text-gray-500">Share link</p>
          <div class="flex items-center gap-2 rounded-lg border border-gray-200 bg-gray-50 px-3 py-2">
            <span class="min-w-0 flex-1 truncate font-mono text-gray-700" x-text="displayUrl()"></span>
            <button
              type="button"
              title="Copy link"
              @click="copyLink()"
              class="shrink-0 rounded p-1 text-gray-400 transition hover:bg-gray-200 hover:text-gray-600"
            >
              <svg x-show="!copiedLink" class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
              </svg>
              <svg x-show="copiedLink" x-cloak class="h-3.5 w-3.5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
              </svg>
            </button>
          </div>
        </div>

      </div>
    </div>
  </body>
</html>
