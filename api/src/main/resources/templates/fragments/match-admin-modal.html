<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>

    <!-- Renders nothing: used after a successful action to clear the modal container -->
    <th:block th:fragment="done"></th:block>

    <!-- Inline error: replaces modal content on server-side errors -->
    <div
      th:fragment="error-message"
      class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50"
      onclick="document.getElementById('match-admin-modal').innerHTML = ''"
    >
      <div class="relative top-20 mx-auto p-6 border w-11/12 max-w-md shadow-lg rounded-lg bg-white">
        <div class="flex items-center justify-between pb-3 border-b border-gray-200">
          <h3 class="text-sm font-bold text-red-700">Error</h3>
          <button
            onclick="document.getElementById('match-admin-modal').innerHTML = ''"
            class="text-gray-400 hover:text-gray-600 text-xl font-bold transition"
          >✕</button>
        </div>
        <p class="mt-4 text-sm text-red-600" th:text="${error}">Something went wrong.</p>
      </div>
    </div>

    <!-- Main admin modal -->
    <div
      th:fragment="modal"
      x-data="{ selectedStatus: '', origDate: '', origTime: '', kickOffDate: '', kickOffTime: '' }"
      x-init="
        const utc = $el.dataset.kickOffUtc;
        if (utc) {
          const d = new Date(utc);
          const pad = n => String(n).padStart(2, '0');
          origDate = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
          origTime = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
          kickOffDate = origDate;
          kickOffTime = origTime;
        }
      "
      th:attr="data-kick-off-utc=${currentKickOffUtc ?: ''}"
      class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50"
      @click.self="document.getElementById('match-admin-modal').innerHTML = ''"
    >
      <div class="relative top-20 mx-auto p-6 border w-11/12 max-w-md shadow-lg rounded-lg bg-white">

        <!-- Header -->
        <div class="flex items-center justify-between pb-4 border-b border-gray-200">
          <div>
            <h3 class="text-base font-bold text-gray-900" th:text="${matchLabel}">Chelsea · Arsenal</h3>
            <p class="text-xs text-gray-500 mt-0.5">
              GW <span th:text="${round}">29</span>
              <th:block th:if="${matchday != null and matchday != round}">
                &nbsp;·&nbsp;MD <span th:text="${matchday}">28</span>
              </th:block>
              &nbsp;·&nbsp;
              <span class="font-medium" th:text="${currentStatus}">POSTPONED</span>
            </p>
          </div>
          <button
            onclick="document.getElementById('match-admin-modal').innerHTML = ''"
            class="text-gray-400 hover:text-gray-600 text-xl font-bold transition"
          >✕</button>
        </div>

        <!-- Change Status -->
        <th:block th:if="${not #lists.isEmpty(validTransitions)}">
          <div class="mt-4">
            <h4 class="text-sm font-semibold text-gray-700 mb-2">Change Status</h4>
            <form
              th:attr="hx-post=@{/matches/{slug}/transition(slug=${matchSlug})}"
              hx-target="#match-admin-modal"
              hx-swap="innerHTML"
            >
              <input type="hidden" name="round" th:value="${round}">

              <select
                name="newStatus"
                @change="selectedStatus = $event.target.value"
                class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
              >
                <option value="">— Select status —</option>
                <option
                  th:each="s : ${validTransitions}"
                  th:value="${s}"
                  th:text="${s}"
                >SCHEDULED</option>
              </select>

              <!-- Score inputs: only visible when FINISHED is selected -->
              <div x-show="selectedStatus === 'FINISHED'" class="flex gap-3 mt-3" x-cloak>
                <div class="flex-1">
                  <label class="block text-xs text-gray-500 mb-1">Home</label>
                  <input
                    type="number"
                    name="homeGoals"
                    min="0"
                    step="1"
                    :required="selectedStatus === 'FINISHED'"
                    class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  >
                </div>
                <div class="flex-1">
                  <label class="block text-xs text-gray-500 mb-1">Away</label>
                  <input
                    type="number"
                    name="awayGoals"
                    min="0"
                    step="1"
                    :required="selectedStatus === 'FINISHED'"
                    class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  >
                </div>
              </div>

              <div class="flex justify-end mt-3">
                <button
                  type="submit"
                  :disabled="selectedStatus === ''"
                  :class="selectedStatus === '' ? 'px-4 py-2 text-sm font-medium text-gray-400 bg-gray-100 rounded-lg cursor-not-allowed' : 'px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors'"
                >Apply</button>
              </div>
            </form>
          </div>
        </th:block>

        <!-- Divider between sections when both are visible -->
        <div
          th:if="${canReschedule and not #lists.isEmpty(validTransitions)}"
          x-show="selectedStatus === ''"
          class="border-t border-gray-200 my-4"
        ></div>

        <!-- Move to Round: only shown when no status transition is selected -->
        <th:block th:if="${canReschedule}">
          <div class="mt-4" x-data="{ selectedRound: '' }" x-show="selectedStatus === ''">
            <h4 class="text-sm font-semibold text-gray-700 mb-2">Move to Round</h4>
            <form
              th:attr="hx-post=@{/matches/{slug}/move(slug=${matchSlug})}"
              hx-target="#match-admin-modal"
              hx-swap="innerHTML"
            >
              <input type="hidden" name="round" th:value="${round}">

              <select
                name="newRoundPosition"
                @change="selectedRound = $event.target.value"
                class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
              >
                <option value="">— Select round —</option>
                <option
                  th:each="r : ${availableRounds}"
                  th:value="${r.position()}"
                  th:text="${r.label()}"
                >GW 30</option>
              </select>

              <div class="flex justify-end mt-3">
                <button
                  type="submit"
                  :disabled="selectedRound === ''"
                  :class="selectedRound === '' ? 'px-4 py-2 text-sm font-medium text-gray-400 bg-gray-100 rounded-lg cursor-not-allowed' : 'px-4 py-2 text-sm font-medium text-white bg-amber-600 hover:bg-amber-700 rounded-lg transition-colors'"
                >Move</button>
              </div>
            </form>
          </div>
        </th:block>

        <!-- Edit Kickoff -->
        <th:block th:if="${canEditKickoff}">
          <div class="border-t border-gray-200 my-4"></div>
          <div>
            <h4 class="text-sm font-semibold text-gray-700 mb-2">Edit Kickoff <span class="text-xs font-normal text-gray-400">(GMT)</span></h4>
            <form
              th:attr="hx-post=@{/matches/{slug}/update-kickoff(slug=${matchSlug})}"
              hx-target="#match-admin-modal"
              hx-swap="innerHTML"
            >
              <input type="hidden" name="round" th:value="${round}">
              <input type="hidden" name="utcOffset" :value="new Date().getTimezoneOffset()">
              <div class="flex gap-3">
                <input
                  type="date"
                  name="kickOffDate"
                  x-model="kickOffDate"
                  th:value="${currentKickOffDate}"
                  required
                  class="flex-1 border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >
                <input
                  type="time"
                  name="kickOffTime"
                  x-model="kickOffTime"
                  th:value="${currentKickOffTime}"
                  step="60"
                  required
                  class="w-32 border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >
              </div>
              <div class="flex justify-end mt-3">
                <button
                  type="submit"
                  :disabled="kickOffDate === origDate && kickOffTime === origTime"
                  :class="(kickOffDate === origDate && kickOffTime === origTime)
                    ? 'px-4 py-2 text-sm font-medium text-gray-400 bg-gray-100 rounded-lg cursor-not-allowed'
                    : 'px-4 py-2 text-sm font-medium text-white bg-gray-700 hover:bg-gray-800 rounded-lg transition-colors'"
                >Save Kickoff</button>
              </div>
            </form>
          </div>
        </th:block>

      </div>
    </div>

  </body>
</html>
