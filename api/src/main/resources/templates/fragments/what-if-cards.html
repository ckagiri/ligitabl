<div th:fragment="standings-card" class="bg-gray-50 rounded-lg p-4">
  <h3
    class="text-sm font-semibold text-gray-700 mb-3"
    x-text="hasComputed ? 'Projected Standings' : 'Current Standings'"
  ></h3>
  <table class="w-full text-sm">
    <thead>
      <tr class="text-xs text-gray-400 text-left">
        <th class="pb-2 font-medium w-8">#</th>
        <th class="pb-2 font-medium">Team</th>
        <th class="pb-2 font-medium text-right">Pts</th>
        <th class="pb-2 font-medium text-right">GD</th>
      </tr>
    </thead>
    <tbody>
      <template x-for="row in standingsRows()" :key="row.teamCode">
        <tr class="border-t border-gray-100">
          <td class="py-1.5 text-gray-500" x-text="row.position"></td>
          <td class="py-1.5 font-medium text-gray-900" x-text="row.teamShortName"></td>
          <td class="py-1.5 text-right text-gray-700" x-text="row.points"></td>
          <td
            class="py-1.5 text-right text-gray-700"
            x-text="row.gd > 0 ? '+' + row.gd : row.gd"
          ></td>
        </tr>
      </template>
    </tbody>
  </table>
</div>

<div th:fragment="round-result-card" class="bg-gray-50 rounded-lg p-4">
  <h3 class="text-sm font-semibold text-gray-700 mb-3">
    Round Result<span
      x-show="getDirtyCount() > 0"
      class="text-indigo-500"
      >*</span
    >
  </h3>
  <template x-if="!hasComputed">
    <p class="text-sm text-gray-500 py-6 text-center">
      Enter all hypothetical scores above, then hit Apply to see your
      projected result.
    </p>
  </template>
  <template x-if="hasComputed">
    <div>
      <table class="w-full text-sm">
        <thead>
          <tr class="text-xs text-gray-400 text-left">
            <th class="pb-2 font-medium w-8">Pred</th>
            <th class="pb-2 font-medium">Team</th>
            <th class="pb-2 font-medium text-right">Actual</th>
            <th class="pb-2 font-medium text-right">Hit</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="team in teams" :key="team.code">
            <!-- Interactive only while the round is open: teamClick() ignores the click once it
                 locks, so the pointer/hover affordances have to go too or the row would still
                 look tappable. -->
            <tr
              class="prediction-row no-hover border-t border-gray-100"
              :class="roundOpen ? 'cursor-pointer hover:bg-gray-100' : ''"
              :data-team-code="team.code"
              @click="teamClick(team.code)"
            >
              <td class="py-1.5 text-gray-500" x-text="team.position"></td>
              <!-- Selection reads as a dot beside the name, same as the my-table row: washing the
                   whole row in colour fights the amber .swapping highlight the swap animation
                   applies to that same row moments later. -->
              <td class="py-1.5 font-medium text-gray-900">
                <span class="inline-flex items-center gap-1">
                  <span
                    x-show="isSelected(team.code)"
                    class="text-blue-600 text-xs font-medium flex-shrink-0"
                    >●</span
                  >
                  <span class="sm:hidden" x-text="team.shorterName || team.name"></span
                  ><span class="hidden sm:inline" x-text="team.shortName || team.name"></span>
                </span>
              </td>
              <td
                class="py-1.5 text-right text-gray-700"
                x-text="getActualPosition(team.code)"
              ></td>
              <td class="py-1.5 text-right font-medium">
                <div class="flex items-center justify-end gap-1">
                  <svg
                    x-show="getDelta(team.code) !== 0 && getDelta(team.code) !== '-'"
                    class="h-3.5 w-3.5"
                    :class="getDeltaDirection(team.code) === 'down' ? 'text-red-600' : 'text-green-600'"
                    fill="currentColor"
                    viewBox="0 0 20 20"
                  >
                    <path
                      x-show="getDeltaDirection(team.code) === 'up'"
                      fill-rule="evenodd"
                      d="M14.707 12.707a1 1 0 01-1.414 0L10 9.414l-3.293 3.293a1 1 0 01-1.414-1.414l4-4a1 1 0 011.414 0l4 4a1 1 0 010 1.414z"
                      clip-rule="evenodd"
                    />
                    <path
                      x-show="getDeltaDirection(team.code) === 'down'"
                      fill-rule="evenodd"
                      d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                      clip-rule="evenodd"
                    />
                  </svg>
                  <span
                    :class="getDelta(team.code) === 0 ? 'text-green-600' : (getDeltaDirection(team.code) === 'down' ? 'text-red-600' : 'text-green-600')"
                    x-text="getDelta(team.code)"
                  ></span>
                </div>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </template>
</div>
