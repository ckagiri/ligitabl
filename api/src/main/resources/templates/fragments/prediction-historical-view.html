<!-- Historical Rounds View Fragment -->
<!-- Parameters:
     hasRoundResult: Boolean - whether the round has been scored
     roundResultRankings: List of RoundResultRanking objects (for scored rounds)
     predictions: List of Prediction objects (fallback for unscored rounds)
     totalHits: Integer - total position errors
     totalScore: Integer - final score
     zeroesCount: Integer - number of perfect predictions
-->
<div th:fragment="historical-view(hasRoundResult, roundResultRankings, predictions, totalHits, totalScore, zeroesCount, seasonBestScore, sprintBestScore, sprintLabel)">
  <!-- Historical Rounds: Static Table -->
  <div class="px-6 py-4">
    <div class="overflow-x-auto sm:overflow-hidden">
      <table class="min-w-full table-fixed">
        <thead class="bg-gray-50">
          <!-- Header for historical round with scored results -->
          <tr th:if="${hasRoundResult}">
            <th
              scope="col"
              class="sticky left-0 z-20 bg-gray-50 border-r border-gray-200 px-2 sm:static sm:left-auto sm:z-auto sm:bg-gray-50 sm:border-r-0 sm:px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-12 sm:w-16"
            >
              Pred
            </th>
            <th
              scope="col"
              class="px-2 sm:px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
            >
              Team
            </th>
            <th
              scope="col"
              class="px-2 sm:px-3 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider w-14 sm:w-16"
            >
              Actual
            </th>
            <th
              scope="col"
              class="px-2 sm:px-3 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider w-12 sm:w-14"
            >
              Hit
            </th>
          </tr>
          <!-- Header for historical round without results (fallback) -->
          <tr th:if="${!hasRoundResult}">
            <th
              scope="col"
              class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-16"
            >
              Pos
            </th>
            <th
              scope="col"
              class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
            >
              Team
            </th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          <!-- Static rows for historical view with RoundResult data -->
          <tr
            th:if="${hasRoundResult}"
            th:each="rank : ${roundResultRankings}"
            class="hover:bg-gray-50 group"
          >
            <td class="sticky left-0 z-10 bg-white border-r border-gray-200 group-hover:bg-gray-50 px-2 sm:static sm:left-auto sm:z-auto sm:bg-transparent sm:border-r-0 sm:group-hover:bg-transparent sm:px-3 py-3 sm:py-4 whitespace-nowrap">
              <span
                class="text-xs sm:text-sm font-bold text-gray-900"
                th:text="${rank.predictedPosition}"
                >1</span
              >
            </td>
            <td class="px-2 sm:px-3 py-3 sm:py-4 whitespace-nowrap">
              <div class="flex items-center">
                <div
                  class="hidden sm:flex h-6 w-6 sm:h-8 sm:w-8 mr-2 sm:mr-3 bg-gray-200 rounded items-center justify-center text-xs font-bold flex-shrink-0"
                  th:text="${rank.teamCode}"
                >
                  MCI
                </div>
                <div
                  class="text-xs sm:text-sm font-medium text-gray-900 truncate"
                  th:text="${rank.teamName}"
                >
                  Manchester City
                </div>
              </div>
            </td>
            <td
              class="px-2 sm:px-3 py-3 sm:py-4 whitespace-nowrap text-center"
            >
              <span
                class="text-xs sm:text-sm text-gray-500"
                th:text="${rank.standingsPosition}"
                >2</span
              >
            </td>
            <td
              class="px-2 sm:px-3 py-3 sm:py-4 whitespace-nowrap text-center"
            >
              <span
                th:classappend="${rank.hit == 0} ? 'text-green-600 font-bold' : (${rank.hit <= 2} ? 'text-yellow-600' : 'text-red-600')"
                class="text-xs sm:text-sm font-semibold"
                th:text="${rank.hit}"
                >0</span
              >
            </td>
          </tr>

          <!-- Fallback static rows for historical/readonly without RoundResult -->
          <tr
            th:if="${!hasRoundResult}"
            th:each="pred : ${predictions}"
            class="hover:bg-gray-50 group"
          >
            <td class="sticky left-0 z-10 bg-white border-r border-gray-200 group-hover:bg-gray-50 px-2 sm:static sm:left-auto sm:z-auto sm:bg-transparent sm:border-r-0 sm:group-hover:bg-transparent sm:px-3 py-3 sm:py-4 whitespace-nowrap">
              <span
                class="text-xs sm:text-sm font-bold text-gray-900"
                th:text="${pred.position}"
                >1</span
              >
            </td>
            <td class="px-2 sm:px-3 py-3 sm:py-4 whitespace-nowrap">
              <div class="flex items-center">
                <div
                  class="hidden sm:flex h-6 w-6 sm:h-8 sm:w-8 mr-2 sm:mr-3 bg-gray-200 rounded items-center justify-center text-xs font-bold flex-shrink-0"
                  th:text="${pred.teamCode}"
                >
                  MCI
                </div>
                <div
                  class="text-xs sm:text-sm font-medium text-gray-900 truncate"
                  th:text="${pred.teamName}"
                >
                  Manchester City
                </div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Score Summary for Historical Rounds -->
  <div
    th:if="${hasRoundResult}"
    class="mt-4 text-center pb-4"
  >
    <div
      class="inline-flex flex-col items-center px-6 py-3 bg-gray-50 rounded-lg border border-gray-200"
    >
      <div class="flex items-center text-sm text-gray-600 mb-1">
        <span class="font-mono">200</span>
        <span class="mx-2">−</span>
        <span class="font-mono" th:text="${totalHits}">44</span>
        <span class="mx-2">=</span>
        <span
          class="font-mono font-bold text-gray-900"
          th:text="${totalScore}"
          >156</span
        >
        <span class="ml-1">points</span>
        <span class="ml-1">
          <span th:replace="~{fragments/score-emoji :: emoji(${totalScore})}">
          </span>
      </div>

      <div class="text-xs text-green-600 font-semibold">
        🎯 <span th:text="${zeroesCount}">5</span> perfect predictions!
      </div>

      <div class="text-xs text-gray-500">
        (Max: 200, Lost: <span th:text="${totalHits}">156</span>)
      </div>

      <div th:if="${seasonBestScore != null}" class="mt-2 flex gap-2 flex-wrap justify-center">
        <span class="inline-flex items-center gap-1 px-2 py-1 bg-indigo-50 text-indigo-700 rounded text-xs font-medium">
          🏆 Season best: <span th:text="${seasonBestScore}">195</span>
        </span>
        <span th:if="${sprintBestScore != null}" class="inline-flex items-center gap-1 px-2 py-1 bg-purple-50 text-purple-700 rounded text-xs font-medium">
          ⚡ <span th:text="${sprintLabel}">Sprint 5</span> best: <span th:text="${sprintBestScore}">178</span>
        </span>
      </div>
    </div>
  </div>
</div>
