<!-- Results Banner Fragment -->
<!-- Fragment for /my-table (formerly /predictions/user/me) -->
<div th:fragment="results-banner-user(result)" th:if="${result != null}">
  <div
    th:replace="~{fragments/results-banner :: results-banner-base(result=${result}, baseUrl=${predictionsNavLink} ?: '/my-table')}"
  ></div>
</div>

<!-- Base fragment with configurable URL -->
<div
  th:fragment="results-banner-base(result, baseUrl)"
  th:if="${result != null}"
>
  <div
    class="bg-gradient-to-r from-green-50 to-blue-50 border-2 border-green-200 rounded-lg p-5 shadow-sm mb-6"
    th:attr="data-result-round=${result.round}"
  >
    <!-- Header -->
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center">
        <span class="text-2xl mr-2">🎉</span>
        <h3 class="text-lg font-bold text-gray-900">
          Gameweek <span th:text="${result.round}">18</span> Results Available!
        </h3>
      </div>
      <button
        type="button"
        data-dismiss-results-banner="true"
        class="text-gray-400 hover:text-gray-600 transition text-xl font-bold"
      >
        ✕
      </button>
    </div>

    <!-- Score & Position -->
    <div class="mb-4">
      <p class="text-base text-gray-700">
        You scored
        <span class="font-bold text-indigo-600" th:text="${result.score}"
          >156</span
        >
        points
        <span
          th:replace="~{fragments/score-emoji :: emoji(${result.score})}"
        ></span>
      </p>
      <th:block th:if="${result.sprintBest > 0}">
        <p class="text-xs text-gray-400 mt-2 font-medium">
          <span th:text="${result.sprint}">S3</span> · GW <span th:text="${result.sprintFrom}">28</span>–<span th:text="${result.sprintTo}">30</span>
        </p>
        <p th:if="${result.round == result.sprintFrom}" class="text-sm mt-0.5 text-gray-500">
          🏁 Your sprint best: <span class="font-semibold" th:text="${result.sprintBest}">180</span> pts
        </p>
        <p th:if="${result.isNewSprintBest}" class="text-sm mt-0.5 text-amber-600 font-semibold">
          🎉 New sprint best — <span th:text="${result.sprintBest}">180</span> pts!
        </p>
        <p th:if="${result.round != result.sprintFrom && !result.isNewSprintBest}" class="text-sm mt-0.5 text-gray-400">
          📉 Your sprint best: <span class="font-semibold" th:text="${result.sprintBest}">180</span> pts
        </p>
        <p th:if="${result.movement != null && result.movement != 0}" class="text-sm mt-0.5">
          <span th:if="${result.movement > 0}" class="text-green-600 font-semibold">
            ↑ <span th:text="${result.movement}">3</span> <span th:text="${result.movement == 1 ? 'place' : 'places'}">places</span>
          </span>
          <span th:if="${result.movement < 0}" class="text-red-600 font-semibold">
            ↓ <span th:text="${T(java.lang.Math).abs(result.movement)}">2</span> <span th:text="${T(java.lang.Math).abs(result.movement) == 1 ? 'place' : 'places'}">places</span>
          </span>
          <span class="text-gray-400">in <span th:text="${result.sprint}">S3</span></span>
        </p>
      </th:block>
    </div>

    <!-- Distribution (2x2) -->
    <div class="grid grid-cols-2 gap-2 mb-4">
      <!-- Perfect — no change needed -->
      <div class="flex items-center gap-1.5 text-sm text-gray-700">
        <span class="text-2xl">🎯</span>
        <span
          class="font-bold text-green-600 text-lg"
          th:text="${result.hitDistribution.perfect}"
          >5</span
        >
        <span class="font-semibold">perfect!</span>
      </div>

      <!-- Close calls -->
      <div class="flex items-center gap-1.5 text-sm text-gray-700">
        <span class="text-lg">🤏</span>
        <span
          class="font-semibold"
          th:text="${result.hitDistribution.closeCalls}"
          >8</span
        >
        <span class="flex flex-col sm:flex-row sm:gap-1">
          <span
            th:text="${result.hitDistribution.closeCalls == 1 ? 'close call' : 'close calls'}"
            >close calls</span
          >
          <span class="text-gray-400">(±1-2)</span>
        </span>
      </div>

      <!-- Near misses -->
      <div class="flex items-center gap-1.5 text-sm text-gray-700">
        <span class="text-lg">🤷</span>
        <span
          class="font-semibold"
          th:text="${result.hitDistribution.nearMisses}"
          >5</span
        >
        <span class="flex flex-col sm:flex-row sm:gap-1">
          <span
            th:text="${result.hitDistribution.nearMisses == 1 ? 'near miss' : 'near misses'}"
            >near misses</span
          >
          <span class="text-gray-400">(±3-4)</span>
        </span>
      </div>

      <!-- Big misses -->
      <div class="flex items-center gap-1.5 text-sm text-gray-700">
        <span class="text-lg">😅</span>
        <span
          class="font-semibold"
          th:text="${result.hitDistribution.bigMisses}"
          >2</span
        >
        <span class="flex flex-col sm:flex-row sm:gap-1">
          <span
            th:text="${result.hitDistribution.bigMisses == 1 ? 'big miss' : 'big misses'}"
            >big misses</span
          >
          <span class="text-gray-400">(±5+)</span>
        </span>
      </div>
    </div>

    <!-- Action Button (not shown once the season's last round is current — nothing further to view) -->
    <div th:if="${result.currentRound != result.lastRound}" class="flex justify-center">
      <a
        th:href="@{${baseUrl}(round=${result.round})}"
        th:attr="hx-get=@{${baseUrl}(round=${result.round})}"
        hx-target="#prediction-page"
        hx-swap="outerHTML swap:100ms settle:100ms show:window:top"
        hx-push-url="true"
        data-dismiss-results-banner="true"
        class="inline-flex items-center px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-md hover:bg-indigo-700 transition"
      >
        View Detailed Results →
      </a>
    </div>
  </div>
</div>
