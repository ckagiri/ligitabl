<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <div th:fragment="banner">
      <th:block th:if="${isImpersonating == true}">
        <div
          class="fixed bottom-0 inset-x-0 z-50 bg-amber-100 border-t border-amber-300 px-4 py-2"
        >
          <div class="max-w-7xl mx-auto flex items-center justify-between gap-3 text-sm text-amber-900">
            <span>
              ⚠️ Impersonating
              <strong th:text="${effectiveUserEmail}">player@example.com</strong>
              <!-- Hidden on mobile: two emails plus the stop button overflow the narrow banner. -->
              <span class="hidden sm:inline"
                >(you are <span th:text="${originalUserEmail}">admin@example.com</span>)</span
              >
            </span>
            <form hx-post="/admin/impersonation/stop" hx-swap="none">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <!-- Like starting, stopping answers with HX-Redirect; the spinner rides through it. -->
              <button
                type="submit"
                hx-disabled-elt="this"
                class="inline-flex items-center gap-1.5 whitespace-nowrap px-3 py-1 text-sm font-medium bg-amber-200 border border-amber-400 rounded hover:bg-amber-300 disabled:opacity-50"
              >
                <svg
                  class="htmx-indicator animate-spin h-3.5 w-3.5"
                  fill="none"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
                Stop impersonating
              </button>
            </form>
          </div>
        </div>
      </th:block>
    </div>
  </body>
</html>
