<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <div th:fragment="banner">
      <th:block th:if="${isImpersonating == true}">
        <div
          class="fixed bottom-0 inset-x-0 z-50 bg-amber-100 border-t border-amber-300 px-4 py-2"
        >
          <div class="max-w-7xl mx-auto flex items-center justify-between gap-3 text-sm text-amber-900">
            <span>
              ⚠️ Impersonating
              <strong th:text="${effectiveUserEmail}">player@example.com</strong>
              (you are <span th:text="${originalUserEmail}">admin@example.com</span>)
            </span>
            <form hx-post="/admin/impersonation/stop" hx-swap="none">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <button
                type="submit"
                class="px-3 py-1 text-sm font-medium bg-amber-200 border border-amber-400 rounded hover:bg-amber-300"
              >
                Stop impersonating
              </button>
            </form>
          </div>
        </div>
      </th:block>
    </div>
  </body>
</html>
