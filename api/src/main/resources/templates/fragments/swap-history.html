<!--
  Swap history — the swaps made in the round being viewed, oldest first. Shared by the owner's own
  table and the public shared view.

  The isGuest check for guarding this lives at the call site.

  Parameter:
    open: 'true' to start expanded, 'false' to start collapsed
-->
<div
  th:fragment="history(open)"
  th:if="${swapHistory != null && !#lists.isEmpty(swapHistory)}"
  x-cloak
  class="border-t border-gray-100"
  th:attr="data-open=${open}"
  x-data="{ open: $el.dataset.open === 'true' }"
>
  <button
    @click="open = !open"
    type="button"
    class="w-full px-6 py-4 flex items-center justify-between text-left hover:bg-gray-50 transition-colors"
  >
    <span class="text-sm font-medium text-gray-700">
      Swap history
      <span
        class="ml-1 text-xs text-gray-400 font-normal"
        th:text="'(GW' + ${viewingRound} + ')'"
      ></span>
    </span>
    <svg
      class="h-4 w-4 text-gray-400 transition-transform duration-200"
      :class="open ? 'rotate-180' : ''"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M19 9l-7 7-7-7"
      />
    </svg>
  </button>
  <div
    x-show="open"
    x-transition
    class="border-t border-gray-100"
  >
    <ul class="divide-y divide-gray-100">
      <li
        th:each="entry, iterStat : ${swapHistory}"
        class="px-6 py-3 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-1"
      >
        <!-- whitespace-nowrap + scroll: one swap is one line, so the A→B ↔ B→A
           symmetry survives on narrow screens instead of orphaning the last "#17". -->
        <span
          class="text-sm font-mono text-gray-700 whitespace-nowrap overflow-x-auto max-w-full"
        >
          <span
            class="text-gray-300 mr-1.5 select-none"
            th:text="${iterStat.count} + '.'"
            >1.</span
          >
          <span
            class="font-semibold text-gray-900"
            th:text="${entry.teamACode}"
            >ARS</span
          >
          <span class="text-gray-400">#</span
          ><span th:text="${entry.teamAFrom}">1</span>
          <span class="text-gray-400">→</span>
          <span class="text-gray-400">#</span
          ><span th:text="${entry.teamATo}">4</span>
          <span class="mx-1 font-bold text-indigo-500">↔</span>
          <span
            class="font-semibold text-gray-900"
            th:text="${entry.teamBCode}"
            >CHE</span
          >
          <span class="text-gray-400">#</span
          ><span th:text="${entry.teamBFrom}">4</span>
          <span class="text-gray-400">→</span>
          <span class="text-gray-400">#</span
          ><span th:text="${entry.teamBTo}">1</span>
        </span>
        <span
          class="text-xs text-gray-400 whitespace-nowrap"
          th:attr="data-timestamp=${entry.formattedTime}"
          th:text="${entry.formattedTime}"
          >2026-02-12T14:23:00Z</span
        >
      </li>
    </ul>
  </div>
</div>
