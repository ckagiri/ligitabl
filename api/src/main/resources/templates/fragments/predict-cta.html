<!-- Predict CTA Copy Fragment -->
<!--
  Parameters:
    isPreSeasonRegistration: Boolean - unmerged pre-season registration (atRoundNumber == 0).

  Requires an Alpine `imported` boolean in scope at the call site — both callers declare
  x-data="{ imported: false }" with the same localStorage init.

  The `imported` branch is reachable only for a genuine guest import, which ligitabl.js gates
  on `isInitialPrediction && !isOpeningRound` — never a pre-season registration. (A stale guest
  key left over from browsing logged-out used to leak this branch to them; the page now
  dispatches `guest-storage-cleared` when it clears a key it did not import, which the callers
  listen for.)
-->
<th:block th:fragment="copy(isPreSeasonRegistration)">
  <span x-show="imported">We've loaded your prediction - review it and submit
    to join the competition.</span>
  <span x-show="!imported">
    <th:block th:if="${isPreSeasonRegistration}">Your table's saved — make up to 5 swaps if you want to
      change it.<span class="block mt-1">It carries forward each gameweek.</span></th:block>
    <th:block th:unless="${isPreSeasonRegistration}">Your table's ready — submit as-is to join, or make up to 5
      swaps.<span class="block mt-1">It carries forward each gameweek.</span></th:block>
  </span>
</th:block>
