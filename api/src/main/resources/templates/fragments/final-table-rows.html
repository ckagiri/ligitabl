<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <!--/*
      Entirely Alpine-rendered (x-for over `teams`), as in fragments/prediction-table.html, so a swap
      can reorder rows in place. Interactivity comes from the component (canEdit), so the read-only
      public view mounts the same fragment.

      Two columns from one `teams` array, so the two teams being traded are usually on screen
      together. Row styling mirrors prediction-table.html (badge, selection dot, amber dirty tint,
      arrows) plus a faint zone wash; selected and dirty use the -100 step to out-shout it. Hover is
      a ring so it layers over the wash.

      A copy rather than `interactive-table`, which is built on standings/fixtures/points/GD/form,
      none of which exist before GW1.
    */-->
    <!--/* One x-for with `columns-2` splitting it, so each row is keyed stably by team code and a selection patches one row instead of rebuilding a column. */-->
    <div th:fragment="table" class="gap-x-6 sm:columns-2">
      <template x-for="team in teams" :key="team.code">
        <div
          @click="onRowTap(team.code)"
          :data-team-code="team.code"
          :class="[
            canEdit() ? 'cursor-pointer hover:ring-1 hover:ring-gray-300' : 'no-hover',
            isSelected(team.code)
              ? 'bg-blue-100 ring-1 ring-blue-400'
              : (isDirty(team.code) ? 'bg-amber-100' : zoneRowClass(team.position))
          ]"
          class="prediction-row mb-1 flex break-inside-avoid items-center gap-2 overflow-hidden rounded-md border border-gray-100 py-2 pr-3 transition-all duration-200"
        >
              <!--/* Zone band: colour only, so it never competes with the row tints. */-->
              <span
                class="h-8 w-1 flex-shrink-0 rounded-r"
                :class="zoneBarClass(team.position)"
              ></span>

              <span
                class="w-6 flex-shrink-0 text-right text-sm font-bold text-gray-900"
                x-text="team.position"
              ></span>

              <span
                class="position-change w-6 flex-shrink-0 text-xs font-semibold"
                :class="{
                  'text-green-600': getPositionChange(team.code)?.startsWith('↑'),
                  'text-red-600': getPositionChange(team.code)?.startsWith('↓')
                }"
                x-text="getPositionChange(team.code)"
              ></span>

              <span
                class="flex h-7 w-7 flex-shrink-0 items-center justify-center rounded text-[11px] font-bold"
                :class="teamBadgeClasses(team.code)"
                x-text="team.code"
              ></span>

              <span class="flex min-w-0 flex-1 items-center gap-1">
                <!--/* Selection dot: the first tap of a swap. */-->
                <span
                  x-show="isSelected(team.code)"
                  class="flex-shrink-0 text-xs font-medium text-blue-600"
                  >●</span
                >
                <span class="truncate text-sm font-medium text-gray-900">
                  <span class="lg:hidden" x-text="team.shortName || team.name"></span>
                  <span class="hidden lg:inline" x-text="team.name"></span>
                </span>
              </span>

              <!--/*
                Live columns: where the team sits now, and the gap, on the prediction's row so "I
                said 3rd, they're 1st" reads left to right. Only while `hasLiveProgress`.
              */-->
              <template x-if="hasLiveProgress">
                <span class="flex flex-shrink-0 items-center gap-1.5">
                  <span
                    class="text-[10px] font-medium uppercase tracking-wide text-gray-400"
                    >now</span
                  >
                  <span
                    class="w-5 text-right text-sm font-semibold"
                    :class="liveOnTarget(team.code) ? 'text-emerald-600' : 'text-gray-700'"
                    x-text="livePosition(team.code) ?? '–'"
                  ></span>
                  <span
                    class="w-7 text-xs font-semibold"
                    :class="{
                      'text-green-600': liveMovement(team.code)?.startsWith('↑'),
                      'text-red-600': liveMovement(team.code)?.startsWith('↓')
                    }"
                    x-text="liveMovement(team.code)"
                  ></span>
                </span>
              </template>

              <span
                class="flex-shrink-0 text-[10px] font-semibold uppercase tracking-wide"
                :class="zoneTextClass(team.position)"
            x-text="zoneLabel(team.position)"
          ></span>
        </div>
      </template>
    </div>

    <!--/*
      The revealed result: prediction beside the real finish, with each row's distance.
      Server-rendered; resultRankings is non-null only once the row is scored. The thead is
      conditional: unconditional, it rendered as an empty strip with no rows; absent, nothing says
      which number is the finish and which the gap.
    */-->
    <table th:fragment="result" class="min-w-full divide-y divide-gray-200">
      <thead th:if="${resultRankings != null and !resultRankings.isEmpty()}">
        <tr class="bg-gray-50">
          <th
            scope="col"
            class="px-3 py-2 text-left text-xs font-medium uppercase tracking-wider text-gray-500"
          >
            You said
          </th>
          <th
            scope="col"
            class="px-3 py-2 text-left text-xs font-medium uppercase tracking-wider text-gray-500"
          >
            Club
          </th>
          <th
            scope="col"
            class="px-3 py-2 text-right text-xs font-medium uppercase tracking-wider text-gray-500"
          >
            Finished
          </th>
          <th
            scope="col"
            title="Places between your call and where the club actually finished"
            class="px-3 py-2 text-right text-xs font-medium uppercase tracking-wider text-gray-500"
          >
            Off by
          </th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200 bg-white">
        <tr th:each="row : ${resultRankings}">
          <td
            class="px-3 py-2 text-sm font-bold text-gray-900"
            th:text="${row.ranking.position}"
          >
            1
          </td>
          <td class="px-3 py-2 text-sm font-medium text-gray-900">
            <span
              th:with="team=${teamsByCode != null ? teamsByCode.get(row.ranking.code) : null}"
              th:text="${team != null ? (team.shorterName != null ? team.shorterName : team.shortName) : row.ranking.code}"
              >Team</span
            >
          </td>
          <td
            class="px-3 py-2 text-right text-sm text-gray-500"
            th:text="${row.standingsPosition}"
          >
            1
          </td>
          <td class="px-3 py-2 text-right text-sm">
            <span
              th:text="${row.hit}"
              th:classappend="${row.hit == 0} ? 'font-semibold text-emerald-600' : 'text-gray-500'"
              >0</span
            >
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
