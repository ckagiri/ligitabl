<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <!--
      Entirely Alpine-rendered (x-for over `teams`), matching fragments/prediction-table.html: a swap
      has to reorder rows in place, which server-rendered rows cannot do. Row data comes from the
      component's data-rows JSON, so team display names are available client-side.

      Interactivity is decided by the component (canEdit), not here — so the read-only public view
      mounts the same fragment and simply never enables tapping.

      Row markup mirrors fragments/prediction-table.html deliberately — badge, blue selection dot,
      amber dirty tint, ↑/↓ movement arrows — so the two games read as one product. It is a copy,
      not a reuse of `interactive-table`: that fragment is parameterised on standings/fixtures/
      points/GD/form, none of which exist before GW1, so reusing it would mount five toggles that
      render "-" for the entire pre-season.
    -->
    <table th:fragment="table" class="min-w-full table-fixed">
      <thead class="bg-gray-50">
        <tr>
          <th
            scope="col"
            class="w-12 px-2 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500 sm:w-16 sm:px-3"
          >
            Pos
          </th>
          <th
            scope="col"
            class="px-2 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500 sm:px-3"
          >
            Team
          </th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200 bg-white">
        <template x-for="team in teams" :key="team.code">
          <tr
            @click="onRowTap(team.code)"
            :data-team-code="team.code"
            :class="{
              'cursor-pointer hover:bg-gray-50': canEdit(),
              'no-hover': !canEdit(),
              'bg-blue-50': isSelected(team.code),
              'bg-amber-50': isDirty(team.code) && !isSelected(team.code),
              'transition-all duration-200': true
            }"
            class="prediction-row"
          >
            <td class="whitespace-nowrap px-2 py-4 sm:px-3">
              <div class="flex items-center">
                <span
                  class="mr-2 text-sm font-bold text-gray-900"
                  x-text="team.position"
                ></span>
                <!-- Movement since the last save, same arrows as the main table. -->
                <span
                  x-show="getPositionChange(team.code)"
                  :class="{
                    'text-green-600': getPositionChange(team.code)?.startsWith('↑'),
                    'text-red-600': getPositionChange(team.code)?.startsWith('↓')
                  }"
                  class="position-change text-xs font-semibold"
                  x-text="getPositionChange(team.code)"
                ></span>
              </div>
            </td>
            <td class="px-2 py-4 sm:px-3">
              <div class="flex min-w-0 items-center">
                <div
                  class="mr-2 flex h-7 w-7 flex-shrink-0 items-center justify-center rounded text-xs font-bold sm:mr-3 sm:h-8 sm:w-8"
                  :class="teamBadgeClasses(team.code)"
                  x-text="team.code"
                ></div>
                <div class="min-w-0 flex-1">
                  <div class="flex items-center gap-1">
                    <!-- Selection dot: the first tap of a swap. -->
                    <span
                      x-show="isSelected(team.code)"
                      class="flex-shrink-0 text-xs font-medium text-blue-600"
                      >●</span
                    >
                    <div class="truncate text-sm font-medium text-gray-900">
                      <span class="lg:hidden" x-text="team.shortName || team.name"></span>
                      <span class="hidden lg:inline" x-text="team.name"></span>
                    </div>
                  </div>
                </div>
              </div>
            </td>
          </tr>
        </template>
      </tbody>
    </table>

    <!--
      The revealed result: prediction beside the real finish, with the distance for each row.
      Server-rendered — nothing here is interactive, and resultRankings is non-null only once the
      row is scored (Change 5).
    -->
    <table
      th:fragment="result"
      class="min-w-full divide-y divide-gray-200 dark:divide-gray-700"
    >
      <thead>
        <tr>
          <th
            scope="col"
            class="px-3 py-2 text-left text-xs font-medium uppercase text-gray-500 dark:text-gray-400"
          >
            Predicted
          </th>
          <th
            scope="col"
            class="px-3 py-2 text-left text-xs font-medium uppercase text-gray-500 dark:text-gray-400"
          >
            Team
          </th>
          <th
            scope="col"
            class="px-3 py-2 text-left text-xs font-medium uppercase text-gray-500 dark:text-gray-400"
          >
            Actual
          </th>
          <th
            scope="col"
            class="px-3 py-2 text-left text-xs font-medium uppercase text-gray-500 dark:text-gray-400"
          >
            Off by
          </th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="row : ${resultRankings}">
          <td
            class="px-3 py-2 text-sm text-gray-500 dark:text-gray-400"
            th:text="${row.ranking.position}"
          >
            1
          </td>
          <td class="px-3 py-2 text-sm font-medium text-gray-900 dark:text-gray-100">
            <span
              th:with="team=${teamsByCode != null ? teamsByCode.get(row.ranking.code) : null}"
              th:text="${team != null ? (team.shorterName != null ? team.shorterName : team.shortName) : row.ranking.code}"
              >Team</span
            >
          </td>
          <td
            class="px-3 py-2 text-sm text-gray-500 dark:text-gray-400"
            th:text="${row.standingsPosition}"
          >
            1
          </td>
          <td class="px-3 py-2 text-sm">
            <span
              th:text="${row.hit}"
              th:classappend="${row.hit == 0} ? 'font-semibold text-emerald-600 dark:text-emerald-400' : 'text-gray-500 dark:text-gray-400'"
              >0</span
            >
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
