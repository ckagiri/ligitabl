<!-- What-If Swap Log: same visual format as predictions.html's "Swap History" section
     (predictions.html:455-515), but populated live from the sandbox's swapLog array instead
     of a server-rendered list. -->
<div
  th:fragment="swap-log"
  x-show="swapLog.length > 0"
  x-cloak
  class="mt-4 bg-white rounded-lg border border-gray-100"
  x-data="{ open: false }"
>
  <button
    @click="open = !open"
    type="button"
    class="w-full px-4 py-2.5 flex items-center justify-between text-left hover:bg-gray-50 rounded-lg transition-colors"
  >
    <span class="text-xs font-medium text-gray-700">Swap history</span>
    <svg
      class="h-3.5 w-3.5 text-gray-400 transition-transform duration-200"
      :class="open ? 'rotate-180' : ''"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M19 9l-7 7-7-7"
      />
    </svg>
  </button>
  <div x-show="open" x-transition class="border-t border-gray-100">
    <ul class="divide-y divide-gray-100">
      <template x-for="(entry, index) in swapLog" :key="index">
        <li class="px-4 py-2 text-xs font-mono text-gray-700">
          <span class="text-gray-300 mr-1 select-none" x-text="(index + 1) + '.'"></span>
          <span class="font-semibold text-gray-900" x-text="entry.teamACode"></span>
          <span class="text-gray-400">#</span><span x-text="entry.teamAFrom"></span>
          <span class="text-gray-400">→</span>
          <span class="text-gray-400">#</span><span x-text="entry.teamATo"></span>
          <span class="mx-1 font-bold text-indigo-500">↔</span>
          <span class="font-semibold text-gray-900" x-text="entry.teamBCode"></span>
          <span class="text-gray-400">#</span><span x-text="entry.teamBFrom"></span>
          <span class="text-gray-400">→</span>
          <span class="text-gray-400">#</span><span x-text="entry.teamBTo"></span>
        </li>
      </template>
    </ul>
  </div>
</div>
