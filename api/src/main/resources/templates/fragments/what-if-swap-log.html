<!--/* What-If Swap Log: formatted like the "Swap History" section on predictions.html, but filled
     live from the sandbox. Reads displayedSwapLog(), not the raw swapLog, which keeps every tap;
     the derived list matches getSwapCount().

     Titled "Sandbox swaps", not "Swap history": that is the permanent record on My Table, where
     swaps cost allowance; these cost nothing. */-->
<div
  th:fragment="swap-log"
  x-show="hasComputed && displayedSwapLog().length > 0"
  x-cloak
  class="border-t border-gray-100"
  x-data="{ open: true }"
>
  <button
    @click="open = !open"
    type="button"
    class="w-full px-6 py-4 flex items-center justify-between text-left hover:bg-gray-50 transition-colors"
  >
    <span class="text-sm font-medium text-gray-700">Sandbox swaps</span>
    <svg
      class="h-4 w-4 text-gray-400 transition-transform duration-200"
      :class="open ? 'rotate-180' : ''"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M19 9l-7 7-7-7"
      />
    </svg>
  </button>
  <div x-show="open" x-transition class="border-t border-gray-100">
    <!--/* Positions recomputed against a table that moved underneath (a submitted swap). Said beside the numbers, not in the submit notice. */-->
    <p
      x-show="swapsRebased"
      x-cloak
      class="px-6 pt-3 text-[11px] text-gray-400 leading-relaxed"
    >
      Positions updated for your new table.
    </p>
    <ul class="divide-y divide-gray-100">
      <!--/* One swap per line, so the A→B ↔ B→A symmetry survives; narrow screens shrink the type rather than scroll. */-->
      <template x-for="(entry, index) in displayedSwapLog()" :key="index">
        <li class="px-6 py-3 text-xs sm:text-sm font-mono text-gray-700 whitespace-nowrap">
          <span class="text-gray-300 mr-1 select-none" x-text="(index + 1) + '.'"></span>
          <span class="font-semibold text-gray-900" x-text="entry.teamACode"></span>
          <span class="text-gray-400">#</span><span x-text="entry.teamAFrom"></span>
          <span class="text-gray-400">→</span>
          <span class="text-gray-400">#</span><span x-text="entry.teamATo"></span>
          <span class="mx-1 font-bold text-indigo-500">↔</span>
          <span class="font-semibold text-gray-900" x-text="entry.teamBCode"></span>
          <span class="text-gray-400">#</span><span x-text="entry.teamBFrom"></span>
          <span class="text-gray-400">→</span>
          <span class="text-gray-400">#</span><span x-text="entry.teamBTo"></span>
        </li>
      </template>
    </ul>
  </div>
</div>
