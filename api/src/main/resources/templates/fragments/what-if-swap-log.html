<!-- What-If Swap Log: same visual format as predictions.html's "Swap History" section
     (predictions.html:455-515), but populated live from the sandbox's swapLog array instead
     of a server-rendered list.

     Titled "Sandbox swaps", deliberately not "Swap history": that name belongs to the real,
     permanent record on My Table, where swaps cost allowance. These are scratch moves that cost
     nothing and are thrown away, and two identically-titled lists of swaps invited exactly that
     confusion.
 -->
<div
  th:fragment="swap-log"
  x-show="hasComputed && swapLog.length > 0"
  x-cloak
  class="border-t border-gray-100"
  x-data="{ open: true }"
>
  <button
    @click="open = !open"
    type="button"
    class="w-full px-6 py-4 flex items-center justify-between text-left hover:bg-gray-50 transition-colors"
  >
    <span class="text-sm font-medium text-gray-700">Sandbox swaps</span>
    <svg
      class="h-4 w-4 text-gray-400 transition-transform duration-200"
      :class="open ? 'rotate-180' : ''"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M19 9l-7 7-7-7"
      />
    </svg>
  </button>
  <div x-show="open" x-transition class="border-t border-gray-100">
    <!-- These positions were recomputed against a table that moved under them (a submitted swap
         landed on the real table), so they read differently than when the user left. Said here,
         quietly, next to the numbers themselves rather than in the submit notice — it explains
         the list, not the submission. -->
    <p
      x-show="swapsRebased"
      x-cloak
      class="px-6 pt-3 text-[11px] text-gray-400 leading-relaxed"
    >
      Positions updated for your new table.
    </p>
    <ul class="divide-y divide-gray-100">
      <!-- One swap reads as one line: wrapping "#17" onto its own row breaks the
           A→B ↔ B→A symmetry that makes the entry scannable. Scroll instead. -->
      <template x-for="(entry, index) in swapLog" :key="index">
        <li class="px-6 py-3 text-sm font-mono text-gray-700 whitespace-nowrap overflow-x-auto">
          <span class="text-gray-300 mr-1 select-none" x-text="(index + 1) + '.'"></span>
          <span class="font-semibold text-gray-900" x-text="entry.teamACode"></span>
          <span class="text-gray-400">#</span><span x-text="entry.teamAFrom"></span>
          <span class="text-gray-400">→</span>
          <span class="text-gray-400">#</span><span x-text="entry.teamATo"></span>
          <span class="mx-1 font-bold text-indigo-500">↔</span>
          <span class="font-semibold text-gray-900" x-text="entry.teamBCode"></span>
          <span class="text-gray-400">#</span><span x-text="entry.teamBFrom"></span>
          <span class="text-gray-400">→</span>
          <span class="text-gray-400">#</span><span x-text="entry.teamBTo"></span>
        </li>
      </template>
    </ul>
  </div>
</div>
