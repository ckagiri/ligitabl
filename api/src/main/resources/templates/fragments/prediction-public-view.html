<div xmlns:th="http://www.thymeleaf.org">
<!-- Public Prediction View Fragment (historical/scored rounds — plain static table) -->
<!-- Parameters:
     rows: List of PublicRankDto (position, teamCode, teamName, actualPosition, delta)
     hasRoundResult: Boolean - whether the round has been scored (drives the score summary block
       and the last column's label — "Hit" once scored, "Delta" for a live/unscored comparison)
     totalScore, totalHits, zeroesCount: score summary fields, present when hasRoundResult

     Actual/Delta columns read `compareStandings` from an ancestor Alpine x-data scope (declared
     by the caller, e.g. public-predictions.html) — shown by default, hidden if the "Compare with
     current standings" checkbox is unticked.
-->
<div th:fragment="public-view(rows, hasRoundResult, totalScore, totalHits, zeroesCount)">
  <div class="px-6 py-4">
    <div class="overflow-x-auto sm:overflow-hidden">
      <table class="min-w-full table-fixed">
        <thead class="bg-gray-50">
          <tr>
            <th
              scope="col"
              class="sticky left-0 z-20 bg-gray-50 border-r border-gray-200 px-2 sm:static sm:left-auto sm:z-auto sm:bg-gray-50 sm:border-r-0 sm:px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-12 sm:w-16"
            >
              Pred
            </th>
            <th
              scope="col"
              class="px-2 sm:px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
            >
              Team
            </th>
            <th
              x-show="compareStandings"
              x-cloak
              scope="col"
              class="px-2 sm:px-3 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider w-14 sm:w-16"
            >
              Actual
            </th>
            <th
              x-show="compareStandings"
              x-cloak
              scope="col"
              class="px-2 sm:px-3 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider w-12 sm:w-14"
              th:text="${hasRoundResult} ? 'Hit' : 'Delta'"
            >
              Delta
            </th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          <tr
            th:each="row : ${rows}"
            class="hover:bg-gray-50 group"
          >
            <td class="sticky left-0 z-10 bg-white border-r border-gray-200 group-hover:bg-gray-50 px-2 sm:static sm:left-auto sm:z-auto sm:bg-transparent sm:border-r-0 sm:group-hover:bg-transparent sm:px-3 py-3 sm:py-4 whitespace-nowrap">
              <span
                class="text-xs sm:text-sm font-bold text-gray-900"
                th:text="${row.position}"
                >1</span
              >
            </td>
            <td class="px-2 sm:px-3 py-3 sm:py-4 whitespace-nowrap">
              <div class="flex items-center">
                <div
                  class="hidden sm:flex h-6 w-6 sm:h-8 sm:w-8 mr-2 sm:mr-3 bg-gray-200 rounded items-center justify-center text-xs font-bold flex-shrink-0"
                  th:text="${row.teamTla}"
                >
                  MCI
                </div>
                <div
                  class="text-xs sm:text-sm font-medium text-gray-900 truncate"
                  th:text="${row.teamName}"
                >
                  Manchester City
                </div>
              </div>
            </td>
            <td x-show="compareStandings" x-cloak class="px-2 sm:px-3 py-3 sm:py-4 whitespace-nowrap text-center">
              <span
                class="text-xs sm:text-sm text-gray-500"
                th:text="${row.actualPosition}"
                >2</span
              >
            </td>
            <td x-show="compareStandings" x-cloak class="px-2 sm:px-3 py-3 sm:py-4 whitespace-nowrap text-center">
              <span
                th:classappend="${row.delta == 0} ? 'text-green-600 font-bold' : (${row.delta <= 2} ? 'text-yellow-600' : 'text-red-600')"
                class="text-xs sm:text-sm font-semibold"
                th:text="${row.delta}"
                >0</span
              >
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Score Summary (only when this round has been scored) -->
  <div
    th:if="${hasRoundResult}"
    class="mt-4 text-center pb-4"
  >
    <div
      class="inline-flex flex-col items-center px-6 py-3 bg-gray-50 rounded-lg border border-gray-200"
    >
      <!-- Same shape as the owner's own historical summary (prediction-historical-view.html), with
           a "Score:" label since a visitor arriving on a share link has no context for a bare sum. -->
      <div class="flex items-center text-sm text-gray-600 mb-1">
        <span class="mr-1">Score:</span>
        <span class="font-mono" th:text="${maxHitPoints}">200</span>
        <span class="mx-2">−</span>
        <span class="font-mono" th:text="${totalHits}">92</span>
        <span class="mx-2">=</span>
        <span
          class="font-mono font-bold text-gray-900"
          th:text="${totalScore}"
          >108</span
        >
        <span class="ml-1">points</span>
        <span class="ml-1">
          <span th:replace="~{fragments/score-emoji :: emoji(${totalScore})}">
          </span>
      </div>

      <div class="text-xs text-green-600 font-semibold">
        🎯 <span th:text="${zeroesCount}">0</span> perfect predictions!
      </div>

      <div class="text-xs text-gray-500">
        (Max: <span th:text="${maxHitPoints}">200</span>, Lost:
        <span th:text="${totalHits}">92</span>)
      </div>
    </div>
  </div>
</div>

<!-- Public Rich Table Fragment (current/live round — comparison-options: standings/points/GD/
     fixtures/form). Entirely Alpine-rendered (x-for over `teams`, populated client-side from
     data-predictions), same as the owner's own interactive-table — but read-only: no click/select/
     drag, and Actual/Delta stay plain colored numbers (no arrows), unlike interactive-table. -->
<div th:fragment="public-rich-table" class="px-6 py-4">
  <div class="overflow-hidden">
    <table class="min-w-full table-fixed">
      <thead class="bg-gray-50">
        <tr>
          <th
            scope="col"
            class="px-2 sm:px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-10 sm:w-16"
          >
            Pred
          </th>
          <th
            scope="col"
            class="px-2 sm:px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
          >
            Team
          </th>
          <th
            x-show="showStandings"
            scope="col"
            class="hidden sm:table-cell px-3 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider w-20"
          >
            Actual
          </th>
          <th
            x-show="showStandings"
            scope="col"
            class="hidden sm:table-cell px-3 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider w-20"
          >
            Delta
          </th>
          <th
            x-show="showPoints"
            scope="col"
            class="hidden sm:table-cell px-3 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider w-16"
          >
            Pts
          </th>
          <th
            x-show="showGD"
            scope="col"
            class="hidden sm:table-cell px-3 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider w-16"
          >
            GD
          </th>
          <th
            x-show="showForm"
            scope="col"
            class="hidden sm:table-cell px-3 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider"
          >
            <span class="inline-flex items-center gap-1">
              Form
              <span
                class="relative"
                x-data="{ tip: false }"
                @mouseenter="tip = true"
                @mouseleave="tip = false"
              >
                <span class="text-gray-400 cursor-help leading-none">ⓘ</span>
                <span
                  x-show="tip"
                  x-transition.opacity.duration.100ms
                  class="absolute top-full right-0 mt-1.5 z-50
                         bg-white border border-gray-200 shadow-md rounded px-2 py-1
                         text-xs font-medium text-gray-700 whitespace-nowrap pointer-events-none normal-case tracking-normal"
                >
                  Hover a dot to see the match score
                  <span class="absolute bottom-full right-1 border-4 border-transparent border-b-gray-200"></span>
                </span>
              </span>
            </span>
          </th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <template x-for="(team, teamIndex) in teams" :key="team.code">
          <tr :data-team-code="team.code" class="hover:bg-gray-50 group">
            <td class="px-2 sm:px-3 py-4 whitespace-nowrap">
              <span class="text-sm font-bold text-gray-900" x-text="team.position"></span>
            </td>
            <td class="px-2 sm:px-3 py-4">
              <div class="flex items-center min-w-0">
                <div
                  class="h-7 w-7 sm:h-8 sm:w-8 mr-2 sm:mr-3 bg-gray-200 rounded flex items-center justify-center text-xs font-bold flex-shrink-0"
                  x-text="team.code"
                ></div>
                <div class="min-w-0 flex-1">
                  <div class="text-sm font-medium text-gray-900 truncate">
                    <span class="lg:hidden" x-text="team.shortName"></span>
                    <span class="hidden lg:inline" x-text="team.name"></span>
                  </div>

                  <!-- Mobile: Fixtures/Standings/Points/GD/Form combined -->
                  <div
                    x-show="showFixtures || showStandings || showPoints || showGD || showForm"
                    class="sm:hidden flex items-center gap-1.5 mt-1 flex-wrap"
                  >
                    <template x-if="showFixtures && hasFixtures(team.code)">
                      <template x-for="fixture in getFixtures(team.code)" :key="fixture.opponent">
                        <span
                          class="inline-flex items-center px-1.5 py-0.5 rounded text-[11px] font-medium"
                          :class="{
                            'bg-green-50 text-green-700': fixture.result === 'WIN',
                            'bg-red-50 text-red-700': fixture.result === 'LOSS',
                            'bg-amber-100 text-amber-700': fixture.result === 'DRAW',
                            'bg-blue-50 text-blue-700': fixture.status === 'LIVE',
                            'bg-violet-50 text-violet-700': fixture.status === 'POSTPONED',
                            'bg-gray-100 text-gray-600': fixture.status === 'SCHEDULED' || (!fixture.result && fixture.status !== 'LIVE' && fixture.status !== 'POSTPONED')
                          }"
                        >
                          <template x-if="fixture.status === 'LIVE'">
                            <span
                              class="inline-block w-1.5 h-1.5 bg-red-500 rounded-full mr-1"
                              style="animation: liveFade 1.2s ease-in-out infinite !important;"
                            ></span>
                          </template>
                          <span x-show="fixture.status === 'POSTPONED'" class="mr-1 font-bold">P</span>
                          <span x-show="!fixture.isHome">@</span><span x-text="fixture.opponent"></span>
                          <!-- Own goals first — see fragments/prediction-table.html. -->
                          <span
                            x-show="fixture.goalsFor != null && fixture.goalsAgainst != null"
                            class="ml-1 font-semibold"
                            x-text="fixtureScoreLabel(fixture)"
                          ></span>
                        </span>
                      </template>
                    </template>

                    <!-- Actual position + plain-number delta (no arrows) -->
                    <div x-show="showStandings" class="flex items-center gap-1 text-xs">
                      <span class="text-gray-500">Actual:</span>
                      <span class="text-gray-700 font-medium" x-text="getActualPosition(team.code)">2</span>
                      <span
                        class="font-semibold"
                        :class="getDelta(team.code) === 0 ? 'text-green-600' : (getDelta(team.code) <= 2 ? 'text-yellow-600' : 'text-red-600')"
                        x-text="getDelta(team.code)"
                      ></span>
                    </div>

                    <!-- Points + GD (mobile) -->
                    <div x-show="showPoints || showGD" class="flex basis-full items-center gap-1 text-xs">
                      <template x-if="showPoints">
                        <span class="flex items-center gap-1">
                          <span class="text-gray-700 font-medium" x-text="getCurrentPoints(team.code)"></span>
                          <span class="text-gray-500" x-text="getCurrentPoints(team.code) == 1 ? 'pt' : 'pts'"></span>
                        </span>
                      </template>
                      <template x-if="showPoints && showGD">
                        <span class="text-gray-400">•</span>
                      </template>
                      <template x-if="showGD">
                        <span
                          class="font-medium"
                          :class="{
                            'text-green-600': getGDDirection(team.code) === 'positive',
                            'text-red-600': getGDDirection(team.code) === 'negative',
                            'text-gray-500': getGDDirection(team.code) === 'neutral' || getGDDirection(team.code) === null
                          }"
                          x-text="getCurrentGD(team.code)"
                        ></span>
                      </template>
                    </div>

                    <!-- Form circles (mobile) -->
                    <template x-if="showForm && getForm(team.code).length > 0">
                      <div class="flex basis-full items-center gap-1.5 mt-0.5">
                        <span
                          class="inline-flex items-center gap-0.5 cursor-pointer"
                          @click.stop="showFormPopup(team.code, team.shortName)"
                        >
                          <template x-for="entry in getForm(team.code)" :key="entry.opponentCode + entry.result + entry.goalsFor">
                            <span
                              class="flex items-center justify-center w-2.5 h-2.5 flex-shrink-0"
                              :class="(entry.result === 'W' ? 'bg-green-500' : entry.result === 'D' ? 'bg-amber-400' : 'bg-red-500') + (entry.wasHome ? ' rounded-full' : '')"
                            ></span>
                          </template>
                        </span>
                        <span x-show="teamIndex === 0" class="text-[10px] text-gray-400">tap for scores</span>
                      </div>
                    </template>
                  </div>

                  <!-- Desktop: fixtures inline (standings/points/GD/form in their own columns) -->
                  <div x-show="showFixtures && hasFixtures(team.code)" class="hidden sm:flex items-center gap-1.5 mt-1">
                    <template x-for="fixture in getFixtures(team.code)" :key="fixture.opponent">
                      <span
                        class="inline-flex items-center px-1.5 py-0.5 rounded text-[11px] font-medium"
                        :class="{
                          'bg-green-50 border border-green-400 text-green-700': fixture.result === 'WIN',
                          'bg-red-50 border border-red-400 text-red-700': fixture.result === 'LOSS',
                          'bg-yellow-100 border border-yellow-500 text-yellow-700': fixture.result === 'DRAW',
                          'bg-blue-50 border border-blue-400 text-blue-700': fixture.status === 'LIVE',
                          'bg-violet-50 border border-violet-400 text-violet-700': fixture.status === 'POSTPONED',
                          'bg-gray-100 border border-gray-200 text-gray-600': fixture.status === 'SCHEDULED' || (!fixture.result && fixture.status !== 'LIVE' && fixture.status !== 'POSTPONED')
                        }"
                      >
                        <template x-if="fixture.status === 'LIVE'">
                          <span
                            class="inline-block w-1.5 h-1.5 bg-red-500 rounded-full mr-1"
                            style="animation: liveFade 1.2s ease-in-out infinite !important;"
                          ></span>
                        </template>
                        <span x-show="fixture.status === 'POSTPONED'" class="mr-1 font-bold">P</span>
                        <span x-show="!fixture.isHome">@</span><span x-text="fixture.opponent"></span>
                        <!-- Own goals first — see fragments/prediction-table.html. -->
                        <span
                          x-show="fixture.goalsFor != null && fixture.goalsAgainst != null"
                          class="ml-1 font-semibold"
                          x-text="fixtureScoreLabel(fixture)"
                        ></span>
                      </span>
                    </template>
                  </div>
                </div>
              </div>
            </td>

            <!-- Actual position - hide on mobile -->
            <td
              x-show="showStandings"
              class="hidden sm:table-cell px-3 py-4 whitespace-nowrap text-right text-sm text-gray-400"
              x-text="getActualPosition(team.code)"
            ></td>

            <!-- Delta - plain colored number, no arrow -->
            <td x-show="showStandings" class="hidden sm:table-cell px-3 py-4 whitespace-nowrap text-right">
              <span
                class="text-sm font-semibold"
                :class="getDelta(team.code) === 0 ? 'text-green-600' : (getDelta(team.code) <= 2 ? 'text-yellow-600' : 'text-red-600')"
                x-text="getDelta(team.code)"
              ></span>
            </td>

            <!-- Points - desktop -->
            <td
              x-show="showPoints"
              class="hidden sm:table-cell px-3 py-4 whitespace-nowrap text-right text-sm font-semibold text-gray-700"
              x-text="getCurrentPoints(team.code)"
            ></td>

            <!-- GD - desktop -->
            <td
              x-show="showGD"
              class="hidden sm:table-cell px-3 py-4 whitespace-nowrap text-right text-sm font-semibold"
              :class="{
                'text-green-600': getGDDirection(team.code) === 'positive',
                'text-red-600': getGDDirection(team.code) === 'negative',
                'text-gray-500': getGDDirection(team.code) === 'neutral' || getGDDirection(team.code) === null
              }"
              x-text="getCurrentGD(team.code)"
            ></td>

            <!-- Form circles - desktop -->
            <td x-show="showForm" class="hidden sm:table-cell px-3 py-4 whitespace-nowrap">
              <div class="flex items-center justify-center gap-0.5 select-none cursor-pointer" @contextmenu.prevent>
                <template x-for="entry in getForm(team.code)" :key="entry.opponentCode + entry.result + entry.goalsFor">
                  <span
                    class="relative flex-shrink-0"
                    x-data="{ tip: false }"
                    @mouseenter="tip = true"
                    @mouseleave="tip = false"
                  >
                    <span
                      class="flex items-center justify-center w-3 h-3 flex-shrink-0 cursor-help"
                      :class="(entry.result === 'W' ? 'bg-green-500' : entry.result === 'D' ? 'bg-amber-400' : 'bg-red-500') + (entry.wasHome ? ' rounded-full' : ' rounded-sm')"
                    ></span>
                    <span
                      x-show="tip"
                      x-transition.opacity.duration.100ms
                      class="absolute bottom-full right-0 mb-1.5 z-50
                             bg-white border border-gray-200 shadow-md rounded px-2 py-1
                             text-xs font-medium text-gray-700 whitespace-nowrap pointer-events-none"
                    >
                      <span>
                        <span x-text="formResultBefore(entry)"></span>
                        <span class="font-bold" x-text="team.code"></span>
                        <span x-text="formResultAfter(entry)"></span>
                      </span>
                      <span class="absolute top-full right-1 border-4 border-transparent border-t-gray-200"></span>
                    </span>
                  </span>
                </template>
                <span x-show="getForm(team.code).length === 0" class="text-gray-300 text-[11px]">—</span>
              </div>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>

  <!-- Mobile form popup — teleported to body to avoid fixed-position containment issues -->
  <template x-teleport="body">
    <div
      x-show="formPopup !== null || formPopupClosing"
      :class="formPopupClosing ? 'popup-backdrop-leave' : 'popup-backdrop-enter'"
      @click="hideFormPopup()"
      @touchend.prevent="hideFormPopup()"
      @contextmenu.prevent
      class="fixed inset-0 z-50 flex items-center justify-center px-4 bg-black/40"
      style="display:none"
    >
      <div
        @click.stop
        @touchstart.stop
        :class="formPopupClosing ? 'popup-card-leave' : 'popup-card-enter'"
        class="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden"
      >
        <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100">
          <span class="text-sm font-semibold text-gray-800" x-text="formPopup ? formPopup.teamName + ' — Last ' + formPopup.entries.length + (formPopup.entries.length === 1 ? ' match' : ' matches') : ''"></span>
          <button @click="hideFormPopup()" class="text-gray-400 hover:text-gray-600 p-1 -mr-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <ul class="divide-y divide-gray-50" x-show="formPopup !== null">
          <template x-for="entry in (formPopup ? formPopup.entries : [])" :key="entry.opponentCode + entry.result + entry.goalsFor">
            <li class="flex items-center gap-3 px-4 py-2.5">
              <span
                class="flex-shrink-0 w-6 h-6 flex items-center justify-center text-xs font-bold text-white"
                :class="(entry.result === 'W' ? 'bg-green-500' : entry.result === 'D' ? 'bg-amber-400' : 'bg-red-500') + (entry.wasHome ? ' rounded-full' : ' rounded-sm')"
                x-text="entry.result"
              ></span>
              <span class="text-sm text-gray-700 font-mono">
                <span>
                  <span x-text="formResultBefore(entry)"></span>
                  <span class="font-bold" x-text="formPopup.teamCode"></span>
                  <span x-text="formResultAfter(entry)"></span>
                </span>
              </span>
            </li>
          </template>
        </ul>
      </div>
    </div>
  </template>
</div>
</div>
