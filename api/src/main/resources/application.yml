spring:
  application:
    name: ligitabl

  datasource:
    # Prefer explicit SPRING_* if set; otherwise build from DB_* (host defaults to localhost)
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55432}/${DB_NAME:ligitabl}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:ligitabl}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:ligitabl}}
    driver-class-name: org.postgresql.Driver

  jooq:
    sql-dialect: POSTGRES

  liquibase:
    enabled: false
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    com:
      ligitabl: INFO
  pattern:
    level: "%5p [requestId=%X{requestId}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  # IMPORTANT: override in real environments
  secret: ${JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
  # Milliseconds
  expiration: ${JWT_EXPIRATION_MS:86400000}
