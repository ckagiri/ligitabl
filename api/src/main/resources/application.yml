spring:
  application:
    name: ligitabl

  datasource:
    # Prefer explicit SPRING_* if set; otherwise build from DB_* (host defaults to localhost)
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55432}/${DB_NAME:ligitabl}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:ligitabl}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:ligitabl}}
    driver-class-name: org.postgresql.Driver

  jooq:
    sql-dialect: POSTGRES

  liquibase:
    enabled: false
    change-log: classpath:db/changelog/db.changelog-master.yaml

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
    min-response-size: 1024
  servlet:
    session:
      timeout: 1d
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

logging:
  level:
    root: INFO
    org:
      springframework:
        security:
          config:
            annotation:
              authentication:
                configuration:
                  InitializeUserDetailsBeanManagerConfigurer: ERROR
        web: WARN
      jooq: WARN
    com:
      zaxxer:
        hikari: WARN
      ligitabl: INFO
  pattern:
    level: "%5p [requestId=%X{requestId}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  # IMPORTANT: override in real environments
  secret: ${JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
  # Milliseconds
  expiration: ${JWT_EXPIRATION_MS:86400000}

ligitabl:
  default-competition-slug: ${DEFAULT_COMPETITION_SLUG:premier-league}
  frontend:
    url: ${FRONTEND_URL:http://localhost:8080}
    share-url: ${FRONTEND_SHARE_URL:${ligitabl.frontend.url}}

  scheduling:
    enabled: true

  outbox:
    # Kill-switch for the relay only (other schedulers unaffected). While false,
    # events accumulate as PENDING and are delivered once re-enabled.
    enabled: ${OUTBOX_ENABLED:true}
    # Relay cadence and rows claimed per tick; stuck PROCESSING rows (crashed
    # mid-send) are swept back to FAILED every stuck-sweep interval.
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:15000}
    batch-size: ${OUTBOX_BATCH_SIZE:25}
    stuck-sweep-interval-ms: ${OUTBOX_STUCK_SWEEP_INTERVAL_MS:300000}

  rate-limit:
    # Per-client (per-IP) budget — each client gets its own bucket in RateLimitFilter.
    # In prod the real client IP comes from X-Forwarded-For via forward-headers-strategy=native.
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:120}

  security:
    password-reset-token-validity-minutes: ${PASSWORD_RESET_TOKEN_VALIDITY:30}
    email-verification-token-validity-hours: ${EMAIL_VERIFICATION_TOKEN_VALIDITY_HOURS:48}
    email-verification-resend-cooldown-minutes: ${EMAIL_VERIFICATION_RESEND_COOLDOWN_MINUTES:2}
    remember-me:
      key: ${REMEMBER_ME_KEY:dev-remember-me-key}
      token-validity-seconds: ${REMEMBER_ME_TOKEN_VALIDITY_SECONDS:1209600}

  email:
    provider: ${EMAIL_PROVIDER:logging}
    from-email: ${EMAIL_FROM:notifications@ligipredictor.com}
    from-name: ${EMAIL_FROM_NAME:LigiPredictor}
    mailgun:
      api-key: ${MAILGUN_API_KEY:}
      domain: ${MAILGUN_DOMAIN:ligipredictor.com}
      api-base-url: ${MAILGUN_API_BASE_URL:https://api.mailgun.net/v3}
    round-results:
      # Recipient cap per round (sprint-leaderboard order).
      top-n: ${ROUND_RESULTS_EMAIL_TOP_N:50}
      # live: exclude ignore-list/unverified/opted-out users.
      # test: send ONLY to ignore-list accounts (local testing against test users).
      mode: ${ROUND_RESULTS_EMAIL_MODE:live}
    join-reminder:
      # Off by default; enable per environment once rollout is ready.
      enabled: ${JOIN_REMINDER_ENABLED:false}
      # Backoff schedule (days since last seen); a user is emailed once per stage, at the latest
      # stage reached, never more than one per run, and never again after the last stage.
      stage-days: ${JOIN_REMINDER_STAGE_DAYS:1,4,11}
      # Hard-exclude users not seen (login, or last profile update) in this many days.
      max-stale-days: ${JOIN_REMINDER_MAX_STALE_DAYS:60}
      cron: ${JOIN_REMINDER_CRON:0 0 9 * * *}

  slack:
    # Incoming-webhook URL is a secret — env var only, never committed. Default disabled so
    # local/dev/CI run silently without a webhook configured.
    webhook-url: ${SLACK_WEBHOOK_URL:}
    new-user-webhook-url: ${SLACK_NEW_USER_WEBHOOK_URL:}
    enabled: ${SLACK_NOTIFICATIONS_ENABLED:false}
    timeout-seconds: ${SLACK_TIMEOUT_SECONDS:5}

  turnstile:
    # Defaults are Cloudflare's publicly documented "always passes" test keypair, so local dev
    # and CI never call the real siteverify API and are never blocked by it. Real keys are
    # injected via env vars in prod only.
    site-key: ${TURNSTILE_SITE_KEY:1x00000000000000000000AA}
    secret-key: ${TURNSTILE_SECRET_KEY:1x0000000000000000000000000000000AA}
    verify-url: ${TURNSTILE_VERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}
    timeout-seconds: ${TURNSTILE_TIMEOUT_SECONDS:5}
    # Operational kill-switch: flip to false via env var to stop blocking registrations during a
    # prolonged Cloudflare outage, without a deploy. Fail-closed (true) is the default/recommended
    # state.
    enabled: ${TURNSTILE_ENABLED:true}

football-data:
  api:
    url: https://api.football-data.org/v4
    token: ${FOOTBALL_DATA_API_TOKEN:your-api-token-here}
    timeout-seconds: 10
    retry-attempts: 3
  competition:
    code: PL # Premier League
  sync:
    # Match sync runs dynamically based on match status
    # Frequencies are calculated at runtime
    retry-on-failure-minutes: 5

# Round Advancement Configuration
round-advancement:
  # Daily at 6:00 AM
  cron: "0 0 6 * * *"

# Admin Notification Configuration
admin:
  email: ${ADMIN_EMAIL:admin@ligitabl.com}

  # Email Service (choose one when ready to migrate from stub)
  # email-provider: stub | spring-mail | sendgrid | mailgun
  email-provider: stub

workflow:
  run: false
  competition: PL
  exit-after: true

# Sentry — empty DSN disables it outside prod
sentry:
  dsn: ""
  send-default-pii: false

# Analytics — empty by default so localhost never sends tracking data
umami:
  website-id: ""
