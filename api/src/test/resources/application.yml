spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientWebSecurityAutoConfiguration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret

jwt:
  secret: test-secret-change-me-test-secret-change-me-32bytes-min
  expiration: 86400000

ligitabl:
  scheduling:
    enabled: false

football-data:
  api:
    url: https://api.football-data.org/v4
    token: test-token
    timeout-seconds: 1
    retry-attempts: 0
  competition:
    code: PL
