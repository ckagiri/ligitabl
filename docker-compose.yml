services:
  db:
    image: postgres:16
    container_name: ligitabl-db
    environment:
      POSTGRES_DB: ligi
      POSTGRES_USER: ligitabl
      POSTGRES_PASSWORD: ligitabl
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ligitabl -d ligi"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
    image: ligitabl:dev
    container_name: ligitabl-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Point Spring to the db container
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ligi
      SPRING_DATASOURCE_USERNAME: ligitabl
      SPRING_DATASOURCE_PASSWORD: ligitabl
      # Disable Liquibase until changelogs exist; remove to enable migrations
      SPRING_LIQUIBASE_ENABLED: "false"
      # Allow overriding extra JVM args at runtime via env file or compose overrides
      JAVA_OPTS: ""
    ports:
      - "8080:8080"

volumes:
  pgdata:
