services:
  db:
    image: postgres:16
    container_name: ligitabl-db
    env_file:
      - ${ENV_FILE:-.env.test}
    environment:
      POSTGRES_DB: ${DB_NAME:-ligitabl}
      POSTGRES_USER: ${DB_USER:-ligitabl}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ligitabl}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ligitabl} -d ${DB_NAME:-ligitabl}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: ligitabl:dev
    container_name: ligitabl-app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ${ENV_FILE:-.env.test}
        required: true
      - path: ${ENV_LOCAL_FILE:-.env.test.local}
        required: false
    environment:
      # Inside the container, connect to the 'db' service directly
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-ligitabl}
      DB_PASSWORD: ${DB_PASSWORD:-ligitabl}
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:8080}"
  # To enable Liquibase during app startup, set the liquibase Spring profile:
  # SPRING_PROFILES_ACTIVE: liquibase
      # Allow extra JVM args at runtime
      JAVA_OPTS: ${JAVA_OPTS:-}
    ports:
      - "${PORT:-8080}:8080"

volumes:
  pgdata:
