services:
  db:
    image: postgres:16
    container_name: ligitabl-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-ligitabl}
      POSTGRES_USER: ${DB_USER:-ligitabl}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ligitabl}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ligitabl} -d ${DB_NAME:-ligitabl}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: ligitabl:dev
    container_name: ligitabl-app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Point Spring to the db container (default) or override via .env
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/ligitabl}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-ligitabl}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-ligitabl}
      # Disable Liquibase until changelogs exist; remove to enable migrations
      SPRING_LIQUIBASE_ENABLED: ${SPRING_LIQUIBASE_ENABLED:-false}
      # Allow extra JVM args at runtime
      JAVA_OPTS: ${JAVA_OPTS:-}
    ports:
      - "${PORT:-8080}:8080"

volumes:
  pgdata:
