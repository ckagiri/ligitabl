services:
  # PostgreSQL Database
  db:
    image: postgres:16
    container_name: ligitabl-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ligitabl}
      POSTGRES_USER: ${POSTGRES_USER:-ligitabl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"  # localhost-only — not exposed publicly, enables SSH tunnelling
    networks:
      - ligitabl-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ligitabl}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m    # hard cap — gives Postgres room to cache on 2 GB droplet
        reservations:
          memory: 128m

  # Spring Boot API
  app:
    image: ${DOCKER_USERNAME}/ligitabl:${IMAGE_TAG:-api-latest}
    container_name: ligitabl-app-prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080

      # Database connection
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-ligitabl}
      DB_USER: ${POSTGRES_USER:-ligitabl}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      # Spring profiles (prod enables forwarded header handling; liquibase runs migrations on startup)
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod,liquibase}

      # Application secrets
      JWT_SECRET: ${JWT_SECRET}
      FOOTBALL_DATA_API_TOKEN: ${FOOTBALL_DATA_API_TOKEN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mailgun}
      EMAIL_FROM: ${EMAIL_FROM:-notifications@ligipredictor.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-LigiPredictor}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-ligipredictor.com}
      MAILGUN_API_BASE_URL: ${MAILGUN_API_BASE_URL:-https://api.mailgun.net/v3}
      FRONTEND_URL: ${FRONTEND_URL}
      LOGTAIL_TOKEN: ${LOGTAIL_TOKEN}

      # JVM options (tuned for 1 vCPU / 2 GB droplet)
      JAVA_OPTS: >-
        -Xmx512m
        -Xms128m
        -XX:+UseSerialGC
        -XX:ActiveProcessorCount=1
        -Djava.security.egd=file:/dev/./urandom

      # nginx-proxy integration
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      VIRTUAL_PORT: 8080
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}

    networks:
      - ligitabl-network
      - nginx

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    deploy:
      resources:
        limits:
          memory: 768m    # headroom above -Xmx512m for JVM metaspace + native threads
        reservations:
          memory: 256m

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ligitabl-network:
    driver: bridge
    name: ligitabl-network  # explicit name so one-shot containers can join without knowing the project prefix
  nginx:
    external: true

volumes:
  db-data:
    driver: local
